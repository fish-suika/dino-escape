function updateRocksFx(dt) {
  const R = CFG.rock;
  fxStep(ROCKS.sparks, dt, true); fxStep(ROCKS.dust, dt, false); pflush(ROCKS.sparks); pflush(ROCKS.dust);
  for (const g of ROCKS.rings) {
    if (g.t > g.life) { g.mesh.visible = false; continue; }
    g.t += dt; const f = Math.min(1, g.t / g.life), s = g.R * (0.25 + 0.75 * (1 - (1 - f) * (1 - f)));
    g.mesh.scale.set(s, s, 1); g.mesh.material.opacity = 0.9 * (1 - f);
  }
  for (const c of ROCKS.craters) {
    if (c.t > R.craterLife) { c.dark.visible = c.glow.visible = false; continue; }
    c.t += dt; const f = c.t / R.craterLife;
    c.dark.scale.set(c.R, c.R, 1); c.dark.material.opacity = 0.6 * Math.min(1, (1 - f) * 3.5);
    const gf = Math.max(0, 1 - c.t / 1.0); c.glow.scale.set(c.R * 0.8, c.R * 0.8, 1); c.glow.material.opacity = 0.7 * gf * gf;
    if (gf <= 0) c.glow.visible = false;
  }
  ROCKS.shake *= Math.exp(-R.shakeDecay * dt); if (ROCKS.shake < 0.004) ROCKS.shake = 0;
}

// 再スタート用：飛行中の噴石・火の粉・土煙・衝撃波・クレーター跡・揺れをすべて消す
function resetRocks() {
  for (const sl of ROCKS.slots) if (sl.id) rockRelease(sl);
  ROCKS.byId.clear(); ROCKS.shake = 0; ROCKS.frame = 0;
  [ROCKS.sparks, ROCKS.dust].forEach(S => { S.age.fill(1e9); S.alpha.fill(0); S.cursor = 0; pflush(S); });
  ROCKS.rings.forEach(g => { g.t = 99; g.mesh.visible = false; });
  ROCKS.craters.forEach(c => { c.t = 99; c.dark.visible = c.glow.visible = false; });
}
// ===== 障害物の見た目：岩・倒木・クレーター・マグマ溜まり（three.js） =====
// 状態（どこに何があるか）は 28-obstacle-logic.js の OB.list が持つ。ここはメッシュを使い回して映すだけ。
// ジオメトリ・マテリアルは種類ごとに 1 つを共有し、プール（固定数のスロット）を貸し借りする。毎フレーム新しく作らない。
const OBS = { frame: 0, T: 0, byId: new Map(), pools: {} };

function buildObstacles() {
  const scene = WORLD.scene, N = Math.ceil((CFG.obstacle.aheadDist + CFG.obstacle.behindDist) / CFG.obstacle.minGapZ) + 2;

  // 共有ジオメトリ（岩：装飾の岩より少し角ばってゆがませ、明るい縁取りの殻を重ねる）
  const rockGeo = new THREE.DodecahedronGeometry(1, 1), rp = rockGeo.attributes.position;
  for (let i = 0; i < rp.count; i++) { const k = 1 + Math.sin(rp.getX(i) * 5.3 + rp.getY(i) * 8.1 + rp.getZ(i) * 3.7) * 0.1; rp.setXYZ(i, rp.getX(i) * k, rp.getY(i) * k, rp.getZ(i) * k); }
  rockGeo.computeVertexNormals();
  const rockMat = new THREE.MeshPhongMaterial({ color: 0x7c6d62, emissive: 0x1c0c06, specular: 0x222222, shininess: 6, flatShading: true });
  const rimMat = new THREE.MeshBasicMaterial({ color: 0xe9a468, side: THREE.BackSide });
  const logGeo = new THREE.CylinderGeometry(1, 1, 1, 7, 1).rotateZ(Math.PI / 2);   // 軸が x 方向の長さ 1 の幹
  const logMat = new THREE.MeshPhongMaterial({ color: 0x1f1612, emissive: 0x240a03, specular: 0x111111, shininess: 4, flatShading: true });
  const stubGeo = new THREE.ConeGeometry(0.16, 0.9, 5), stubMat = new THREE.MeshLambertMaterial({ color: 0x120d0a, emissive: 0x3a1004, flatShading: true });
  const capMat = new THREE.MeshLambertMaterial({ color: 0x5a2410, emissive: 0xc2410a, emissiveIntensity: 0.6, flatShading: true });
  const capGeo = new THREE.CircleGeometry(0.85, 7);
  const flat = (geo, mat, y, off) => {   // 地面に貼る面（XY で作って寝かせる）
    mat.transparent = true; mat.depthWrite = false; mat.side = THREE.DoubleSide; mat.polygonOffset = true; mat.polygonOffsetFactor = off; mat.polygonOffsetUnits = off;
    const m = new THREE.Mesh(geo, mat); m.rotation.x = -Math.PI / 2; m.position.y = y; return m;
  };
  const ringGeo = new THREE.RingGeometry(0.8, 1.12, 32), discGeo = new THREE.CircleGeometry(1, 36), crustGeo = new THREE.RingGeometry(0.96, 1.3, 36);
  const rimGroundMat = new THREE.MeshLambertMaterial({ color: 0x75604f });
  const holeMat = new THREE.MeshBasicMaterial({ color: 0x0b0605 });
  const holeMat2 = new THREE.MeshBasicMaterial({ color: 0x000000, opacity: 0.85 });
  const crustMat = new THREE.MeshBasicMaterial({ color: 0x2b130a });
  OBS.lavaTex = makeLavaTexture(); OBS.lavaTex.repeat.set(1.4, 1.4);
  const lavaMat = new THREE.MeshBasicMaterial({ map: OBS.lavaTex, color: 0xffffff });
  const glowMat = new THREE.SpriteMaterial({ map: makeSoftTexture(), color: 0xff6a1a, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, fog: false, opacity: 0.55 });
  OBS.lavaMat = lavaMat; OBS.glowMat = glowMat;

  const mk = {
    rock() {
      const g = new THREE.Group(), body = new THREE.Mesh(rockGeo, rockMat), rim = new THREE.Mesh(rockGeo, rimMat);
      rim.scale.setScalar(1.06); g.add(rim, body); g.userData.body = body; g.userData.rim = rim; return g;
    },
    log() {
      const g = new THREE.Group(), trunk = new THREE.Mesh(logGeo, logMat); g.add(trunk);
      const stubs = [0, 1, 2].map(() => { const s = new THREE.Mesh(stubGeo, stubMat); g.add(s); return s; });
      const caps = [-1, 1].map(s => { const c = new THREE.Mesh(capGeo, capMat); c.rotation.y = s * Math.PI / 2; g.add(c); return c; });   // 切り口は赤くくすぶる
      g.userData = { trunk, stubs, caps }; return g;
    },
    crater() {
      const g = new THREE.Group(), fg = new THREE.Group();   // fg：半径倍に拡大する平面だけの入れ物
      fg.add(flat(ringGeo, rimGroundMat.clone(), 0.05, -2), flat(discGeo, holeMat.clone(), 0.06, -3));
      const inner = flat(discGeo, holeMat2.clone(), 0.07, -4); inner.scale.set(0.55, 0.55, 1); fg.add(inner); g.add(fg); g.userData.fg = fg; return g;
    },
    pool() {
      const g = new THREE.Group(), fg = new THREE.Group(), glow = new THREE.Sprite(glowMat);
      fg.add(flat(crustGeo, crustMat.clone(), 0.05, -2), flat(discGeo, lavaMat, 0.07, -4)); g.add(fg); glow.position.y = 0.9; g.add(glow);
      g.userData.fg = fg; g.userData.glow = glow; return g;
    }
  };

    OBS.pools[type] = [];
    for (let i = 0; i < N; i++) { const group = mk[type](); group.visible = false; scene.add(group); OBS.pools[type].push({ id: 0, seen: 0, group, type }); }
  }
}

// 障害物 ob にスロットを割り当てて、形・向き・位置を一度だけ決める（動かないのでその後は触らない）
function obstacleSlotFor(ob) {
  let sl = OBS.byId.get(ob.id);
  if (sl) return sl;
  sl = OBS.pools[ob.type].find(s => !s.id); if (!sl) return null;
  sl.id = ob.id; OBS.byId.set(ob.id, sl);
  const g = sl.group, u = g.userData;
  g.position.set(ob.x, 0, ob.z); g.rotation.set(0, 0, 0); g.scale.set(1, 1, 1);
  if (ob.type === 'rock') {
    u.body.scale.set(ob.r, ob.h * 0.52, ob.r * 0.9); u.body.position.y = ob.h * 0.46; u.body.rotation.set(0, (ob.id * 1.7) % 6.28, 0);
    u.rim.scale.copy(u.body.scale).multiplyScalar(1.06); u.rim.position.copy(u.body.position); u.rim.rotation.copy(u.body.rotation);
  } else if (ob.type === 'log') {
    u.trunk.scale.set(ob.len, ob.r, ob.r); u.trunk.position.y = ob.r;
    u.stubs.forEach((s, i) => { s.position.set(ob.len * (-0.3 + 0.3 * i + ((ob.id * 0.37 + i) % 1) * 0.1), ob.r * 1.5, ((i + ob.id) % 2 ? 0.2 : -0.2)); s.rotation.set((i + ob.id) % 2 ? 0.5 : -0.5, 0, ((i + ob.id) % 3 - 1) * 0.25); });
    u.caps.forEach((c, i) => { c.position.set((i ? 1 : -1) * ob.len / 2, ob.r, 0); c.scale.setScalar(ob.r / 0.85 * 0.95); });
    g.rotation.y = ((ob.id * 0.61) % 1 - 0.5) * 0.14;   // ほんの少し斜め（当たり判定は軸平行のまま。見た目の誤差は ±0.7u 以内）
  } else {
    u.fg.scale.set(ob.r, 1, ob.r);   // 平らな円なので半径倍
    if (ob.type === 'pool') { u.glow.scale.set(ob.r * 2.6, ob.r * 2.6, 1); u.glow.userData.s = ob.r * 2.6; }
    u.fg.rotation.y = ob.id;
  }
  g.visible = true;
  return sl;
}

function obstacleRelease(sl) { OBS.byId.delete(sl.id); sl.id = 0; sl.group.visible = false; }

// 毎フレーム：リストにある障害物を映し、消えたものはスロットを返す。マグマ溜まりだけゆらぐ
function syncObstacles(OB, dt) {
  OBS.frame++; OBS.T += dt; const T = OBS.T;
  for (const ob of OB.list) { const sl = obstacleSlotFor(ob); if (sl) sl.seen = OBS.frame; }
  for (const type in OBS.pools) for (const sl of OBS.pools[type]) if (sl.id && sl.seen !== OBS.frame) obstacleRelease(sl);
  OBS.lavaTex.offset.set(T * 0.03, T * 0.02);
  const flick = 0.85 + 0.15 * Math.sin(T * 5.3) * Math.sin(T * 3.1 + 1);
  OBS.lavaMat.color.setRGB(flick, flick * 0.92, flick * 0.9);
  OBS.glowMat.opacity = 0.42 + 0.16 * Math.sin(T * 4.1 + 0.6);
  for (const sl of OBS.pools.pool) if (sl.id) { const gl = sl.group.userData.glow, s = gl.userData.s * (1 + 0.05 * Math.sin(T * 6 + sl.id)); gl.scale.set(s, s, 1); }
}

// 再スタート用：すべてのスロットを返す
function resetObstaclesView() {
  for (const type in OBS.pools) for (const sl of OBS.pools[type]) if (sl.id) obstacleRelease(sl);
  OBS.byId.clear(); OBS.frame = 0; OBS.T = 0;
}
// ===== Phase 7 演出のつなぎ（画面揺れの統合・被弾の演出・足元の土煙・音の発火・HUD の動き） =====
// 計算の核（合成・上限・ヒットストップ・ダッキング・足音の数え方）は 24-fx-logic.js。ここは three.js / DOM / 音へ流すだけ。
// 調整値は CFG.fx。CFG.fx.intensity（0〜1）で全体をまとめて弱められる。
const FXS = fxNew();   // ヒットストップ・ダッキング・音の間隔の状態
const FXV = { G: null, dino: null, t: 0, prevGrounded: true, prevRun: true, lastVy: 0, runAcc: 0, prevPhase: 0, takeoffT: 9, landT: 9, landStr: 0, fear: 0, panic: 0, stage: -1 };

function fxBuild(G, dino) {
  FXV.G = G; FXV.dino = dino;
  FXV.$vig = document.getElementById('hitVig'); FXV.$edge = document.getElementById('edge'); FXV.$hint = document.getElementById('hint'); FXV.$danger = document.getElementById('danger');
  fxResetView();
}

// 再スタート用
function fxResetView() {
  fxReset(FXS);
  Object.assign(FXV, { t: 0, prevGrounded: true, prevRun: true, lastVy: 0, runAcc: 0, prevPhase: 0, takeoffT: 9, landT: 9, landStr: 0, fear: 0, panic: 0, stage: -1 });
  if (FXV.dino) { FXV.dino.fear = 0; FXV.dino.panic = 0; FXV.dino.squash = 1; }
  if (FXV.$vig) FXV.$vig.classList.remove('on');
  if (FXV.$edge) FXV.$edge.style.opacity = 0;
  fxRestartHint();

}

// 操作ヒント：数秒たったらフェードアウト（再スタートでまた出す）
function fxRestartHint() {
  const h = FXV.$hint; if (!h) return;
  h.classList.remove('on'); void h.offsetWidth;
  h.style.animationDelay = CFG.fx.hintSec + 's'; h.classList.add('on');

// 被弾の赤い縁
function fxVignette(alpha) {

  const a = alpha * fxInt(); if (a <= 0.01) return;
  v.style.setProperty('--vigA', a.toFixed(2)); v.style.setProperty('--vigSec', CFG.fx.vignette.sec + 's');
  v.classList.remove('on'); void v.offsetWidth; v.classList.add('on');
}

// 噴石の直撃（size）/ 障害物で転倒（'trip'）：ヒットストップ・赤い縁・揺れ・ダッキング・ドン！＋鳴き声
function fxOnHit(kind, size) {
  const F = CFG.fx;
  if (kind === 'rock') {
    const big = size === 'large', pw = CFG.rock.sizes[size].power;
    fxHitstop(FXS, big ? F.hitstop.big : F.hitstop.rock);
    fxVignette(F.vignette.alpha * (0.6 + 0.4 * Math.min(1, pw / 1.8)));
    ROCKS.shake = Math.max(ROCKS.shake, F.shake.hitAmp * (big ? 1.2 : 1) * fxInt());
    fxDuck(FXS, F.duck.hit, 0.1);
    sndHit(pw);
  } else {
    fxHitstop(FXS, F.hitstop.trip);
    fxVignette(F.vignette.alpha * 0.45);
  }
}

// 危険マーカーが近くに出たとき「ピッ」
function fxMarkerAppear(r) {
  const G = FXV.G; if (!G) return;
  const B = CFG.fx.beep, P = G.P, d = Math.hypot(r.x - P.x, r.z - P.z) - r.radius;
  if (d < B.range && P.state === 'run' && fxCooldown(FXS, 'beep', FXV.t, B.gap)) sndBeep(r.size);
}

// 危険度（0〜3）が上がったとき：スティンガーと HUD の拡大
function fxStage(stage) {
  if (stage > FXV.stage && FXV.stage >= 0) {
    sndStinger(stage); fxDuck(FXS, 0.2, 0.2);
    const d = FXV.$danger; if (d) { d.classList.remove('pop'); void d.offsetWidth; d.classList.add('pop'); }
  }

}

// 毎フレーム（updateDino の前）：恐竜の表情の入力・ジャンプ/着地・足音・土煙・ダッキングの反映・噴火の縁
function fxFrame(dt, c) {
  const G = FXV.G, P = G.P, d = FXV.dino, k = fxInt(), F = CFG.fx;
  FXV.t += dt;
  const run = P.state === 'run' && c.alive;
  // 恐竜の表情：近い危険マーカー / 近いマグマ
  const near = fxNearRock(G.RS.rocks, P, F.fear.range);
  FXV.fear += ((run ? near.nearness : 0) - FXV.fear) * (1 - Math.exp(-10 * dt));
  FXV.panic += ((c.alive && G.M.active ? magmaProx(c.gap, F.panic.range) : 0) - FXV.panic) * (1 - Math.exp(-6 * dt));
  d.fear = FXV.fear; d.panic = FXV.panic;
  // ジャンプと着地
  FXV.takeoffT += dt; FXV.landT += dt;
  if (run && FXV.prevRun) {
    if (FXV.prevGrounded && !P.grounded && P.vy > 0) { FXV.takeoffT = 0; sndJump(); }
    if (!FXV.prevGrounded && P.grounded) {
      const str = fxClamp01(-FXV.lastVy / CFG.jump.velocity);
      if (str > 0.15) {
        FXV.landT = 0; FXV.landStr = str; sndLand(str);
        const n = Math.round(F.landDust * k * (0.5 + 0.5 * str));
        for (let i = 0; i < n; i++) {
          const a = rnd(0, 6.283), sp = rnd(3, 7) * (0.6 + 0.4 * str);
          fxEmit(ROCKS.dust, P.x + Math.cos(a) * 0.5, 0.15, P.z + Math.sin(a) * 0.5, Math.cos(a) * sp, rnd(0.5, 2), Math.sin(a) * sp, rnd(0.5, 0.9), rnd(1.4, 2.4), 0.55, 0);
        }

    }
  }
  if (!P.grounded) FXV.lastVy = P.vy;
  FXV.prevGrounded = P.grounded; FXV.prevRun = run;
  d.squash = fxSquash(FXV.takeoffT, FXV.landT, FXV.landStr);
  // 足音（速度連動：速いほど歩数が増え、少し強くなる）と走りの土煙
  const steps = fxStepCount(FXV.prevPhase, d.phase); FXV.prevPhase = d.phase;
  if (run && P.grounded && P.speed > 2) {
    for (let i = 0; i < steps; i++) sndStep(P.speed / CFG.run.maxSpeed);
    FXV.runAcc += P.speed * dt * F.runDust.perUnit * k;
    while (FXV.runAcc >= 1) {
      FXV.runAcc -= 1;
      fxEmit(ROCKS.dust, P.x + rnd(-0.5, 0.5), 0.15, P.z + 0.9, rnd(-1, 1) - P.vx * 0.2, rnd(0.5, 1.6), rnd(3, 6), rnd(0.45, 0.8), F.runDust.size * rnd(0.8, 1.3) * (0.7 + 0.6 * P.speed / CFG.run.maxSpeed), 0.4, 0);
    }
  }
  sndSetDuck(fxDuckStep(FXS, dt));

  if (FXV.$edge) {

    FXV.$edge.style.opacity = e.toFixed(3);
  }
}

// 画面揺れ（位置のみ）：火山の噴火 / 噴石の着弾・被弾 / 最終逃走の常時 / マグマ接近 を二乗和の平方根で合成し、cap で頭打ち
function fxCamera(T, amps) {
  const a = fxShakeTotal(amps); if (a <= 0) return;
  const cam = WORLD.camera;
  cam.position.x += (Math.sin(T * 83) * 0.6 + Math.sin(T * 53) * 0.4) * a;
  cam.position.y += (Math.cos(T * 71) * 0.6 + Math.cos(T * 61) * 0.4) * a * 0.8;
}
// ===== 恐竜（基本 Geometry だけのコミカルな1種類）。頭は -z 向き =====
function buildDino() {
  const D = CFG.dino;
  const skin = new THREE.MeshLambertMaterial({ color: 0x6fbf4a, flatShading: true });
  const belly = new THREE.MeshLambertMaterial({ color: 0xd9e59a, flatShading: true });
  const dark = new THREE.MeshLambertMaterial({ color: 0x4a8f32, flatShading: true });
  const spike = new THREE.MeshLambertMaterial({ color: 0xf29a3a, flatShading: true });
  const white = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const black = new THREE.MeshBasicMaterial({ color: 0x111111 });

  const root = new THREE.Group();   // 位置（プレイヤー座標）と傾き
  const body = new THREE.Group(); root.add(body);   // 弾み・ピッチ

  const torso = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 10), skin); torso.scale.set(0.85, 0.8, 1.25); torso.position.set(0, 1.6, 0.1); body.add(torso);
  const tummy = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8), belly); tummy.scale.set(0.6, 0.55, 1.0); tummy.position.set(0, 1.35, -0.15); body.add(tummy);
  for (let i = 0; i < 4; i++) {   // 背びれ
    const sp = new THREE.Mesh(new THREE.ConeGeometry(0.22 - i * 0.02, 0.5, 5), spike); sp.position.set(0, 2.4 - i * 0.06, 0.55 - i * 0.42); body.add(sp);
  }

  const head = new THREE.Group(); head.position.set(0, 2.2, -1.0); body.add(head);
  const skull = new THREE.Mesh(new THREE.SphereGeometry(0.62, 12, 10), skin); head.add(skull);
  const snout = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.38, 0.6), skin); snout.position.set(0, -0.08, -0.55); head.add(snout);
  const jawPivot = new THREE.Group(); jawPivot.position.set(0, -0.3, -0.25); head.add(jawPivot);   // 口を開けるための蝶番（顎の付け根）
  const jaw = new THREE.Mesh(new THREE.BoxGeometry(0.58, 0.14, 0.56), belly); jaw.position.set(0, 0, -0.25); jawPivot.add(jaw);
  const eyes = [], pups = [];
  [-1, 1].forEach(s => {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.2, 10, 8), white); eye.position.set(s * 0.3, 0.28, -0.32); head.add(eye); eyes.push(eye);
    const pup = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 6), black); pup.position.set(s * 0.31, 0.28, -0.48); head.add(pup); pups.push(pup); pup.userData.base = [s * 0.31, 0.28, -0.48];
    const nos = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 5), black); nos.position.set(s * 0.14, 0.02, -0.86); head.add(nos);
  });

  [-1, 1].forEach(s => {   // ちいさな腕
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.14, 0.45), dark); arm.position.set(s * 0.72, 1.55, -0.65); arm.rotation.y = s * -0.3; body.add(arm);
  });

  const tail1 = new THREE.Group(); tail1.position.set(0, 1.6, 1.15); body.add(tail1);
  const t1 = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.5, 7).translate(0, 0.75, 0).rotateX(Math.PI / 2), skin); tail1.add(t1);
  const tail2 = new THREE.Group(); tail2.position.set(0, 0, 1.3); tail1.add(tail2);
  const t2 = new THREE.Mesh(new THREE.ConeGeometry(0.32, 1.4, 7).translate(0, 0.7, 0).rotateX(Math.PI / 2), dark); tail2.add(t2);

  const legs = [-1, 1].map(s => {   // 脚：股関節のピボットから下へ
    const hip = new THREE.Group(); hip.position.set(s * 0.5, 1.2, 0.3); root.add(hip);
    const thigh = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.85, 0.5), skin); thigh.position.y = -0.4; hip.add(thigh);
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.2, 0.75), dark); foot.position.set(0, -0.88, -0.14); hip.add(foot);
    return hip;
  });

  const shadow = new THREE.Mesh(new THREE.CircleGeometry(1.3, 20), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35 }));
  shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.03; shadow.scale.set(0.9, 1.4, 1);

  const group = new THREE.Group(); group.add(root); group.add(shadow);
  return { group, root, body, head, tail1, tail2, legs, shadow, torso, eyes, pups, jawPivot, phase: 0, air: 0, fear: 0, panic: 0, squash: 1 };
}

// 表情：widen=目の見開き 0〜1 / jaw=口の開き 0〜1 / dizzy=目が回る時計（0 なら回らない）。小さな変化だけで「焦り」を出す
function dinoFace(d, widen, jaw, dizzy) {
  const k = fxInt(), w = widen * k;
  d.eyes.forEach(e => e.scale.setScalar(1 + 0.4 * w));
  d.pups.forEach((p, i) => {
    const b = p.userData.base;
    p.scale.setScalar(1 - 0.35 * w);
    if (dizzy > 0) { const a = dizzy * 13 + i * 2.1; p.position.set(b[0] * 0.8 + Math.cos(a) * 0.1, b[1] + Math.sin(a) * 0.1, b[2] + 0.1); }   // 目がぐるぐる
    else p.position.set(b[0], b[1], b[2]);
  });
  d.jawPivot.rotation.x = -0.55 * jaw * k;
}

function updateDino(d, P, dt) {
  const D = CFG.dino, k = fxInt(), fear = d.fear || 0, panic = d.panic || 0;
  d.phase += P.speed * dt * D.runFreq * (1 + 0.45 * panic * k);   // マグマが近いと脚の回転が速い（必死な走り）
  d.air += ((P.grounded ? 0 : 1) - d.air) * (1 - Math.exp(-14 * dt));   // 空中ポーズへのなめらかな切り替え
  const sw = Math.sin(d.phase), a = d.air, g = 1 - a;
  d.group.position.set(P.x, 0, P.z);
  d.group.visible = !(P.invuln > 0 && Math.floor(P.time * 14) % 2 === 0);   // 復帰後の無敵中は点滅
  d.body.scale.set(1, 1, 1); d.head.position.y = 2.2; d.torso.scale.y = 0.8; d.root.rotation.z = 0;
  if (P.state === 'dead') { updateDinoDead(d, P); return; }
  if (P.state !== 'run') { updateDinoHit(d, P); return; }
  d.root.position.z = 0; d.root.rotation.x = 0;
  const sq = d.squash == null ? 1 : d.squash;   // 離陸前の溜め・着地のつぶれ（縦に縮めて横に広げる）
  d.body.scale.set(1 / Math.sqrt(sq), sq, 1 / Math.sqrt(sq));
  d.root.position.y = P.y;
  const H = CFG.hit, dz = P.invuln > H.invulnSec - 0.6 ? (P.invuln - (H.invulnSec - 0.6)) / 0.6 : 0;   // 起き上がった直後：目が回ってよろめく
  d.root.rotation.z = -P.vx * D.lean + Math.sin(P.time * 15) * 0.12 * dz;
  d.root.rotation.y = -P.vx * D.lean * 0.7;
  const st = P.stumbleT > 0 ? Math.sin(P.stumbleT / CFG.obstacle.stumble.tiltSec * Math.PI) : 0;   // クレーターでつまずく：前のめりにガクッ
  d.body.position.y = g * Math.abs(sw) * D.bob - st * 0.18;
  d.body.rotation.x = g * Math.sin(d.phase * 2) * 0.04 + a * Math.max(-0.5, Math.min(0.5, P.vy * 0.03)) - st * 0.45;   // 上昇で鼻先が上、下降で下
  const lg = 1 + 0.25 * panic * k;   // 必死なときは脚の振れも大きい
  d.legs[0].rotation.x = g * sw * D.legSwing * lg + a * D.tuck * 0.9;
  d.legs[1].rotation.x = g * -sw * D.legSwing * lg + a * D.tuck * 0.5;
  d.tail1.rotation.y = g * Math.sin(d.phase) * D.tailSwing;
  d.tail2.rotation.y = g * Math.sin(d.phase - 1.0) * D.tailSwing * 1.2;
  d.tail1.rotation.x = -a * 0.35 + g * Math.sin(d.phase * 2) * 0.05 - fear * 0.32 * k + Math.sin(P.time * 38) * 0.03 * fear * k;   // 危険が近いと尻尾が逆立つ（細かく震える）
  d.tail2.rotation.x = -a * 0.25 - fear * 0.25 * k;
  d.head.rotation.x = g * -Math.sin(d.phase * 2) * 0.05 - a * 0.15;
  d.head.position.y = 2.2 + g * Math.sin(d.phase * 2 + 0.6) * 0.05 * (1 + panic * k);   // 走りで頭が上下に揺れる
  d.torso.scale.y = 0.8 * (1 + 0.025 * Math.sin(P.time * (9 + 6 * panic)) * k);   // 呼吸
  dinoFace(d, Math.max(fear, panic * 0.7, dz * 0.5), Math.max(panic * 0.9, fear * 0.35) + 0.1 * Math.max(0, Math.sin(P.time * (10 + 6 * panic))) * panic, dz > 0 ? P.time : 0);
  d.shadow.position.set(0, 0.03, 0); d.shadow.material.opacity = 0.35 * (1 - Math.min(1, P.y / 6) * 0.6);
  const ss = 1 - Math.min(0.5, P.y * 0.07); d.shadow.scale.set(0.9 * ss, 1.4 * ss, 1);
}

// 直撃中・起き上がり中のポーズ。体の中心（高さ 1.5）を軸に回転させる
function updateDinoHit(d, P) {
  const th = P.tumble, t = P.stateT, C = 1.5;
  d.air += (1 - d.air) * 0.5;
  d.root.rotation.set(th, 0, 0);
  d.root.position.set(0, P.y + C * (1 - Math.cos(th)), -C * Math.sin(th));
  d.shadow.position.set(0, 0.03, 0); d.shadow.material.opacity = 0.35 * (1 - Math.min(1, P.y / 6) * 0.6);
  const ss = 1 - Math.min(0.5, P.y * 0.07); d.shadow.scale.set(0.9 * ss, 1.4 * ss, 1);
  if (P.state === 'knocked') {   // 手足をばたつかせ、目を回して吹っ飛ぶ
    d.body.position.y = 0; d.body.rotation.x = 0; d.body.scale.y = 1;
    d.legs[0].rotation.x = Math.sin(t * 19) * 1.0; d.legs[1].rotation.x = Math.sin(t * 19 + 2.2) * 1.0;
    d.tail1.rotation.y = Math.sin(t * 13) * 0.5; d.tail2.rotation.y = Math.sin(t * 13 - 1) * 0.6; d.tail1.rotation.x = d.tail2.rotation.x = 0;
    d.head.rotation.x = -0.35; dinoFace(d, 1, 0.8, P.time);   // 目を見開いて口をあけ、ぐるぐる目
  } else {   // recover：うずくまりから、ふらつきながら立ち上がる
    const f = Math.min(1, t / CFG.hit.recoverSec), e = f * f * (3 - 2 * f);
    d.body.position.y = 0; d.body.rotation.x = (1 - e) * 0.25; d.body.scale.y = 0.7 + 0.3 * e;
    d.legs[0].rotation.x = Math.sin(t * 9) * 0.35 * e; d.legs[1].rotation.x = -Math.sin(t * 9) * 0.35 * e;
    d.tail1.rotation.y = Math.sin(t * 8) * 0.3; d.tail2.rotation.y = Math.sin(t * 8 - 1) * 0.4; d.tail1.rotation.x = d.tail2.rotation.x = 0;
    d.head.rotation.x = 0.35 * (1 - e); dinoFace(d, 0.6 * (1 - e) + 0.3, 0.2 * (1 - e), P.time);   // うずくまって目を回す
  }
}

// マグマに飲まれる：一瞬もがいて（手足・尻尾をばたつかせ、のけぞり）、溶岩の中へ沈む。P.stateT = 死亡からの秒
function updateDinoDead(d, P) {
  const C = CFG.magma, t = P.stateT, f = Math.min(1, t / C.deathSec), e = f * f * (3 - 2 * f), fl = Math.max(0, 1 - t / (C.deathSec * 0.85));
  d.air += (1 - d.air) * 0.3;
  d.group.visible = true;
  d.root.position.set(0, P.y * (1 - Math.min(1, t * 5)) - C.deathSink * e, 0);
  d.root.rotation.set(-0.75 * e + Math.sin(t * 17) * 0.08 * fl, 0, Math.sin(t * 13) * 0.25 * fl);
  d.body.position.y = Math.abs(Math.sin(t * 15)) * 0.25 * fl; d.body.rotation.x = 0; d.body.scale.y = 1;
  d.legs[0].rotation.x = Math.sin(t * 24) * 1.1 * fl; d.legs[1].rotation.x = Math.sin(t * 24 + 2.4) * 1.1 * fl;
  d.tail1.rotation.y = Math.sin(t * 16) * 0.5 * fl; d.tail2.rotation.y = Math.sin(t * 16 - 1) * 0.6 * fl; d.tail1.rotation.x = d.tail2.rotation.x = 0;
  d.head.rotation.x = -0.5 * (1 - e * 0.5); dinoFace(d, 1, 1, 0);
  d.shadow.position.set(0, 0.03, 0); d.shadow.material.opacity = 0.35 * (1 - e);
}
// ===== キー入力（PC のみ） =====
const KEYS = { left: false, right: false, jumpQ: false };
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
function bindInput() {
  addEventListener('keydown', e => {
    if (KEYMAP[e.code]) { KEYS[KEYMAP[e.code]] = true; e.preventDefault(); }
    else if (e.code === 'Space') { if (!e.repeat) KEYS.jumpQ = true; e.preventDefault(); }
  });
  addEventListener('keyup', e => { if (KEYMAP[e.code]) { KEYS[KEYMAP[e.code]] = false; e.preventDefault(); } });
  addEventListener('blur', () => { KEYS.left = KEYS.right = KEYS.jumpQ = false; });
}
// ===== サウンド（WebAudio で生成。外部ファイルなし）。最初のキー押下で開始、M でミュート =====
const SND = { ctx: null, master: null, rumbleG: null, hissG: null, muted: false, noiseBuf: null };

function sndNoise(ctx, brown) {
  const n = ctx.sampleRate * 2, b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
  let last = 0;
  for (let i = 0; i < n; i++) { const w = Math.random() * 2 - 1; if (brown) { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; } else d[i] = w; }
  return b;
}
function sndLoop(buf) { const s = SND.ctx.createBufferSource(); s.buffer = buf; s.loop = true; return s; }

function sndStart() {
  if (SND.ctx) { if (SND.ctx.state === 'suspended') SND.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  let c; try { c = new AC(); } catch (e) { return; }
  SND.ctx = c;
  SND.out = c.createGain(); SND.out.gain.value = SND.muted ? 0 : CFG.sound.master; SND.out.connect(c.destination);
  SND.master = c.createGain(); SND.master.gain.value = 1; SND.master.connect(SND.out); SND.loud = SND.out;   // master=ダッキングされるバス / loud=大きな音（爆発・着弾・被弾）はダッキングを受けない
  SND.brown = sndNoise(c, true); SND.white = sndNoise(c, false);
  // ゴゴゴゴ：低域ノイズ＋低い正弦波、ゆっくり揺らす
  SND.rumbleG = c.createGain(); SND.rumbleG.gain.value = 0; SND.rumbleG.connect(SND.master);
  const n = sndLoop(SND.brown), lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 140;
  n.connect(lp); lp.connect(SND.rumbleG); n.start();
  const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = 38; const og = c.createGain(); og.gain.value = 0.5;
  o.connect(og); og.connect(SND.rumbleG); o.start();
  const lfo = c.createOscillator(); lfo.frequency.value = 3.2; const lg = c.createGain(); lg.gain.value = 0.25;
  lfo.connect(lg); lg.connect(SND.rumbleG.gain); lfo.start();
  // 噴火中の吹き出し音（シュゴォォ）
  SND.hissG = c.createGain(); SND.hissG.gain.value = 0; SND.hissG.connect(SND.master);
  const h = sndLoop(SND.white), bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 500; bp.Q.value = 0.6;
  h.connect(bp); bp.connect(SND.hissG); h.start();
  // マグマ：近づくほど大きくなる低い唸り（ゴゴゴゴ）と、ジュワジュワ（高域ノイズ）
  SND.magmaG = c.createGain(); SND.magmaG.gain.value = 0; SND.magmaG.connect(SND.master);
  const mn = sndLoop(SND.brown); SND.magmaLP = c.createBiquadFilter(); SND.magmaLP.type = 'lowpass'; SND.magmaLP.frequency.value = 90;
  const mmod = c.createGain(); mmod.gain.value = 0.7; mn.connect(SND.magmaLP); SND.magmaLP.connect(mmod); mmod.connect(SND.magmaG); mn.start();   // 揺れは別段のゲインに掛ける（無音時に漏れないように）
  const mo = c.createOscillator(); mo.type = 'sine'; mo.frequency.value = 29; const mog = c.createGain(); mog.gain.value = 0.6; mo.connect(mog); mog.connect(SND.magmaG); mo.start();
  const mlfo = c.createOscillator(); mlfo.frequency.value = 2.1; const mlg = c.createGain(); mlg.gain.value = 0.3; mlfo.connect(mlg); mlg.connect(mmod.gain); mlfo.start();
  SND.sizzleG = c.createGain(); SND.sizzleG.gain.value = 0; SND.sizzleG.connect(SND.master);
  const szmod = c.createGain(); szmod.gain.value = 0.65; const sz = sndLoop(SND.white); SND.sizzleBP = c.createBiquadFilter(); SND.sizzleBP.type = 'bandpass'; SND.sizzleBP.frequency.value = 2600; SND.sizzleBP.Q.value = 0.8;
  const szlfo = c.createOscillator(); szlfo.frequency.value = 9; const szg = c.createGain(); szg.gain.value = 0.35; szlfo.connect(szg); szg.connect(szmod.gain); szlfo.start();   // ジュワジュワと揺らす
  sz.connect(SND.sizzleBP); SND.sizzleBP.connect(szmod); szmod.connect(SND.sizzleG); sz.start();
}

// 大噴火の爆発音：ノイズ（高→低に絞る）＋低音スイープ
function sndBoom() {
  const c = SND.ctx; if (!c || c.state !== 'running') return;
  const t = c.currentTime, g = c.createGain();
  g.gain.setValueAtTime(1, t); g.gain.exponentialRampToValueAtTime(0.001, t + 3.2); g.connect(SND.loud);
  const s = c.createBufferSource(); s.buffer = SND.white; const f = c.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(3500, t); f.frequency.exponentialRampToValueAtTime(70, t + 2.6);
  s.connect(f); f.connect(g); s.start(t); s.stop(t + 3.3);
  const o = c.createOscillator(), og = c.createGain(); o.type = 'sine';
  o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(24, t + 2);
  og.gain.setValueAtTime(1.4, t); og.gain.exponentialRampToValueAtTime(0.001, t + 2.8);
  o.connect(og); og.connect(SND.loud); o.start(t); o.stop(t + 3);
}

// 毎フレーム：火山の状態に応じて持続音の大きさを変える
function sndUpdate(fx) {
  if (!SND.ctx || !SND.rumbleG) return;
  const S = CFG.sound, now = SND.ctx.currentTime;
  SND.rumbleG.gain.setTargetAtTime(S.rumbleIdle + (S.rumbleErupt - S.rumbleIdle) * fx.k, now, 0.3);
  SND.hissG.gain.setTargetAtTime(0.18 * fx.k, now, 0.4);
}


// マグマ接近の持続音。prox = 近さ 0〜1（遠いと 0）
function sndMagmaUpdate(prox) {
  if (!SND.ctx || !SND.magmaG) return;
  const S = CFG.sound, now = SND.ctx.currentTime, p = Math.pow(prox, 1.3);
  SND.magmaG.gain.setTargetAtTime(S.magmaRumble * p, now, 0.2);
  SND.magmaLP.frequency.setTargetAtTime(70 + 330 * p, now, 0.2);   // 近いほど低音に張りが出る
  SND.sizzleG.gain.setTargetAtTime(S.magmaSizzle * p, now, 0.2);
  SND.sizzleBP.frequency.setTargetAtTime(1800 + 1800 * p, now, 0.3);
}

// マグマに飲まれた音「ジュワッ」：高域ノイズが一気に沈み、ボコボコと低音
function sndMagmaDeath() {
  const c = SND.ctx; if (!c || c.state !== 'running') return;
  const t = c.currentTime, g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.9, t + 0.04); g.gain.exponentialRampToValueAtTime(0.001, t + 1.6); g.connect(SND.master);
  const s = c.createBufferSource(); s.buffer = SND.white; const f = c.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.1;
  f.frequency.setValueAtTime(5200, t); f.frequency.exponentialRampToValueAtTime(500, t + 1.4);
  s.connect(f); f.connect(g); s.start(t); s.stop(t + 1.7);
  const o = c.createOscillator(), og = c.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(30, t + 0.9);
  og.gain.setValueAtTime(0.9, t); og.gain.exponentialRampToValueAtTime(0.001, t + 1.1); o.connect(og); og.connect(SND.master); o.start(t); o.stop(t + 1.2);
  for (let i = 0; i < 4; i++) {   // ボコッ、ボコッ
    const b = c.createOscillator(), bg = c.createGain(), tb = t + 0.25 + i * 0.17 + Math.random() * 0.05; b.type = 'sine';
    b.frequency.setValueAtTime(160 + Math.random() * 60, tb); b.frequency.exponentialRampToValueAtTime(60, tb + 0.12);
    bg.gain.setValueAtTime(0.0001, tb); bg.gain.exponentialRampToValueAtTime(0.35, tb + 0.015); bg.gain.exponentialRampToValueAtTime(0.001, tb + 0.14);
    b.connect(bg); bg.connect(SND.master); b.start(tb); b.stop(tb + 0.16);
  }
}

// 恐竜の短い悲鳴「キュィィ……」：高い声が急に下がって消える
function sndDinoDie() {
  const c = SND.ctx; if (!c || c.state !== 'running') return;
  const t = c.currentTime, g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.03); g.gain.exponentialRampToValueAtTime(0.001, t + 0.75); g.connect(SND.master);
  const f = c.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.4; f.frequency.setValueAtTime(2000, t); f.frequency.exponentialRampToValueAtTime(500, t + 0.7); f.connect(g);
  const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(900, t); o.frequency.exponentialRampToValueAtTime(180, t + 0.7);
  const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = 22; lg.gain.value = 40; l.connect(lg); lg.connect(o.frequency);
  o.connect(f); o.start(t); l.start(t); o.stop(t + 0.8); l.stop(t + 0.8);
}

// 噴石の落下音「ヒュゥゥゥ」：高い音から低い音へ。大きい石ほど低く重い。dur=着弾までの秒
function sndRockFall(dur, size) {
  const c = SND.ctx; if (!c || c.state !== 'running') return;
  const big = size === 'large' ? 2 : size === 'mid' ? 1 : 0, t = c.currentTime;
  const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime((0.16 + big * 0.06) * CFG.sound.vol.fall, t + dur * 0.85); g.gain.linearRampToValueAtTime(0, t + dur + 0.03); g.connect(SND.master);
  const o = c.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(2300 - big * 600, t); o.frequency.exponentialRampToValueAtTime(520 - big * 120, t + dur);
  o.connect(g); o.start(t); o.stop(t + dur + 0.05);
  const n = c.createBufferSource(); n.buffer = SND.white; const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 3;
  bp.frequency.setValueAtTime(1800 - big * 400, t); bp.frequency.exponentialRampToValueAtTime(400, t + dur);
  const ng = c.createGain(); ng.gain.value = 0.6; n.connect(bp); bp.connect(ng); ng.connect(g); n.start(t); n.stop(t + dur + 0.05);
}

// 着弾「ドゴン！」：サイズで重さを変える（低音スイープ＋ノイズ）
function sndRockImpact(size) {
  const c = SND.ctx; if (!c || c.state !== 'running') return;
  const P = { small: [150, 45, 0.5, 0.7], mid: [110, 32, 0.85, 1.0], large: [80, 20, 1.5, 1.5] }[size] || [110, 32, 0.85, 1];
  const t = c.currentTime, dst = size === "small" ? SND.master : SND.loud, V = CFG.sound.vol.impact;
  const og = c.createGain(); og.gain.setValueAtTime((P[3] * V), t); og.gain.exponentialRampToValueAtTime(0.001, t + P[2]); og.connect(dst);
  const o = c.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(P[0], t); o.frequency.exponentialRampToValueAtTime(P[1], t + P[2] * 0.8);
  o.connect(og); o.start(t); o.stop(t + P[2] + 0.05);
  const ng = c.createGain(); ng.gain.setValueAtTime((P[3] * V) * 0.8, t); ng.gain.exponentialRampToValueAtTime(0.001, t + P[2] * 0.7); ng.connect(dst);
  const n = c.createBufferSource(); n.buffer = SND.white; const f = c.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(2500, t); f.frequency.exponentialRampToValueAtTime(80, t + P[2] * 0.6);
  n.connect(f); f.connect(ng); n.start(t); n.stop(t + P[2] + 0.05);
}

// 恐竜の悲鳴「ギャーー」：のこぎり波を上から下へ、ビブラート付き
function sndScream() {
  const c = SND.ctx; if (!c || c.state !== 'running') return;
  const t = c.currentTime, g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.28 * CFG.sound.vol.scream, t + 0.05); g.gain.exponentialRampToValueAtTime(0.001, t + 0.9); g.connect(SND.master);
  const f = c.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2; f.frequency.setValueAtTime(1400, t); f.frequency.exponentialRampToValueAtTime(600, t + 0.8); f.connect(g);
  const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(620, t); o.frequency.exponentialRampToValueAtTime(240, t + 0.85);
  const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = 15; lg.gain.value = 28; l.connect(lg); lg.connect(o.frequency);
  o.connect(f); o.start(t); l.start(t); o.stop(t + 0.95); l.stop(t + 0.95);
}

// 障害物にぶつかった「ドン！」：strength 0〜1（クレーターは弱く、マグマ溜まりはジュッと混ざる）
function sndThud(strength, sizzle) {
  const c = SND.ctx; if (!c || c.state !== 'running') return;
  const t = c.currentTime, v = 0.5 + 0.5 * strength;
  const og = c.createGain(); og.gain.setValueAtTime(0.9 * v, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.32); og.connect(SND.master);
  const o = c.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.25); o.connect(og); o.start(t); o.stop(t + 0.35);
  const ng = c.createGain(); ng.gain.setValueAtTime(0.5 * v, t); ng.gain.exponentialRampToValueAtTime(0.001, t + (sizzle ? 0.5 : 0.18)); ng.connect(SND.master);
  const n = c.createBufferSource(); n.buffer = SND.white; const f = c.createBiquadFilter(); f.type = sizzle ? 'bandpass' : 'lowpass';
  f.frequency.setValueAtTime(sizzle ? 3000 : 1800, t); f.frequency.exponentialRampToValueAtTime(sizzle ? 1200 : 120, t + 0.2); n.connect(f); f.connect(ng); n.start(t); n.stop(t + 0.55);
}

// ===== Phase 7 追加のサウンド =====
// ダッキング：大きな音のとき、持続音など「バス」(SND.master) を一瞬下げる。g = 1 で通常
function sndSetDuck(g) { if (SND.ctx && SND.master) SND.master.gain.setTargetAtTime(g, SND.ctx.currentTime, 0.03); }

function sndBurst(c, dst, t, dur, type, f0, f1, vol, q) {   // フィルタ付きノイズの短い一発
  const g = c.createGain(); g.gain.setValueAtTime(Math.max(0.0002, vol), t); g.gain.exponentialRampToValueAtTime(0.0002, t + dur); g.connect(dst);
  const n = c.createBufferSource(); n.buffer = SND.white; const f = c.createBiquadFilter(); f.type = type; f.Q.value = q || 0.7;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  n.connect(f); f.connect(g); n.start(t); n.stop(t + dur + 0.02);
}
function sndTone(c, dst, t, dur, type, f0, f1, vol, att) {   // 周波数が滑る短い音
  const g = c.createGain(); g.gain.setValueAtTime(0.0002, t); g.gain.exponentialRampToValueAtTime(Math.max(0.0003, vol), t + (att || 0.01)); g.gain.exponentialRampToValueAtTime(0.0002, t + dur); g.connect(dst);
  const o = c.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur * 0.9);
  o.connect(g); o.start(t); o.stop(t + dur + 0.02);
}

// 足音「ドッ」：軽く、毎回少し変える
function sndStep(k) {
  const c = SND.ctx; if (!c || c.state !== 'running') return;
  const t = c.currentTime, v = CFG.sound.vol.step * (0.8 + 0.2 * Math.min(1, k)) * (0.85 + Math.random() * 0.3);
  sndBurst(c, SND.master, t, 0.07, 'lowpass', 700 + Math.random() * 300, 140, 0.16 * v, 0.7);
  sndTone(c, SND.master, t, 0.08, 'sine', 95 + Math.random() * 15, 48, 0.2 * v, 0.004);
}
// ジャンプ「ピョッ」：短く上がる音と風切り
function sndJump() {
  const c = SND.ctx; if (!c || c.state !== 'running') return;
  const t = c.currentTime, v = CFG.sound.vol.jump;
  sndTone(c, SND.master, t, 0.16, 'triangle', 240, 560, 0.18 * v, 0.012);
  sndBurst(c, SND.master, t, 0.14, 'bandpass', 900, 2600, 0.06 * v, 0.9);
}
// 着地「ズサッ」：強さ 0〜1
function sndLand(str) {
  const c = SND.ctx; if (!c || c.state !== 'running') return;
  const t = c.currentTime, v = CFG.sound.vol.land * (0.4 + 0.6 * str);
  sndTone(c, SND.master, t, 0.16, 'sine', 120, 42, 0.36 * v, 0.004);
  sndBurst(c, SND.master, t, 0.2, 'lowpass', 1500, 160, 0.26 * v, 0.7);
}
// 危険度が上がったときのスティンガー：低い不穏な 2 音（段階が高いほど重く、最終は 3 音）
function sndStinger(stage) {
  const c = SND.ctx; if (!c || c.state !== 'running') return;
  const t = c.currentTime, v = CFG.sound.vol.stinger, base = 98 * (1 + stage * 0.1);
  sndTone(c, SND.master, t, 0.5, 'sawtooth', base * 1.5, base * 1.45, 0.14 * v, 0.02);
  sndTone(c, SND.master, t + 0.16, 0.6, 'sawtooth', base, base * 0.96, 0.16 * v, 0.02);
  if (stage >= 3) sndTone(c, SND.master, t + 0.34, 0.8, 'sawtooth', base * 0.7, base * 0.66, 0.18 * v, 0.02);
  sndTone(c, SND.master, t, 0.7, 'sine', base * 0.5, base * 0.4, 0.3 * v, 0.02);
}
// 危険マーカー出現の警告「ピッ」（大型は低い 2 連）
function sndBeep(size) {
  const c = SND.ctx; if (!c || c.state !== 'running') return;
  const t = c.currentTime, v = CFG.sound.vol.beep, big = size === 'large';
  sndTone(c, SND.master, t, 0.07, 'square', big ? 740 : 1240, big ? 740 : 1240, 0.1 * v, 0.004);
  if (big) sndTone(c, SND.master, t + 0.1, 0.07, 'square', 740, 740, 0.1 * v, 0.004);
}
// 被弾「ドン！」＋恐竜の鳴き声「グギャッ」。power はサイズごとの吹き飛びの強さ
function sndHit(power) {
  const c = SND.ctx; if (!c || c.state !== 'running') return;
  const t = c.currentTime, v = CFG.sound.vol.hit * (0.75 + 0.25 * Math.min(1.8, power) / 1.8 * 1.3);
  sndTone(c, SND.loud, t, 0.4, 'sine', 150, 36, 0.8 * v, 0.004);
  sndBurst(c, SND.loud, t, 0.3, 'lowpass', 2800, 120, 0.5 * v, 0.7);
  const g = c.createGain(); g.gain.setValueAtTime(0.0002, t + 0.04); g.gain.exponentialRampToValueAtTime(0.26 * v, t + 0.08); g.gain.exponentialRampToValueAtTime(0.0002, t + 0.6); g.connect(SND.loud);
  const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1100; f.Q.value = 2; f.connect(g);
  const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(380, t + 0.04); o.frequency.exponentialRampToValueAtTime(120, t + 0.55);
  const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = 26; lg.gain.value = 30; l.connect(lg); lg.connect(o.frequency);
  o.connect(f); o.start(t + 0.04); l.start(t + 0.04); o.stop(t + 0.62); l.stop(t + 0.62);
}

function sndToggleMute() {
  SND.muted = !SND.muted;
  if (SND.out) SND.out.gain.setTargetAtTime(SND.muted ? 0 : CFG.sound.master, SND.ctx.currentTime, 0.05);
  const el = document.getElementById('mute'); if (el) el.textContent = SND.muted ? '♪ OFF (M)' : '♪ ON (M)';
}

function bindSound() {
  addEventListener('keydown', e => { sndStart(); if (e.code === 'KeyM' && !e.repeat) sndToggleMute(); });
  addEventListener('pointerdown', sndStart);
}
// ===== 起動・メインループ =====
(function () {
  if (typeof THREE === 'undefined') { document.getElementById('hint').textContent = 'three.js を読み込めませんでした（ネット接続を確認してください）'; return; }
  buildWorld(); buildVolcano(); buildRocks(); buildMagma(); buildObstacles();
  const $boom = document.getElementById('boom'), $flash = document.getElementById('flash'), $scream = document.getElementById('scream');
  const $oops = document.getElementById("oops");
  let erupted = false, fx = volcanoState(0);
  const dino = buildDino(); WORLD.scene.add(dino.group);
  const G = newGame(), P = G.P, M = G.M, RS = G.RS, OB = G.OB;
  fxBuild(G, dino);
  const newSeed = () => (Math.random() * 2147483647) | 0;
  OB.seed = newSeed();   // 障害物の配置の種（毎回変わる。リセット時も新しくする）
  const $dist = document.getElementById('dist'), $danger = document.getElementById('danger'), $clear = document.getElementById('clear'), $clearDist = document.getElementById('clearDist');
  let shownDanger = -1;
  let shown = -1;

  function showScream() { $scream.classList.remove('on'); void $scream.offsetWidth; $scream.classList.add('on'); }

  function showOops() { $oops.style.animationDuration = CFG.obstacle.oopsSec + 's'; $oops.classList.remove('on'); void $oops.offsetWidth; $oops.classList.add('on'); }

  // 障害物にぶつかった：ドン！・うわっ！・土煙・軽い揺れ（クレーターは弱いつまずきなので文字なし・小さめ）
  function onObstacleHit(h) {
    const O = CFG.obstacle, ob = h.ob, trip = h.kind === 'trip', pool = ob.type === 'pool', T = pool ? O.poolTrip : O.trip;
    sndThud(trip ? (pool ? 1 : 0.8) : 0.35, pool);
    if (trip) { showOops(); ROCKS.shake = Math.max(ROCKS.shake, T.shake); fxOnHit('trip'); }
    const n = trip ? 16 : 6;
    for (let i = 0; i < n; i++) {
      const a = rnd(0, 6.283), sp = rnd(3, 9);
      fxEmit(ROCKS.dust, P.x + Math.cos(a) * 0.8, 0.3, P.z + Math.sin(a) * 0.8 - 1, Math.cos(a) * sp, rnd(0.5, 3), Math.sin(a) * sp - 4, rnd(0.8, 1.4), rnd(2, 3.4), 0.7, i % 3 === 0 ? 1 : 0);
    }
    if (pool) for (let i = 0; i < 14; i++) fxEmit(ROCKS.sparks, P.x, 0.5, P.z, rnd(-5, 5), rnd(6, 14), rnd(-5, 5), rnd(0.6, 1.1), rnd(1.2, 2.2), 1, 0);
  }

  // マグマに飲まれた瞬間：音・揺れ・溶岩のしぶき
  function onDeath() {
    sndMagmaDeath(); sndDinoDie();
    ROCKS.shake = Math.max(ROCKS.shake, 0.55);
    for (let i = 0; i < 46; i++) {
      const a = rnd(0, 6.283), sp = rnd(5, 16);
      fxEmit(ROCKS.sparks, P.x + Math.cos(a) * 0.8, 0.6, P.z + Math.sin(a) * 0.8, Math.cos(a) * sp * 0.6, rnd(8, 20), Math.sin(a) * sp * 0.6, rnd(0.7, 1.4), rnd(1.5, 3.2), 1, 0);
    }
    $scream.classList.remove('on');
  }

  // R：全状態を初期化して最初から（噴火・噴石・マグマ・恐竜・揺れ・フラッシュ・音・粒子）。オブジェクトは作り直さない
  function restart() {
    resetGame(G, newSeed()); erupted = false; fx = volcanoState(0); shown = -1;
    KEYS.left = KEYS.right = KEYS.jumpQ = false;
    resetRocks(); resetObstaclesView(); resetVolcano(); resetWorld(); resetMagmaView();
    dino.phase = 0; dino.air = 0; dino.group.visible = true;
    [$boom, $scream, $oops].forEach(el => el.classList.remove('on')); $clear.classList.remove('on'); shownDanger = -1; $flash.style.opacity = 0;
    sndMagmaUpdate(0); fxResetView();
  }

  function update(dt) {
    // 吹き飛び・起き上がり中は stepPlayer が入力を無視する。dead の間は stepGame が前進・操作・噴石の新規生成を止める
    const ev = stepGame(G, { left: KEYS.left, right: KEYS.right, jump: KEYS.jumpQ }, dt);
    KEYS.jumpQ = false;
    fx = volcanoState(P.time);
    const dif = difficultyAt(P.time - CFG.volcano.eruptDelay), em = eruptionMul(dif.s);   // 難易度：噴火の迫力は強度とともに最大へ
    if (fx.state === 'erupting') { fx.k *= em; fx.smoke *= em; }
    syncRocks(RS, dt); syncObstacles(OB, dt);
    ev.obstacle.hits.forEach(onObstacleHit);
    ev.landed.forEach(l => { rockImpact(l.rock, l.hit); if (l.hit) { showScream(); sndScream(); fxOnHit('rock', l.rock.size); } });
    if (ev.died) onDeath();
    const gap = magmaGap(M, P), alive = M.phase === 'playing';
    updateRocksFx(dt);
    fxFrame(dt, { alive, gap, dif, fx });
    updateDino(dino, P, dt);
    updateWorld(P, dt);
    if (fx.state === 'erupting' && !erupted) { erupted = true; $boom.classList.add('on'); sndBoom(); fxDuck(FXS, CFG.fx.duck.boom, 0.3); }
    updateVolcano(P, dt, fx);
    updateMagma(P, M, dt);
    if (dif.stage !== shownDanger) { shownDanger = dif.stage; fxStage(dif.stage); $danger.textContent = '危険度：' + dif.label; $danger.className = 'd' + dif.stage; }
    if (M.phase === 'clear' && M.clearT > 0.8 && !$clear.classList.contains('on')) { $clearDist.textContent = '逃走距離：' + Math.floor(P.dist) + 'm'; $clear.classList.add('on'); }
    sndUpdate(fx);
    sndMagmaUpdate(alive ? magmaProx(gap, CFG.magma.audibleRange) : M.phase === 'clear' ? 0 : Math.max(0, 0.6 - M.deadT * 0.3));
    $flash.style.opacity = fx.flash;
    const T = VOL.t;   // 揺れの位相（P.time は死亡で止まるので別の時計を使う）
    // 画面揺れは全要因を fxCamera でまとめて合成（位置のみ・二乗和の平方根で合成し上限あり）：噴火 / 噴石の着弾・被弾 / 最終逃走の常時 / マグマ接近
    const finalS = alive && dif.e > CFG.difficulty.shake.from ? finalShake(dif.e) : 0;
    const magS = alive && M.active ? CFG.magma.shakeAmp * Math.pow(magmaProx(gap, CFG.magma.shakeRange), 2) : 0;
    fxCamera(T, [fx.shake, ROCKS.shake, finalS, magS]);
    const m = Math.floor(P.dist);
    if (m !== shown) { shown = m; $dist.textContent = '距離：' + m + 'm'; }
  }

  bindInput(); bindSound();
  addEventListener('keydown', e => { if (e.code === 'KeyR' && !e.repeat && M.phase !== 'playing') restart(); });
  // 確認用：状態の読み取りと、1 フレーム進める口。dropRock(size, x, z, warn?) = 指定位置へ今すぐ噴石を落とす（warn は着弾までの秒の上書き）
  window.GAME = { G, P, M, KEYS, CFG, FXS, FXV, dino, WORLD, VOL, SND, RS, OB, OBS, ROCKS, MAG, get fx() { return fx; },
    step: dt => { update(dt); WORLD.renderer.render(WORLD.scene, WORLD.camera); },
    restart,
    dropRock: (size, x, z, warn) => spawnRock(RS, size, x, z, null, warn),
    dropRockOnDino: (size, warn) => { const w = warn || CFG.rock.sizes[size].warn; return spawnRock(RS, size, P.x, P.z - P.speed * w, null, warn); } };
  let last = performance.now();
  (function loop(now) {
    const dt = Math.max(0, Math.min(CFG.dt.max, (now - last) / 1000)); last = now;
    if (fxHitstopStep(FXS, dt)) { /* hitstop: game time paused, rendering continues */ }
    else update(dt);
    WORLD.renderer.render(WORLD.scene, WORLD.camera);
    requestAnimationFrame(loop);
  })(last);
})();
</script>
</body>
