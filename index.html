<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DINO ESCAPE</title>
<style>
  :root{--ink:#f6ece0;--jp:"Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Meiryo","Noto Sans JP",sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#1a0d0b;color:var(--ink);font-family:var(--jp);user-select:none;-webkit-user-select:none}
  #view{position:fixed;inset:0}
  #view canvas{display:block;width:100%;height:100%}
  /* HUD：左上に距離（大きく太く）と控えめなマグマゲージ、右上に危険度。折り返しても崩れない */
  #hud{position:fixed;left:0;right:0;top:0;padding:clamp(8px,2vh,24px) clamp(12px,2.6vw,40px);display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px 16px;pointer-events:none}
  #hudL{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
  #dist{font-size:clamp(28px,4.8vw,68px);font-weight:900;line-height:1.05;letter-spacing:.03em;font-variant-numeric:tabular-nums;color:#fff4e0;-webkit-text-stroke:1.5px rgba(70,14,0,.9);
    text-shadow:0 3px 0 rgba(70,14,0,.95),0 0 22px rgba(255,120,40,.55),0 4px 14px #000}
  #hint{position:fixed;left:0;right:0;bottom:26px;text-align:center;font-size:clamp(12px,1.3vw,18px);letter-spacing:.1em;opacity:.75;pointer-events:none;text-shadow:0 1px 6px #000}
  #hint.on{animation:hintOut 1.4s ease forwards}   /* 開始後 CFG.fx.hintSec 秒で消える（animation-delay を JS で設定） */
  @keyframes hintOut{to{opacity:0}}
  #hitVig{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(255,0,0,0) 30%,rgba(210,0,0,.85) 100%)}
  #hitVig.on{animation:hitVig var(--vigSec,.55s) ease-out}
  @keyframes hitVig{0%{opacity:var(--vigA,.85)}100%{opacity:0}}
  #edge{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(255,40,0,0) 62%,rgba(255,60,0,.55) 100%)}
  #boom{position:fixed;left:0;right:0;top:34%;text-align:center;font-size:clamp(26px,7vw,120px);white-space:nowrap;font-weight:900;letter-spacing:.06em;color:#ffd9a0;-webkit-text-stroke:3px #7a1500;text-shadow:0 0 24px #ff5a14,0 6px 0 #5a0d00;pointer-events:none;opacity:0;transform:scale(.6)}
  #boom.on{animation:boom 2.2s ease-out forwards}
  @keyframes boom{0%{opacity:0;transform:scale(.5)}8%{opacity:1;transform:scale(1.25) rotate(-2deg)}18%{transform:scale(1) rotate(1deg)}75%{opacity:1;transform:scale(1.05)}100%{opacity:0;transform:scale(1.12)}}
  #flash{position:fixed;inset:0;background:#ffb060;opacity:0;pointer-events:none}
  #scream{position:fixed;left:0;right:0;top:44%;text-align:center;font-size:clamp(24px,6vw,96px);white-space:nowrap;font-weight:900;letter-spacing:.05em;color:#fff3c2;-webkit-text-stroke:3px #6a1000;text-shadow:0 0 20px #ff7a1a,0 5px 0 #4a0b00;pointer-events:none;opacity:0}
  #scream.on{animation:scream 1.2s ease-out forwards}
  @keyframes scream{0%{opacity:0;transform:scale(.4) rotate(-6deg)}10%{opacity:1;transform:scale(1.3) rotate(4deg)}20%{transform:scale(1) rotate(-3deg)}35%{transform:scale(1.08) rotate(2deg)}80%{opacity:1}100%{opacity:0;transform:scale(1.15) translateY(-20px)}}
  #oops{position:fixed;left:0;right:0;top:46%;text-align:center;font-size:clamp(22px,5vw,80px);white-space:nowrap;font-weight:900;letter-spacing:.05em;color:#fff3c2;-webkit-text-stroke:3px #4a2a00;text-shadow:0 0 16px #ffb04a,0 5px 0 #3a1c00;pointer-events:none;opacity:0}
  #oops.on{animation:scream .9s ease-out forwards}
  #mute{position:fixed;right:10px;bottom:6px;font-size:11px;opacity:.5;pointer-events:none;text-shadow:0 1px 6px #000}
  #lavaGlow{position:fixed;left:0;right:0;bottom:0;height:42%;pointer-events:none;opacity:0;background:linear-gradient(to top,rgba(255,80,10,.85),rgba(255,60,10,.35) 45%,rgba(255,50,0,0))}
  #heat{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 55%,rgba(255,60,0,0) 45%,rgba(255,50,0,.5) 100%)}
  #danger{padding:clamp(4px,.8vh,10px) clamp(12px,1.6vw,26px);border-radius:999px;background:rgba(20,8,6,.6);border:2px solid currentColor;font-size:clamp(16px,2.3vw,34px);font-weight:900;letter-spacing:.1em;text-shadow:0 2px 8px #000;transition:color .4s;white-space:nowrap}
  #danger.pop{animation:dpop .6s cubic-bezier(.2,1.6,.4,1)}
  @keyframes dpop{0%{transform:scale(1.7)}100%{transform:scale(1)}}
  #danger.d0{color:#9be08f}#danger.d1{color:#ffd86a}#danger.d2{color:#ff9140}#danger.d3{color:#ff4030;animation:hot .5s ease-in-out infinite alternate}
  #clear{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:none;opacity:0;transition:opacity .8s;background:radial-gradient(ellipse at center,rgba(20,30,10,.35),rgba(10,0,0,.7))}
  #clear.on{opacity:1}
  #clear .go{font-size:clamp(40px,10vw,150px);font-weight:900;letter-spacing:.08em;color:#e8ffc0;-webkit-text-stroke:3px #2a5a10;text-shadow:0 0 28px #8aff5a,0 8px 0 #1d3d0a}
  #clear .dist{font-size:clamp(20px,3.4vw,46px);font-weight:700;letter-spacing:.08em;text-shadow:0 2px 10px #000}
  #clear .again{margin-top:10px;font-size:clamp(16px,2.4vw,30px);letter-spacing:.14em;color:#ffcf8a;animation:blink 1.1s ease-in-out infinite alternate}
  #magma{display:flex;align-items:center;gap:7px;padding:2px 11px;border-radius:999px;background:rgba(20,8,6,.4);border:1px solid rgba(255,140,60,.3);opacity:.8;font-size:clamp(11px,1.1vw,15px);letter-spacing:.08em;text-shadow:0 1px 6px #000}
  #magma .dot{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,160,80,.4)}
  #magma .dot.lit{background:#ff9a2a;border-color:#ffd080;box-shadow:0 0 8px #ff7a1a}
  #magma.hot{border-color:#ff5030;color:#ffd0b0;animation:hot .5s ease-in-out infinite alternate}
  #magma.hot .dot.lit{background:#ff3a1a;box-shadow:0 0 10px #ff2a0a}
  @keyframes hot{from{box-shadow:0 0 0 rgba(255,60,20,0)}to{box-shadow:0 0 16px rgba(255,60,20,.8)}}
  #gameover{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:none;opacity:0;transition:opacity .8s;background:radial-gradient(ellipse at center,rgba(40,6,0,.55),rgba(10,0,0,.8))}
  #gameover.on{opacity:1}
  #gameover .go{font-size:clamp(40px,10vw,150px);font-weight:900;letter-spacing:.08em;color:#ffd9a0;-webkit-text-stroke:3px #7a1500;text-shadow:0 0 28px #ff5a14,0 8px 0 #5a0d00}
  #gameover .sub{font-size:clamp(18px,3vw,40px);letter-spacing:.1em;text-shadow:0 2px 10px #000}
  #gameover .dist{font-size:clamp(20px,3.4vw,46px);font-weight:700;letter-spacing:.08em;font-variant-numeric:tabular-nums;text-shadow:0 2px 10px #000}
  #gameover .again{margin-top:10px;font-size:clamp(16px,2.4vw,30px);letter-spacing:.14em;color:#ffcf8a;animation:blink 1.1s ease-in-out infinite alternate}
  @keyframes blink{from{opacity:.45}to{opacity:1}}
  /* GAME OVER / CLEAR の文字演出（下地。Phase 8 で作り込む）：見出しがドンと拡大して着地 → 下の行が順にせり上がる */
  @keyframes goIn{0%{opacity:0;transform:scale(2.6) rotate(-5deg);letter-spacing:.35em}55%{opacity:1;transform:scale(.93) rotate(1deg)}100%{opacity:1;transform:scale(1)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  #gameover.on .go,#clear.on .go{animation:goIn .95s cubic-bezier(.2,1.4,.4,1) both}
  #gameover.on .sub{animation:fadeUp .8s .55s both}
  #gameover.on .dist,#clear.on .dist{animation:fadeUp .8s .85s both}
  #gameover.on .again,#clear.on .again{animation:fadeUp .6s 1.4s both,blink 1.1s 2s ease-in-out infinite alternate}
</style>
</head>
<body>
<div id="view"></div>
<div id="lavaGlow"></div><div id="heat"></div><div id="edge"></div><div id="hitVig"></div>
<div id="hud"><div id="hudL"><div id="dist">距離：0m</div><div id="magma"><span>マグマ</span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span id="magmaGap">--m</span></div></div><div id="danger" class="d0">危険度：LOW</div></div>
<div id="gameover"><div class="go">GAME OVER</div><div class="sub">火山から逃げ切れなかった……</div><div class="dist" id="overDist">逃走距離：0m</div><div class="again">[R] もう一度逃げる</div></div>
<div id="clear"><div class="go">CLEAR（仮）</div><div class="dist" id="clearDist">逃走距離：0m</div><div class="again">[R] もう一度</div></div>
<div id="boom">ドゴォォォン！！！</div><div id="scream">ギャーー！！</div><div id="oops">うわっ！</div><div id="flash"></div><div id="mute">♪ ON (M)</div>
<div id="hint" class="on">← → / A D 移動 ・ Space ジャンプ ・ M 音ON/OFF</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
// ===== 調整値（ここに集約） =====
const CFG = {
  run: { baseSpeed: 16, accel: 0.04, maxSpeed: 34 },                  // 前進：基準速度 / 経過秒あたりの加速（u/s²）/ 上限（単位 u = 1m）
  move: { maxX: 13, maxSpeed: 10, accel: 55, decel: 45, airAccelMul: 0.55, airDecelMul: 0.35 },   // 左右：荒野の左右限界 / 最高横速度 / 加速 / 減速 / 空中での加減速倍率
  jump: { velocity: 11.5, gravity: 32 },                              // ジャンプ初速 / 重力
  cam: { back: 11, height: 6.2, lookAhead: 14, lookY: 1.2, follow: 5, followX: 0.7, lookFollowX: 0.85, fov: 60, fovSpeed: 0.35, fovMax: 78, jumpLift: 0.35 },   // 後方距離 / 高さ / 先を見る距離 / 注視点の高さ / 追従の速さ / 横追従率 / 画角と速度による広がり
  world: { groundSize: 600, texRepeat: 40, fogColor: 0x5a2f26, fogNear: 50, fogFar: 260, clearHalf: 18,
           rocks: 46, hills: 14, spawnAhead: 220, spawnBehind: 30, spread: 110 },   // 地面の大きさ / テクスチャ繰り返し / フォグ / 装飾を置かない中央の半幅（遊べる範囲の外側）/ 装飾の数 / 先に出す距離・消す距離 / 左右の散らばり幅
  dino: { runFreq: 0.55, legSwing: 0.95, tailSwing: 0.35, bob: 0.09, tuck: 1.0, lean: 0.03 },   // 脚ふりの速さ（距離あたり）/ 脚の振れ幅 / 尻尾の揺れ / 上下の弾み / ジャンプ時の足たたみ / 横移動の傾き
  volcano: { eruptDelay: 4, rampTime: 6, idleSmoke: 0.25, dist: 300, recede: 0.04, radius: 120, height: 130, craterR: 18,   // 大噴火までの秒 / 噴火が最大強度になるまでの秒 / 噴火前の煙の量 / 後方の距離 / 遠ざかる率 / 山の大きさ
             boomDur: 2.2, shakeAmp: 0.32, shakeDur: 1.6, flashDur: 0.9, flashMax: 0.6,                                    // 「ドゴォォォン」表示秒 / 画面揺れの大きさ・秒 / 閃光の秒・最大濃さ
             smokeMax: 450, fireMax: 380, ashMax: 650, emberMax: 200, canopyMax: 170,                                                    // パーティクル上限（煙 / 火花 / 火山灰 / 降る火の粉）
             windSpeed: 70, smokeLife: 9, ashBox: { x: 45, y: 32, z: 80 },                                                // 煙が手前へ流れる速さ / 煙の寿命 / 灰が降る範囲
             sky: { top: '#0a0203', mid: '#3a0a08', low: '#7a1c0e', bottom: '#a8300f' }, fogColor: 0x3a0e0a },             // 噴火後の空と霧の色
  rock: { interval: 2.0, jitter: 0.35, firstDelay: 1.5, maxActive: 12,                                                      // 噴石：（interval と weights は難易度を使わない時の固定値。実際は difficulty.rock が決める）出現間隔 / ばらつき / 噴火してから最初の1個までの秒 / 同時に存在できる数の上限（描画の枠数）
          weights: { small: 0.58, mid: 0.37, large: 0.05 },                                                                 // 出現の重み（固定値の時のみ）
          aimChance: 0.5, aimJitterX: 2.5, aimJitterZ: 3, spreadX: 14, aheadExtra: 30, edgeMargin: 1, backDist: 22, sideOff: 6,   // 恐竜を狙う確率と誤差 / 狙わない時の左右幅と前方の余裕 / 落下の出発点（後方・横）
          sizes: {   // radius=着弾の当たり半径（危険マーカー）/ vis=見た目の岩の半径 / warn=警告から着弾までの秒 / fallH=出発の高さ / power=吹き飛びの強さ / shake=画面揺れ
            small: { radius: 2.2, vis: 0.75, warn: 0.9, fallH: 12, power: 0.55, shake: 0 },
            mid:   { radius: 3.4, vis: 1.3,  warn: 1.2, fallH: 15, power: 1.0,  shake: 0.2 },
            large: { radius: 6.2, vis: 2.8,  warn: 1.6, fallH: 19, power: 1.8,  shake: 0.55 } },
          fair: { react: 0.3, margin: 0.5, accelLoss: 1.2, jumpPenalty: 2.2, tries: 5, retry: 0.2 },                               // 公平性（避けようがない噴石を出さない）：人間の反応時間 / 円の外に出る余裕 / 加速で失う距離 / 障害物をジャンプ中の逃げにくさ(u) / 場所の選び直し回数 / だめなら待つ秒
          sparkMax: 850, dustMax: 640, craterMax: 10, craterLife: 4.5, ringMax: 8, shakeDecay: 6 },                          // 火の粉・土煙の粒数 / クレーター跡の数と残る秒 / 衝撃波リング数 / 揺れの収まる速さ
  hit: { dinoR: 0.9, maxY: 1.5,                                                                                             // 恐竜の当たり半径 / これより高く跳んでいれば爆風の上を越える
         knockBase: 0.75, knockPer: 0.5, kickSide: 9, kickUp: 12, kickFwd: 12, spin: 9,                                       // 吹き飛び：秒（基本＋強さ×）/ 横・上・前方への初速（×強さ）/ 回転（rad/s）
         bounce: 0.42, bounceMin: 2.5, friction: 2.2, knockMul: 0.15,                                                        // バウンドの反発 / 止まる最小の落下速度 / 地面での減速 / 吹き飛び中の前進倍率
         recoverSec: 0.7, recoverMul: 0.4, slowSec: 2.6, slowFactor: 0.55, slowRamp: 0.7,                                    // 起き上がりの秒と前進倍率 / 減速の続く秒と倍率 / 戻るまでにかける秒
         invulnSec: 1.8, screamSec: 1.2 },                                                                                   // 復帰後の無敵（点滅）秒 / 「ギャーー」表示秒
  magma: { startGap: 60, speed0: 15, speedMax: 22.5, rubberMin: 0.6, rubberRange: 50,                                                                          // 噴火時の先端との距離(u) / 噴火直後の速さ / 最終局面の速さ（途中の速さは難易度の強度 s で補間。プレイヤーは 16→約 21 付近でクリア）
           deathOvershoot: 6, deathSec: 1.5, deathSink: 3.2, overlayDelay: 1.6,                                              // 死亡時に先端がプレイヤーを越えて止まる距離 / 沈む秒 / 沈む深さ / GAME OVER 表示までの秒
           width: 560, length: 260, crestH: 4.3,                                                                              // 溶岩の幅（左右の外まで）/ 奥行き / 波頭の高さ（3.8→4.3：先端のチラ見えを 6〜7m 付近から。Phase 6）
           heatRange: 55, glowBase: 0.1, wobble: 3, shakeRange: 26, shakeAmp: 0.16, audibleRange: 140,                        // 熱ゆらぎ・赤みが出始める距離 / 噴火後の下端の照り返し最小値 / 熱ゆらぎ(px) / 揺れが出る距離・大きさ / 音が聞こえ始める距離
           dangerGaps: [110, 75, 50, 28, 14],                                                                                 // HUD ゲージの点灯しきい値（この距離より近いと点が1つずつ点く）
           sparkMax: 360, steamMax: 200, lightMax: 2.4 },                                                                    // 火の粉・蒸気の粒数 / 照り返し光の強さ
  obstacle: { seed: 1234, startDist: 50, slotStep: 20, minGapZ: 14, logClearZ: 30, aheadDist: 150, behindDist: 12, chunk: 40,   // 乱数の種 / 最初の障害物までの距離(u) / 配置の枠の間隔 / 前後の障害物の最低間隔（枠内のばらつきは slotStep-minGapZ）/ 倒木の前後に他を置かない距離 / 先に出す距離・消す距離 / まとめて作る長さ
              density: { start: 0.45, end: 0.9 },                                                                           // 枠が埋まる確率：難易度の強度 s（0〜1）で 序盤→終盤の値へ（その距離を「ふつうに走ったときの噴火後の秒」に直して使う）
              unlock: { rock: 0, crater: 70, log: 110, pool: 200 },                                                         // 各障害物が出始める走行距離（少しずつ増える）
              weights: { rock: 0.34, log: 0.28, crater: 0.22, pool: 0.16 },                                                 // 出現の重み
              rock: { rMin: 1.0, rMax: 1.5, hMin: 1.0, hMax: 1.4, shrink: 0.85 },                                           // 岩：半径 / 高さ（ジャンプ頂点は約2.07）/ 当たりの縮小率
              log: { lenMin: 13, lenMax: 24, r: 0.6, h: 1.2, overhang: 1.5 },                                               // 倒木：長さ（左右の幅 26 の半分〜ほぼ全幅）/ 幹の半径 / 高さ / 端のはみ出し
              crater: { rMin: 1.5, rMax: 2.5, clearY: 0.5 },                                                                // クレーター：半径 / これより高く跳んでいれば越える
              pool: { rMin: 2.0, rMax: 3.5, clearY: 1.4, minCorridor: 5 },                                                  // マグマ溜まり：半径 / これより高く跳んでいれば上を越える（実質は左右に避ける）/ 常に空ける通路幅
              dinoR: 0.6, depthPad: 0.7, footMargin: 0.2,                                                                                 // 障害物に対する恐竜の当たり半径 / 前後方向の余裕 / 岩・倒木は足がこの分だけ上に出ていれば越えたことにする（甘め）
              trip: { knock: 0.6, up: 6.5, fwd: 7, spin: 7, slowSec: 2.2, slowFactor: 0.6, shake: 0.14 },                   // 岩・倒木で転倒：転がる秒 / 跳ね上がり / 前へ転がる初速 / 回転 / 減速の秒と倍率 / 画面揺れ
              poolTrip: { knock: 0.8, up: 8, fwd: 5, spin: 8, slowSec: 3.0, slowFactor: 0.42, shake: 0.2 },                 // マグマ溜まりに触れた：転倒＋強めの減速
              stumble: { slowSec: 1.0, slowFactor: 0.7, tiltSec: 0.5 },                                                     // クレーター：つまずき（転倒しない・軽い減速）
              oopsSec: 0.9 },                                                                                               // 「うわっ！」表示秒
  // 難易度（Phase 6）。時間の基準は「噴火が始まってからの秒 e」（ゲーム開始から eruptDelay=4 秒後が e=0）。強度 s は 0〜1
  difficulty: {
    knots: [[0, 0], [20, 0.2], [40, 0.5], [60, 0.85], [78, 1]],     // [e 秒, 強度 s]：折れ線でつなぐ（境目で急に変わらない）。60 秒以降は最大へ向かい 78 秒で 1
    stageFrom: [0, 20, 40, 60], labels: ['LOW', 'MID', 'HIGH', 'MAX'],   // チュートリアル / 通常 / 危険ゾーン / 最終逃走 の開始秒と、HUD の危険度の表記
    rock: { interval0: 3.0, interval1: 0.5, curve: 1.0,               // 噴石の落下間隔（秒）：s=0 で 3.0 → s=1 で 0.5（ばらつき ±jitter は別）
            aim0: 0.2, aim1: 0.4,                                    // 恐竜を狙う噴石の割合（rock.aimChance の代わり）：序盤 0.2 → 終盤 0.4
            active0: 3, active1: 12,                                  // 同時に落ちている数の上限：3 → 12（描画の枠 rock.maxActive が頭打ち）
            largeFrom: 0.5,                                           // 大型噴石は強度がこの値（= 40 秒時点）を超えるまで出ない。そこから最終までに weights1.large へ増える
            weights0: { small: 0.7, mid: 0.3, large: 0 }, weights1: { small: 0.5, mid: 0.5, large: 0.3 } },   // 序盤 / 終盤の重み（大型を除いた小:中の比と、終盤の大型の割合）
    magmaCurve: 1.5,                                                  // マグマの速さ = speed0 → speedMax を s^magmaCurve で補間
    eruptMul: 0.8,                                                    // 噴火の迫力（煙・火の量）の倍率：s=0 で 0.8 → s=1 で 1.0
    shake: { from: 52, over: 10, amp: 0.07 }                          // 画面全体の常時の小刻みな揺れ：e=52 秒から 10 秒かけて amp（位置のみ・控えめ）まで
  },
  // クリア（安全地帯）。プレイヤーの速さは 16 + 0.04t（t は開始からの秒）なので、距離 = 16t + 0.02t²。
  // distance=2200 → 約 119.5 秒（被弾なし）。被弾の減速（1 回で約 1.5〜2 秒ぶんの遅れ）を数回受けても 2 分台前半、1〜3 分に収まる
  goal: { distance: 2200 },
  // 演出（Phase 7）。intensity=0〜1 で演出全体の強さを一括で弱められる（0 でシェイク・ヒットストップ・フラッシュ・追加の粒子が無くなる）。ゲームの難易度・物理は一切変えない
  fx: {
    intensity: 1,
    shake: { cap: 0.7, hitAmp: 0.5, bigAmp: 0.7 },                     // 揺れ（位置のみ）の合計上限 / 噴石の直撃時の揺れ / 大型着弾時の揺れ（複数の揺れは二乗和の平方根で合成してから上限）
    hitstop: { rock: 0.065, big: 0.08, trip: 0.04, max: 0.1 },         // ヒットストップの秒（直撃 / 大型の直撃 / 障害物で転倒 / 上限）。ゲーム時間だけが止まり、描画・演出は続く
    vignette: { sec: 0.55, alpha: 0.85 },                              // 被弾時の赤い縁（フラッシュ）の秒 / 濃さ
    duck: { big: 0.5, hit: 0.3, boom: 0.55, hold: 0.12, release: 0.55 },   // 大きな音のときに他の音を一瞬下げる深さ（0〜1）/ 下げたままの秒 / 戻る秒
    blast: { fireLarge: 7, fireMid: 3, smokeLarge: 16, smokeMid: 5, debrisLarge: 18, debrisMid: 7, debrisSmall: 3 },   // 噴石着弾：火球 / 黒煙の柱 / 飛び散る破片 の粒数
    tail: { spark: 1.6, smoke: 1.35 },                                 // 落下中の噴石の尾（火の粉・煙）の量の倍率
    runDust: { perUnit: 0.32, size: 1.3 },                             // 走りの土煙：距離 1u あたりの粒数（速度連動）/ 大きさ
    landDust: 12,                                                      // ジャンプ着地の砂煙の粒数（強く着地するほど増える）
    magma: { spark: 70, steam: 26 },                                   // マグマ先端の火の粉・蒸気の毎秒の量（近いほど増える）
    fear: { range: 11 },                                               // 噴石の危険マーカーがこの距離(u)以内に近づくと恐竜が焦る
    panic: { range: 34 },                                              // マグマとの距離(u)がこれ以内だと必死な走り（脚が速い・口を開ける）
    squash: { land: 0.3, crouch: 0.16 },                               // 着地のつぶれの最大 / 離陸前の溜めの深さ
    beep: { range: 10, gap: 0.14 },                                    // 危険マーカーが近くに出たとき「ピッ」と鳴る距離 / 連続で鳴らさない間隔(秒)
    edge: { base: 0.08, perS: 0.27 },                                   // 噴火中の画面端の赤い縁：基本の濃さ / 難易度の強度 s ごとの上乗せ
    hintSec: 7                                                         // 操作ヒントを出しておく秒（その後フェードアウト）
  },
  sound: { vol: { fall: 0.8, impact: 1.0, scream: 0.8, step: 0.55, jump: 0.6, land: 0.7, stinger: 0.7, beep: 0.4, hit: 1.0 }, master: 0.5, rumbleIdle: 0.35, rumbleErupt: 0.85, magmaRumble: 1.0, magmaSizzle: 0.3 },                           // 全体音量 / 待機中・噴火中のゴゴゴ音量 / マグマの低音・ジュワジュワの最大音量
  dt: { max: 0.05 }                                                   // 1 フレームの最大秒（タブ復帰時の飛び防止）
};
// ===== 純ロジック（three.js 非依存。verify.html でテスト） =====
function speedAt(t) { return Math.min(CFG.run.maxSpeed, CFG.run.baseSpeed + CFG.run.accel * t); }

// state: run（操作可）/ knocked（吹き飛び中・操作不能）/ recover（起き上がり中・操作不能）
function newPlayer() {
  return { x: 0, y: 0, z: 0, vx: 0, vy: 0, grounded: true, speed: CFG.run.baseSpeed, time: 0, dist: 0,
           state: 'run', stateT: 0, knockT: 0, kvx: 0, kvf: 0, tumble: 0, spinRate: 0, power: 0, slow: 0, slowF: CFG.hit.slowFactor, invuln: 0, hits: 0, trips: 0, stumbleT: 0 };
}

function approach(v, target, amount) { return v < target ? Math.min(target, v + amount) : Math.max(target, v - amount); }

// 噴石が地面に着弾したとき、恐竜に当たるか（地上付近にいて、無敵でなく、操作可能な状態のときだけ）
function rockHitsPlayer(P, rx, rz, radius) {
  const H = CFG.hit;
  return P.state === 'run' && P.invuln <= 0 && P.y < H.maxY && Math.hypot(P.x - rx, P.z - rz) < radius + H.dinoR;
}

// 直撃：着弾中心から外向き＋上向き＋前方へ吹き飛ばす。size は 'small' | 'mid' | 'large'
function knockPlayer(P, rx, rz, size) {
  const H = CFG.hit, pw = CFG.rock.sizes[size].power, dx = P.x - rx;
  const dir = Math.abs(dx) > 0.25 ? Math.sign(dx) : (P.x > 0 ? -1 : 1);   // ほぼ真下なら、広く空いている側へ
  P.state = 'knocked'; P.stateT = 0; P.knockT = H.knockBase + H.knockPer * pw; P.power = pw;
  P.kvx = dir * H.kickSide * pw; P.kvf = H.kickFwd * pw;
  P.vx = 0; P.vy = H.kickUp * (0.6 + 0.4 * pw); P.y = Math.max(P.y, 0) + 0.01; P.grounded = false;
  P.tumble = 0; P.spinRate = -H.spin * (0.7 + 0.3 * pw);
  P.slow = H.slowSec * (0.5 + 0.5 * pw); P.slowF = H.slowFactor; P.hits++;
  return true;
}

function stepKnocked(P, dt) {
  const H = CFG.hit, M = CFG.move;
  P.stateT += dt;
  P.x += P.kvx * dt;
  if (P.x > M.maxX) { P.x = M.maxX; P.kvx = -Math.abs(P.kvx) * 0.4; }
  if (P.x < -M.maxX) { P.x = -M.maxX; P.kvx = Math.abs(P.kvx) * 0.4; }
  P.vy -= CFG.jump.gravity * dt; P.y += P.vy * dt;
  if (P.y <= 0) {
    P.y = 0;
    if (P.vy < -H.bounceMin) { P.vy = -P.vy * H.bounce; P.grounded = false; } else { P.vy = 0; P.grounded = true; }
  }
  const drag = Math.exp(-(P.grounded ? H.friction : 0.5) * dt);
  P.kvx *= drag; P.kvf *= drag;
  P.tumble += P.spinRate * dt * (P.grounded ? 0.3 : 1);
  if (P.stateT >= P.knockT && (P.grounded || P.stateT >= P.knockT + 0.5)) {   // 吹き飛び終わり → 起き上がり
    P.y = 0; P.vy = 0; P.grounded = true; P.kvx = 0; P.kvf = 0; P.vx = 0;
    const TAU = Math.PI * 2; P.tumble -= TAU * Math.round(P.tumble / TAU);   // 一番近い「立ち姿」へ（見た目の巻き戻りを最小に）
    P.state = 'recover'; P.stateT = 0;
  }
  return H.knockMul;
}

// inp = { left, right, jump }（jump は「押した瞬間」の 1 回分）。P を直接更新する
function stepPlayer(P, inp, dt) {
  const M = CFG.move, J = CFG.jump, H = CFG.hit;
  if (P.invuln > 0) P.invuln = Math.max(0, P.invuln - dt);
  if (P.stumbleT > 0) P.stumbleT = Math.max(0, P.stumbleT - dt);
  let mul = 1;
  if (P.state === 'run') {
    const dir = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
    const air = !P.grounded;
    if (dir !== 0) P.vx = approach(P.vx, dir * M.maxSpeed, M.accel * (air ? M.airAccelMul : 1) * dt);
    else P.vx = approach(P.vx, 0, M.decel * (air ? M.airDecelMul : 1) * dt);
    P.x += P.vx * dt;
    if (P.x > M.maxX) { P.x = M.maxX; if (P.vx > 0) P.vx = 0; }
    if (P.x < -M.maxX) { P.x = -M.maxX; if (P.vx < 0) P.vx = 0; }
    if (inp.jump && P.grounded) { P.vy = J.velocity; P.grounded = false; }
    if (!P.grounded) {
      P.vy -= J.gravity * dt; P.y += P.vy * dt;
      if (P.y <= 0) { P.y = 0; P.vy = 0; P.grounded = true; }
    }
    if (P.slow > 0) {   // 直撃のあとしばらく遅い。最後の slowRamp 秒でなめらかに元の速さへ
      P.slow = Math.max(0, P.slow - dt);
      mul = P.slowF + (1 - P.slowF) * (1 - Math.min(1, P.slow / H.slowRamp));
    }
  } else if (P.state === 'knocked') {
    mul = stepKnocked(P, dt);
  } else {   // recover：立ち上がるまで操作不能
    P.stateT += dt; P.tumble *= Math.exp(-10 * dt); P.vx = 0; P.y = 0; P.vy = 0; P.grounded = true;
    mul = H.recoverMul;
    if (P.stateT >= H.recoverSec) { P.state = 'run'; P.stateT = 0; P.tumble = 0; P.invuln = H.invulnSec; }
  }
  P.time += dt;
  P.speed = speedAt(P.time) * mul;
  P.dist += (P.speed + P.kvf) * dt;
  P.z = -P.dist;   // 前方は -z
}

// ジャンプの滞空時間と最高到達点（調整の目安）
function jumpStats() { const J = CFG.jump; return { air: 2 * J.velocity / J.gravity, peak: J.velocity * J.velocity / (2 * J.gravity) }; }
// ===== 火山の噴火状態（純ロジック。経過秒 → 状態。three.js 非依存） =====
function smooth01(x) { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }

// t = ゲーム開始からの秒。k = 噴火強度 0〜1、smoke = 煙の量（噴火前も少しある）
function volcanoState(t) {
  const V = CFG.volcano;
  if (!(t >= V.eruptDelay)) return { state: 'idle', k: 0, smoke: V.idleSmoke, shake: 0, flash: 0, boom: false };
  const e = t - V.eruptDelay, k = smooth01(e / V.rampTime);
  const sh = Math.max(0, 1 - e / V.shakeDur), fl = Math.max(0, 1 - e / V.flashDur);
  return { state: 'erupting', k, smoke: V.idleSmoke + (1 - V.idleSmoke) * k, shake: V.shakeAmp * sh * sh, flash: V.flashMax * fl * fl, boom: e < V.boomDur };
}
// ===== 噴石のスケジューラ（純ロジック。three.js 非依存） =====
function rr(rng, a, b) { return a + (rng ? rng() : Math.random()) * (b - a); }

function newRockSched() { return { timer: CFG.rock.firstDelay, rocks: [], nextId: 1, s: null }; }   // s = 難易度の強度（null なら固定値）

function pickRockSize(r, weights) {
  const w = weights || CFG.rock.weights, x = r * (w.small + w.mid + w.large);
  return x < w.small ? 'small' : x < w.small + w.mid ? 'mid' : 'large';
}

// 落下地点：着弾までに恐竜が進む距離を見込んで前方にずらす。aimed なら恐竜の予想位置の近く、そうでなければ前方の荒野のどこか
function pickRockTarget(P, size, rng, aimChance) {
  const R = CFG.rock, C = R.sizes[size], lim = CFG.move.maxX + R.edgeMargin;
  const lead = Math.max(0, P.speed) * C.warn, aimed = rr(rng, 0, 1) < (aimChance == null ? R.aimChance : aimChance);
  let x, z;
  if (aimed) { x = P.x + rr(rng, -R.aimJitterX, R.aimJitterX); z = P.z - lead + rr(rng, -R.aimJitterZ, R.aimJitterZ); }
  else { x = rr(rng, -R.spreadX, R.spreadX); z = P.z - lead - rr(rng, 3, R.aheadExtra); }
  return { x: Math.max(-lim, Math.min(lim, x)), z, aimed };
}

// 噴石を1個追加（同時数が上限なら null）。warn は開発用の秒数上書き
function spawnRock(S, size, x, z, rng, warn) {
  if (S.rocks.length >= CFG.rock.maxActive) return null;
  const C = CFG.rock.sizes[size];
  const r = { id: S.nextId++, size, x, z, t: 0, warn: warn || C.warn, radius: C.radius, vis: C.vis, H: C.fallH,
              ox: rr(rng, -CFG.rock.sideOff, CFG.rock.sideOff), oz: CFG.rock.backDist * rr(rng, 0.8, 1.2) };
  S.rocks.push(r); return r;
}

// 飛行中の位置：後方の高い所から放物線で着弾点へ（y は着弾で 0）
function rockPos(r) {
  const u = Math.min(1, r.t / r.warn);
  return { x: r.x + r.ox * (1 - u), y: r.H * (1 - u * u), z: r.z + r.oz * (1 - u), u };
}


// ---- 公平性：「避けようがない」噴石を出さない ----
// 着弾地点の危険帯：その噴石が着弾する時刻に、プレイヤー（いまの速さで直進すると仮定）が円に入ってしまう x の範囲。届かなければ null
function rockZone(P, size, x, z, rem) {
  const C = CFG.rock.sizes[size], F = CFG.rock.fair, v = Math.max(P.speed, 1), R = C.radius + CFG.hit.dinoR + F.margin;
  const dz = Math.abs(P.z - v * rem - z);
  if (dz >= R) return null;
  const dx = Math.sqrt(R * R - dz * dz);
  return { lo: x - dx, hi: x + dx, rem };
}
// この噴石 cand = { size, x, z, rem } を足しても、プレイヤーが着弾までに安全な x へ走って逃げ切れるか。
// 反応時間 react のあと最高横速度で走る（助走ぶん accelLoss を引く）。跳ばないと越えられない障害物が目前なら、空中で動きにくいぶん jumpPenalty を引く。
// 噴石どうしが重なって逃げ道が足りなくなる配置、逃げる時間が足りない配置を弾く（資料 §16「必ず回避可能なルートを作る」）
function rockEscapable(S, P, cand, OB) {
  const F = CFG.rock.fair, M = CFG.move, zones = [];
  for (const r of S.rocks) { const z = rockZone(P, r.size, r.x, r.z, r.warn - r.t); if (z) zones.push(z); }
  const zc = rockZone(P, cand.size, cand.x, cand.z, cand.rem); if (zc) zones.push(zc);
  const inZ = (x, z) => x > z.lo && x < z.hi, here = zones.filter(z => inZ(P.x, z));
  if (!here.length) return true;
  let best = null;
  for (let x = -M.maxX; x <= M.maxX + 1e-9; x += 0.25) {
    if (zones.some(z => inZ(x, z))) continue;
    if (best === null || Math.abs(x - P.x) < Math.abs(best - P.x)) best = x;
  }
  if (best === null) return false;
  let avail = M.maxSpeed * (Math.min(...here.map(z => z.rem)) - F.react) - F.accelLoss;
  if (OB && OB.list) {
    const O = CFG.obstacle, v = Math.max(P.speed, 1);
    for (const ob of OB.list) {
      if (ob.type === 'pool') continue;
      const tz = (P.z - (ob.z + (ob.type === 'crater' ? ob.r : ob.hd) + O.depthPad)) / v;
      if (tz > -0.1 && tz < cand.rem + 0.3 && Math.abs(P.x - ob.x) < ob.hw + O.dinoR + 0.6) { avail -= F.jumpPenalty; break; }
    }
  }
  return Math.abs(best - P.x) <= avail;
}

// 1 フレーム進める。erupting のときだけ新しい噴石を出す。着弾した噴石は取り除き、直撃なら恐竜を吹き飛ばす
function stepRocks(S, P, dt, erupting, rng, OB) {
  const R = CFG.rock, ev = { spawned: [], landed: [] }, K = rockParams(S.s);
  if (erupting) {
    S.timer -= dt;
    if (S.timer <= 0) {
      if (S.rocks.length < K.maxActive) {
        const size = pickRockSize(rr(rng, 0, 1), K.weights), warn = R.sizes[size].warn;
        let tg = null;   // 逃げ切れない配置になる場所は選び直す（fair.tries 回まで）。全部だめなら少し待ってやり直す
        for (let i = 0; i < R.fair.tries && !tg; i++) { const c = pickRockTarget(P, size, rng, K.aim); if (rockEscapable(S, P, { size, x: c.x, z: c.z, rem: warn }, OB)) tg = c; }
        const r = tg ? spawnRock(S, size, tg.x, tg.z, rng) : null;
        if (r) { ev.spawned.push(r); S.timer = K.interval * (1 + R.jitter * (rr(rng, 0, 1) * 2 - 1)); } else S.timer = R.fair.retry;
      } else S.timer = 0.25;
    }
  }
  const alive = [];
  for (const r of S.rocks) {
    if (ev.spawned.indexOf(r) < 0) r.t += dt;
    if (r.t >= r.warn) {
      const hit = rockHitsPlayer(P, r.x, r.z, r.radius);
      if (hit) knockPlayer(P, r.x, r.z, r.size);
      ev.landed.push({ rock: r, hit });
    } else alive.push(r);
  }
  S.rocks = alive;
  return ev;
}
// ===== マグマと一回のゲーム進行（純ロジック。three.js 非依存） =====
// 位置は「走行距離（dist）の座標」で持つ。M.front＝マグマ先端の位置、P.dist＝プレイヤーの位置。前方ほど大きい
// 差（gap）= P.dist - M.front が 0 以下になったらゲームオーバー（ジャンプ中でも関係なし）
function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }

function newMagma() { return { phase: 'playing', active: false, clearT: 0, front: -CFG.magma.startGap, speed: 0, t: 0, deadT: 0, deathDist: 0 }; }
function newGame() { return { P: newPlayer(), M: newMagma(), RS: newRockSched(), OB: newObstacles() }; }

// 噴火してから e 秒後のマグマの速さ magmaSpeedAt(e) は 29-difficulty-logic.js（難易度の強度に連動）
function magmaGap(M, P) { return P.dist - M.front; }
// 近さ 0〜1（range 以上離れていれば 0、接触で 1）
function magmaProx(gap, range) { return clamp01(1 - gap / range); }
// HUD のゲージ：点灯する点の数（0〜dangerGaps.length）。近いほど多い
function magmaDanger(gap) { let n = 0; for (const g of CFG.magma.dangerGaps) if (gap < g) n++; return n; }

// マグマを 1 フレーム進める。このフレームで追いつかれたら true
function stepMagma(M, P, dt, erupting) {
  const C = CFG.magma;
  if (M.phase === 'dead') {   // 死亡後：先端はプレイヤーを少し越えるまで進んで止まる（溶岩面が恐竜に被さる）
    M.deadT += dt;
    const cap = M.deathDist + C.deathOvershoot;
    M.speed = 0;
    M.front += (cap - M.front) * (1 - Math.exp(-6 * dt));   // なめらかに越えて止まる（cap は超えない）
    return false;
  }
  if (!M.active) {
    M.front = P.dist - C.startGap;   // 噴火前は動かない（常に startGap だけ後ろで待機）
    if (!erupting) return false;
    M.active = true;
  }
  M.t += dt; M.speed = magmaSpeedAt(M.t) * magmaRubber(P.dist - M.front); M.front += M.speed * dt;
  if (P.dist - M.front <= 0) {
    M.phase = 'dead'; M.deadT = 0; M.deathDist = P.dist; M.front = P.dist;
    P.state = 'dead'; P.stateT = 0; P.vx = 0; P.vy = 0; P.kvx = 0; P.kvf = 0; P.invuln = 0; P.slow = 0; P.tumble = 0;
    if (P.y < 0.05) { P.y = 0; P.grounded = true; }
    return true;
  }
  return false;
}

// ゲーム全体を 1 フレーム進める。G = { P, M, RS, OB }。playing の間だけ前進・操作・噴石の新規生成が動く。
// dead の間はプレイヤーは動かず（P.stateT は死亡演出の経過秒）、噴石は新しく出ないが、すでに落下中のものは着弾する。
// clear（goal.distance に到達）：前進・噴石・マグマ・障害物をすべて止める（落下中の噴石も消す）。M.phase === 'clear'
function stepGame(G, inp, dt, rng) {
  const { P, M, RS, OB } = G, ev = { spawned: [], landed: [], died: false, cleared: false, obstacle: { hits: [], spawned: [], removed: 0 } };
  if (M.phase === 'playing') {
    stepPlayer(P, inp, dt);
    if (OB) ev.obstacle = stepObstacles(OB, P, dt);
    const erupting = volcanoState(P.time).state === 'erupting';
    RS.s = erupting ? difficultyAt(P.time - CFG.volcano.eruptDelay).s : 0;   // 噴石の間隔・大きさ・同時数は難易度の強度で決まる
    const r = stepRocks(RS, P, dt, erupting, rng, OB); ev.spawned = r.spawned; ev.landed = r.landed;
    ev.died = stepMagma(M, P, dt, erupting);
    if (!ev.died && reachedGoal(G)) {
      M.phase = 'clear'; M.clearT = 0; ev.cleared = true; RS.rocks = [];
      P.speed = 0; P.vx = 0; P.kvx = 0; P.kvf = 0; P.slow = 0; P.invuln = 0; P.tumble = 0; P.stumbleT = 0;
      if (P.state !== 'run') { P.state = 'run'; P.stateT = 0; }
      if (P.y < 0.05) { P.y = 0; P.grounded = true; }
    }
  } else if (M.phase === 'clear') {
    P.stateT += dt; M.clearT += dt;
    if (!P.grounded) { P.vy -= CFG.jump.gravity * dt; P.y += P.vy * dt; if (P.y <= 0) { P.y = 0; P.vy = 0; P.grounded = true; } }   // 空中でクリアしたら着地だけする
  } else {
    P.stateT += dt;
    const r = stepRocks(RS, P, dt, false, rng); ev.landed = r.landed;
    stepMagma(M, P, dt, false);
  }
  return ev;
}

// 全状態を初期化（オブジェクトの参照は変えず、中身だけ入れ替える）
function resetGame(G, seed) {
  Object.assign(G.P, newPlayer()); Object.assign(G.M, newMagma()); Object.assign(G.RS, newRockSched()); Object.assign(G.OB, newObstacles(seed));
  return G;
}
// ===== 障害物（純ロジック。three.js 非依存）=====
// 岩・倒木・クレーター・マグマ溜まりを、走行距離に沿って「枠（slot）」ごとに決める。
// 枠 k の位置は startDist + k*slotStep + ばらつき(0〜slotStep-minGapZ) なので、隣り合う枠は必ず minGapZ 以上離れる。
// 1 つの枠には障害物が 1 個までなので、同じ z 帯（横一列）に 2 個並ぶことはない。結果は seed と k だけで決まる（再現できる）。
function obRng(seed, k) {   // (seed, k) から作る小さな乱数列（mulberry32）
  let h = (seed | 0) ^ Math.imul((k + 1) | 0, 0x9e3779b1);
  h = Math.imul(h ^ (h >>> 16), 0x85ebca6b); h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35); h ^= h >>> 16;
  let s = h >>> 0;
  return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function obLerp(a, b, t) { return a + (b - a) * t; }

// 枠が埋まる確率。走行距離で start → end へ線形に増える（level は先取り分 0〜1）
function obDensity(dist, level) {
  const D = CFG.obstacle.density, t = clamp01(difficultyAtDist(dist).s + (level || 0));   // 難易度の強度（その距離を走る頃の噴火後の秒から）
  return obLerp(D.start, D.end, t);
}

// 枠 k の「素の」障害物（他との兼ね合いを見る前）。無ければ null。乱数は常に同じ順に使う
function obSlot(seed, k, level) {
  const O = CFG.obstacle, rng = obRng(seed, k);
  const u = O.startDist + k * O.slotStep + rng() * (O.slotStep - O.minGapZ);   // 基準速度での位置
  const dist = O.startDist + (u - O.startDist) * speedScaleAtDist(u);   // 速く走るほど間隔を広げる（時間で見た間隔・ジャンプの余裕が一定になる。単調増加なので順序と最低間隔 minGapZ は保たれる）
  const fill = rng(), pick = rng(), a = rng(), b = rng(), c = rng();
  if (fill >= obDensity(dist, level)) return null;
  const types = ['rock', 'log', 'crater', 'pool'].filter(t => dist - O.startDist >= O.unlock[t] && O.weights[t] > 0);
  if (!types.length) return null;
  let tot = 0; for (const t of types) tot += O.weights[t];
  let x = pick * tot, type = types[types.length - 1];
  for (const t of types) { if (x < O.weights[t]) { type = t; break; } x -= O.weights[t]; }
  const lim = CFG.move.maxX, ob = { type, dist, z: -dist, hit: false };
  if (type === 'rock') {
    const R = O.rock, r = obLerp(R.rMin, R.rMax, a);
    Object.assign(ob, { x: (c * 2 - 1) * (lim - 1), r, h: obLerp(R.hMin, R.hMax, b), hw: r * R.shrink, hd: r * R.shrink });
  } else if (type === 'log') {
    const L = O.log, len = obLerp(L.lenMin, L.lenMax, a), reach = Math.max(0, lim + L.overhang - len / 2);
    Object.assign(ob, { x: (c * 2 - 1) * reach, len, h: L.h, hw: len / 2, hd: L.r, r: L.r });
  } else if (type === 'crater') {
    const C = O.crater, r = obLerp(C.rMin, C.rMax, a);
    Object.assign(ob, { x: (c * 2 - 1) * (lim - 1), r, h: C.clearY, hw: r, hd: r });
  } else {
    const Pl = O.pool, r = obLerp(Pl.rMin, Pl.rMax, a);
    Object.assign(ob, { x: (c * 2 - 1) * (lim - r * 0.5), r, h: Pl.clearY, hw: r, hd: r });
  }
  return ob;
}

// 枠 k の最終的な障害物。近くに倒木（素の判定）があれば、倒木自身が後ろの枠なら消し、他の種類は消す（倒木の前後を空ける）
function obFinal(seed, k, level) {
  const O = CFG.obstacle, ob = obSlot(seed, k, level);
  if (!ob) return null;
  for (let j = -3; j <= 3; j++) {
    if (j === 0 || k + j < 0) continue;
    const n = obSlot(seed, k + j, level);
    if (!n || n.type !== 'log' || Math.abs(n.dist - ob.dist) >= O.logClearZ * speedScaleAtDist(ob.dist)) continue;
    if (ob.type !== 'log' || j < 0) return null;
  }
  return ob;
}

// 走行距離 [-zFrom, -zTo) にある障害物を、手前（スタート側）から順に返す（zFrom > zTo。z は前方が負）。同じ引数なら同じ結果
function planObstacles(seed, zFrom, zTo, level) {
  const O = CFG.obstacle, d0 = -zFrom, d1 = -zTo, out = [];
  const gMax = CFG.run.maxSpeed / CFG.run.baseSpeed, k0 = Math.max(0, Math.floor((d0 - O.startDist) / (O.slotStep * gMax)) - 1), k1 = Math.ceil((d1 - O.startDist) / O.slotStep) + 1;
  for (let k = k0; k <= k1; k++) {
    const ob = obFinal(seed, k, level);
    if (ob && ob.dist >= d0 && ob.dist < d1) out.push(ob);
  }
  return out;
}

function newObstacles(seed) {
  return { seed: seed == null ? CFG.obstacle.seed : seed, list: [], nextId: 1, genDist: 0, prevZ: 0, off: false, level: 0 };
}

// 岩・倒木・マグマ溜まりで転倒：Phase 3 の knocked → recover をそのまま使う（吹き飛びより弱い、つんのめる転がり）
function tripPlayer(P, T) {
  P.state = 'knocked'; P.stateT = 0; P.knockT = T.knock; P.power = 0.5;
  P.kvx = 0; P.kvf = T.fwd; P.vx = 0; P.vy = T.up; P.y = Math.max(P.y, 0) + 0.01; P.grounded = false;
  P.tumble = 0; P.spinRate = -T.spin;
  P.slow = T.slowSec; P.slowF = T.slowFactor; P.trips++;
}
// クレーター：転倒せず、少しつまずいて軽く減速
function stumblePlayer(P) {
  const S = CFG.obstacle.stumble;
  P.stumbleT = S.tiltSec;
  if (P.slow <= 0) { P.slow = S.slowSec; P.slowF = S.slowFactor; }   // すでに減速中ならそのまま
}

// 障害物 ob にプレイヤー（この 1 フレームで z が prevZ → P.z と動いた）が当たるか。ジャンプで高さが足りていれば当たらない
function obHits(ob, P, prevZ) {
  const O = CFG.obstacle;
  const top = ob.h - (ob.type === 'rock' || ob.type === 'log' ? O.footMargin : 0);   // 岩・倒木は少し甘め
  if (ob.hit || P.y >= top) return false;
  const dx = Math.abs(P.x - ob.x);
  if (ob.type === 'rock' || ob.type === 'log') {
    return dx < ob.hw + O.dinoR && P.z <= ob.z + ob.hd + O.depthPad && prevZ >= ob.z - ob.hd - O.depthPad;
  }
  const dz = ob.z < P.z ? P.z - ob.z : ob.z > prevZ ? ob.z - prevZ : 0;   // この 1 フレームの移動線分と中心との最短の前後差
  return Math.hypot(dx, dz) < ob.r + (ob.type === 'pool' ? O.dinoR : O.dinoR * 0.3);
}

// 1 フレーム進める：前方を生成・後方を破棄・衝突判定。OB.off なら何もしない。ev.hits = [{ ob, kind: 'trip' | 'stumble' }]
function stepObstacles(OB, P, dt) {
  const O = CFG.obstacle, ev = { hits: [], spawned: [], removed: 0 };
  if (OB.off) { OB.prevZ = P.z; return ev; }
  const need = P.dist + O.aheadDist;
  while (OB.genDist < need) {
    for (const ob of planObstacles(OB.seed, -OB.genDist, -(OB.genDist + O.chunk), OB.level)) { ob.id = OB.nextId++; OB.list.push(ob); ev.spawned.push(ob); }
    OB.genDist += O.chunk;
  }
  const n0 = OB.list.length;
  OB.list = OB.list.filter(o => o.z <= P.z + O.behindDist); ev.removed = n0 - OB.list.length;
  if (P.state === 'run' && P.invuln <= 0) {
    for (const ob of OB.list) {
      if (!obHits(ob, P, OB.prevZ)) continue;
      ob.hit = true;   // 1 つの障害物では 1 回だけ（連続衝突ループ防止。復帰後の無敵も別にある）
      if (ob.type === 'crater') { stumblePlayer(P); ev.hits.push({ ob, kind: 'stumble' }); }
      else { tripPlayer(P, ob.type === 'pool' ? O.poolTrip : O.trip); ev.hits.push({ ob, kind: 'trip' }); }
      break;
    }
  }
  OB.prevZ = P.z;
  return ev;
}
// ===== 難易度（純ロジック。three.js 非依存）=====
// 基準の時間 e＝「噴火が始まってからの秒」（= P.time - volcano.eruptDelay）。マグマも噴石も噴火で動き出すので、資料 §17 の
// 0〜20 / 20〜40 / 40〜60 / 60秒以降 は、この e で数える（ゲーム開始から数えると噴火前の 4 秒ぶんチュートリアルが短くなるため）。
// 強度 s（0〜1）は区間の境目でなめらかに（折れ線で連続）つながり、階段状には変わらない。噴石の間隔・大型率・マグマの速さ・障害物の密度・画面揺れは全部この s から決まる。
const STAGE_NAMES = ['tutorial', 'normal', 'danger', 'final'];

function difficultyAt(e) {
  const D = CFG.difficulty, K = D.knots;
  if (!(e > 0)) e = 0;
  let s = K[K.length - 1][1];
  for (let i = 1; i < K.length; i++) {
    if (e < K[i][0]) { s = obLerp(K[i - 1][1], K[i][1], (e - K[i - 1][0]) / (K[i][0] - K[i - 1][0])); break; }
  }
  let stage = 0;
  for (let i = 0; i < D.stageFrom.length; i++) if (e >= D.stageFrom[i]) stage = i;
  const last = stage >= D.stageFrom.length - 1, a = D.stageFrom[stage], b = last ? a : D.stageFrom[stage + 1];
  return { e, s, stage, next: last ? stage : stage + 1, blend: last ? 1 : (e - a) / (b - a), name: STAGE_NAMES[stage], label: D.labels[stage] };
}

// 距離 → 「ふつうに走ったときの噴火後の秒」。障害物は距離で決まる（seed と距離だけで再現できる）ので、距離から難易度を引くのに使う。被弾の減速は考えない
function nominalTime(dist) {
  const a = CFG.run.accel / 2, b = CFG.run.baseSpeed, d = Math.max(0, dist);
  const t = a > 0 ? (-b + Math.sqrt(b * b + 4 * a * d)) / (2 * a) : d / b;
  const tMax = (CFG.run.maxSpeed - CFG.run.baseSpeed) / CFG.run.accel;   // 最高速に達してからは等速
  return t <= tMax ? t : tMax + (d - (b * tMax + a * tMax * tMax)) / CFG.run.maxSpeed;
}
function difficultyAtDist(dist) { return difficultyAt(nominalTime(dist) - CFG.volcano.eruptDelay); }
// その距離でのふつうの走る速さ ÷ 基準速度（障害物の間隔を速さに比例して広げるのに使う。1 以上）
function speedScaleAtDist(dist) { return speedAt(nominalTime(dist)) / CFG.run.baseSpeed; }

// 噴石：強度 s での 落下間隔 / 同時数の上限 / 大きさの重み。s が null/undefined なら従来の固定値（Phase 3 の挙動）
function rockParams(s) {
  const R = CFG.rock, D = CFG.difficulty.rock;
  if (s == null) return { interval: R.interval, maxActive: R.maxActive, weights: R.weights, aim: R.aimChance };
  const w0 = D.weights0, w1 = D.weights1, u = smooth01((s - D.largeFrom) / (1 - D.largeFrom));   // 大型は強度 largeFrom（= 40 秒時点）まで 0、そこから増える
  const large = w1.large * u, rest = 1 - large;
  const sm = obLerp(w0.small, w1.small, s), md = obLerp(w0.mid, w1.mid, s), sum = sm + md;
  return { interval: obLerp(D.interval0, D.interval1, Math.pow(s, D.curve)), maxActive: Math.min(R.maxActive, Math.round(obLerp(D.active0, D.active1, s))), aim: obLerp(D.aim0, D.aim1, s),
           weights: { small: rest * sm / sum, mid: rest * md / sum, large } };
}

// マグマの速さ：噴火後 e 秒。強度 s にそって speed0 → speedMax（序盤遅く・中盤少しずつ・終盤かなり速く）
function magmaSpeedAt(e) {
  const C = CFG.magma;
  return obLerp(C.speed0, C.speedMax, Math.pow(difficultyAt(e).s, CFG.difficulty.magmaCurve));
}

// 60 秒以降の常時の小刻みな画面揺れの大きさ（位置のみ）。final の少し前から 0 → amp
function finalShake(e) { const S = CFG.difficulty.shake; return S.amp * smooth01((e - S.from) / S.over); }
// 噴火の迫力の倍率（0〜1）。強度が上がるほど最大へ
function eruptionMul(s) { const E = CFG.difficulty.eruptMul; return obLerp(E, 1, s); }

// クリア：走行距離が goal.distance に届いた
function reachedGoal(G) { return G.P.dist >= CFG.goal.distance; }

// マグマの「ひるみ」：先端が近いほど少しだけ遅くなる（rubber band）。被弾でじわじわ追いつかれても、近づいたぶん少し猶予が生まれて「ギリギリ逃げ切る」展開になる。
// gap >= range なら 1.0（影響なし）、gap = 0 で min。被弾なしで走っている間は gap が range より大きいので効かない
function magmaRubber(gap) { const C = CFG.magma; return obLerp(C.rubberMin, 1, clamp01(gap / C.rubberRange)); }
// ===== 演出の純ロジック（three.js 非依存。verify.html でテスト）=====
// 画面揺れの合成と上限・ヒットストップ・音のダッキング・足音のタイミング・危険マーカーの近さ・つぶれ。
// ゲーム時間（物理）には触らない：ヒットストップは「ゲーム時間を進めない」だけで、演出側の時計は続く。
const FX_PI = Math.PI;
function fxClamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
function fxInt() { return fxClamp01(CFG.fx.intensity); }

function fxNew() { return { hitstop: 0, duckDepth: 0, duckHold: 0, cool: {} }; }
function fxReset(F) { F.hitstop = 0; F.duckDepth = 0; F.duckHold = 0; F.cool = {}; }

// 画面揺れ：複数の揺れの大きさを二乗和の平方根で合成し、上限 cap で頭打ちにする（足し算だと重なったとき操作不能になる）
function fxShakeCombine(amps, cap) {
  let s = 0; for (const a of amps) if (a > 0) s += a * a;
  return Math.min(cap, Math.sqrt(s));
}
// 実際にカメラへ足す揺れの大きさ（演出の強さを掛ける）
function fxShakeTotal(amps) { return fxShakeCombine(amps, CFG.fx.shake.cap) * fxInt(); }

// ヒットストップ：sec 秒ゲーム時間を止める。重なったら長いほうを採用。上限あり
function fxHitstop(F, sec) { const H = CFG.fx.hitstop; F.hitstop = Math.max(F.hitstop, Math.min(H.max, sec * fxInt())); }
// 実時間 dt を渡す。止めるべきフレームなら true（その間ゲームは進めない）。止まる合計は hitstop 秒
function fxHitstopStep(F, dt) {
  if (F.hitstop <= 0) return false;
  F.hitstop = Math.max(0, F.hitstop - dt); return true;
}

// ダッキング：大きな音のとき他の音を下げる。depth=下げる深さ（0〜0.9）, hold=そのままの秒。戻りは release 秒かけて線形
function fxDuck(F, depth, hold) {
  F.duckDepth = Math.min(0.9, Math.max(F.duckDepth, depth * fxInt()));
  F.duckHold = Math.max(F.duckHold, hold == null ? CFG.fx.duck.hold : hold);
}
// 毎フレーム：音量の倍率（1=そのまま、下がると 1-depth）を返す
function fxDuckStep(F, dt) {
  if (F.duckHold > 0) F.duckHold = Math.max(0, F.duckHold - dt);
  else if (F.duckDepth > 0) F.duckDepth = Math.max(0, F.duckDepth - dt / CFG.fx.duck.release);
  return 1 - F.duckDepth;
}

// 足音：脚の位相 phase（ラジアン）が π を跨ぐたびに 1 歩。1 フレームに出す回数は 2 まで
function fxStepCount(prevPhase, phase) {
  if (!(phase > prevPhase)) return 0;
  return Math.min(2, Math.floor(phase / FX_PI) - Math.floor(prevPhase / FX_PI));
}

// 連続で鳴らさないための間隔ゲート（key ごと）。鳴らしてよければ true
function fxCooldown(F, key, now, gap) {
  const last = F.cool[key];
  if (last !== undefined && now - last < gap) return false;
  F.cool[key] = now; return true;
}

// 危険マーカーの近さ：まだ着弾していない噴石のうち、円の縁から恐竜までの水平距離が最小のもの。nearness は range で 1→0
function fxNearRock(rocks, P, range) {
  let best = Infinity;
  for (const r of rocks) {
    if (r.t >= r.warn) continue;
    const d = Math.max(0, Math.hypot(r.x - P.x, r.z - P.z) - r.radius);
    if (d < best) best = d;
  }
  return { d: best, nearness: best === Infinity ? 0 : fxClamp01(1 - best / range) };
}

// 縦のつぶれ（スクワッシュ）の倍率。sinceTakeoff=離陸からの秒、sinceLand=着地からの秒（古い値は大きな数を渡す）。strength=着地の強さ 0〜1
// 離陸：一瞬しゃがむ（溜め）→ 伸びる。着地：つぶれて戻る
function fxSquash(sinceTakeoff, sinceLand, strength) {
  const Q = CFG.fx.squash, k = fxInt();
  let y = 1;
  if (sinceLand >= 0 && sinceLand < 0.2) y -= Q.land * fxClamp01(strength) * Math.sin(FX_PI * sinceLand / 0.2) * (1 - sinceLand / 0.2 * 0.3) * k;
  if (sinceTakeoff >= 0 && sinceTakeoff < 0.26) {
    if (sinceTakeoff < 0.07) y -= Q.crouch * Math.sin(FX_PI * sinceTakeoff / 0.07) * k;
    else y += 0.1 * Math.sin(FX_PI * (sinceTakeoff - 0.07) / 0.19) * k;
  }
  return y;
}
// ===== 3D ステージ：空・フォグ・地面・装飾・カメラ =====
const WORLD = {};

function rnd(a, b) { return a + Math.random() * (b - a); }

function makeSkyTexture() {
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const g = c.getContext('2d'), grd = g.createLinearGradient(0, 0, 0, 256);
  grd.addColorStop(0, '#1c0e10'); grd.addColorStop(0.45, '#3d1c18'); grd.addColorStop(0.8, '#7a3d2a'); grd.addColorStop(1, '#9a5236');
  g.fillStyle = grd; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); return t;
}

function makeGroundTexture() {
  const S = 256, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = '#6b5f5a'; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 1400; i++) {   // 灰のまだら
    const v = 70 + Math.floor(Math.random() * 60);
    g.fillStyle = `rgba(${v + 14},${v + 4},${v},${0.25 + Math.random() * 0.3})`;
    const r = 1 + Math.random() * 5; g.beginPath(); g.arc(Math.random() * S, Math.random() * S, r, 0, 7); g.fill();
  }
  for (let i = 0; i < 40; i++) {   // 焼けた赤茶の斑点
    g.fillStyle = `rgba(110,48,34,${0.25 + Math.random() * 0.25})`;
    g.beginPath(); g.arc(Math.random() * S, Math.random() * S, 2 + Math.random() * 6, 0, 7); g.fill();
  }

  t.repeat.set(CFG.world.texRepeat, CFG.world.texRepeat); return t;
}

function buildWorld() {
  const W = CFG.world, host = document.getElementById('view');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  host.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = makeSkyTexture();
  scene.fog = new THREE.Fog(W.fogColor, W.fogNear, W.fogFar);
  const camera = new THREE.PerspectiveCamera(CFG.cam.fov, 16 / 9, 0.1, 600);

  scene.add(new THREE.HemisphereLight(0xc9a392, 0x3a2420, 0.9));
  const sun = new THREE.DirectionalLight(0xffb27a, 0.8); sun.position.set(-30, 40, 20); scene.add(sun);

  // 地面：プレイヤーの z に追従させ、テクスチャだけ流して「前へ進む」見た目にする
  const gtex = makeGroundTexture();
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(W.groundSize, W.groundSize), new THREE.MeshLambertMaterial({ map: gtex }));
  ground.rotation.x = -Math.PI / 2; scene.add(ground);

  // 装飾（岩・丘）。障害物ではなく見た目だけ。遊べる範囲（±clearHalf）の外側に置く
  const rockMat = new THREE.MeshLambertMaterial({ color: 0x4d4440, flatShading: true });
  const rockMat2 = new THREE.MeshLambertMaterial({ color: 0x5f524b, flatShading: true });
  const hillMat = new THREE.MeshLambertMaterial({ color: 0x564a45, flatShading: true });
  const decor = [];
  function place(d, initial, pz) {
    const side = Math.random() < 0.5 ? -1 : 1;
    const off = d.isHill ? rnd(W.clearHalf + 14, W.clearHalf + W.spread) : rnd(W.clearHalf, W.clearHalf + W.spread * 0.7);
    d.mesh.position.x = side * off;
    d.mesh.position.z = initial ? pz + rnd(W.spawnBehind, -W.spawnAhead) : pz - W.spawnAhead - rnd(0, 30);
  }
  for (let i = 0; i < W.rocks; i++) {
    const s = rnd(0.8, 3.2), m = new THREE.Mesh(new THREE.DodecahedronGeometry(1, 0), Math.random() < 0.5 ? rockMat : rockMat2);
    m.scale.set(s * rnd(0.8, 1.4), s * rnd(0.6, 1.1), s * rnd(0.8, 1.4)); m.rotation.set(rnd(0, 3), rnd(0, 3), rnd(0, 3)); m.position.y = s * 0.35;
    scene.add(m); decor.push({ mesh: m, isHill: false });
  }
  for (let i = 0; i < W.hills; i++) {
    const s = rnd(9, 22), m = new THREE.Mesh(new THREE.SphereGeometry(1, 7, 4, 0, Math.PI * 2, 0, Math.PI / 2), hillMat);
    m.scale.set(s * rnd(1.2, 2), s * rnd(0.25, 0.5), s * rnd(1, 1.6)); m.rotation.y = rnd(0, 3);
    scene.add(m); decor.push({ mesh: m, isHill: true });
  }
  decor.forEach(d => place(d, true, 0));

  Object.assign(WORLD, { renderer, scene, camera, ground, gtex, decor, place, camX: 0, lookX: 0, camReady: false });
  fit();
  addEventListener('resize', fit);
}

function fit() {
  const host = document.getElementById('view'), w = host.clientWidth || innerWidth, h = host.clientHeight || innerHeight;
  WORLD.renderer.setSize(w, h, false);
  WORLD.camera.aspect = w / h; WORLD.camera.updateProjectionMatrix();
}

function updateWorld(P, dt) {
  const W = CFG.world, C = CFG.cam, cam = WORLD.camera;
  WORLD.ground.position.z = P.z;
  const tile = W.groundSize / W.texRepeat;
  WORLD.gtex.offset.y = P.dist / tile;   // 地面が手前へ流れる（前方は -z）
  WORLD.decor.forEach(d => { if (d.mesh.position.z > P.z + W.spawnBehind) WORLD.place(d, false, P.z); });

  // カメラ：後方上から見下ろす。横と高さはなめらかに追従、前後は一定距離
  const k = 1 - Math.exp(-C.follow * dt);
  if (!WORLD.camReady) { WORLD.camX = P.x * C.followX; WORLD.lookX = P.x * C.lookFollowX; WORLD.camY = C.height; WORLD.camReady = true; }
  WORLD.camX += (P.x * C.followX - WORLD.camX) * k;
  WORLD.lookX += (P.x * C.lookFollowX - WORLD.lookX) * k;
  WORLD.camY += (C.height + P.y * C.jumpLift - WORLD.camY) * k;
  cam.position.set(WORLD.camX, WORLD.camY, P.z + C.back);
  cam.lookAt(WORLD.lookX, C.lookY, P.z - C.lookAhead);
  const fov = Math.min(C.fovMax, C.fov + (P.speed - CFG.run.baseSpeed) * C.fovSpeed);
  if (Math.abs(cam.fov - fov) > 0.01) { cam.fov = fov; cam.updateProjectionMatrix(); }
}

// 再スタート用：装飾を初期配置へ、カメラを最初の位置へ
function resetWorld() {
  WORLD.decor.forEach(d => WORLD.place(d, true, 0));
  WORLD.camReady = false; WORLD.camera.fov = CFG.cam.fov; WORLD.camera.updateProjectionMatrix();
}
// ===== 火山：モデル・煙・火・火山灰・空の変化（three.js） =====
const VOL = {};

function makeSoftTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0, 'rgba(255,255,255,1)'); grd.addColorStop(0.45, 'rgba(255,255,255,0.55)'); grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
}

// 粒ごとにサイズ・透明度・色を持てる Points
function makeParticles(max, additive, tex) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(max * 3), size = new Float32Array(max), alpha = new Float32Array(max), col = new Float32Array(max * 3);
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  geo.setAttribute('aAlpha', new THREE.BufferAttribute(alpha, 1));
  geo.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
  const mat = new THREE.ShaderMaterial({
    uniforms: { map: { value: tex }, scaleU: VOL.scaleU },
    vertexShader: 'attribute float aSize;attribute float aAlpha;attribute vec3 aColor;uniform float scaleU;varying float vA;varying vec3 vC;' +
      'void main(){vec4 mv=modelViewMatrix*vec4(position,1.0);gl_PointSize=min(420.0,aSize*scaleU/max(0.1,-mv.z));gl_Position=projectionMatrix*mv;vA=aAlpha;vC=aColor;}',
    fragmentShader: 'uniform sampler2D map;varying float vA;varying vec3 vC;void main(){float a=texture2D(map,gl_PointCoord).a*vA;if(a<0.003)discard;gl_FragColor=vec4(vC,a);}',
    transparent: true, depthWrite: false, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending
  });
  const pts = new THREE.Points(geo, mat); pts.frustumCulled = false;
  return { pts, geo, pos, size, alpha, col, max, age: new Float32Array(max).fill(1e9), life: new Float32Array(max).fill(1), vel: new Float32Array(max * 3), a0: new Float32Array(max), s0: new Float32Array(max), seed: new Float32Array(max), budget: 0 };
}
function pflush(P) { ['position', 'aSize', 'aAlpha', 'aColor'].forEach(n => { P.geo.attributes[n].needsUpdate = true; }); }

function buildVolcano() {
  const V = CFG.volcano, scene = WORLD.scene;
  VOL.scaleU = { value: 360 };
  const tex = makeSoftTexture();
  const group = new THREE.Group(); scene.add(group);   // プレイヤーの z に追従するフレーム
  VOL.group = group;

  // 山本体：先を切った円錐。頂点をゆらして岩肌っぽく
  const cg = new THREE.CylinderGeometry(V.craterR, V.radius, V.height, 22, 4, true);
  const p = cg.attributes.position;
  for (let i = 0; i < p.count; i++) { if (p.getY(i) < V.height / 2 - 0.5) { p.setX(i, p.getX(i) * (1 + Math.sin(i * 12.9) * 0.06)); p.setZ(i, p.getZ(i) * (1 + Math.cos(i * 7.3) * 0.06)); } }
  cg.computeVertexNormals();
  const mountG = new THREE.Group(); mountG.position.y = V.height / 2;
  mountG.add(new THREE.Mesh(cg, new THREE.MeshLambertMaterial({ color: 0x2b1e1b, flatShading: true, fog: false })));
  // 溶岩の筋（火口縁から斜面に沿って流れる）
  const alpha = Math.atan((V.radius - V.craterR) / V.height), slant = Math.hypot(V.radius - V.craterR, V.height);
  const lavaMat = new THREE.MeshBasicMaterial({ color: 0xff5a14, fog: false, side: THREE.DoubleSide });
  for (let i = 0; i < 9; i++) {
    const g = new THREE.Group(); g.rotation.y = i / 9 * Math.PI * 2 + Math.sin(i * 3.1) * 0.2;
    const len = slant * (0.45 + 0.5 * Math.abs(Math.sin(i * 5.7)));
    const m = new THREE.Mesh(new THREE.PlaneGeometry(2.5 + 2 * Math.abs(Math.cos(i * 2.3)), len), lavaMat);
    m.position.set(0, V.height - Math.cos(alpha) * len / 2 - V.height / 2, V.craterR + Math.sin(alpha) * len / 2 + 0.4);
    m.rotation.x = -alpha; g.add(m); mountG.add(g);
  }
  // 火口の光
  const crater = new THREE.Mesh(new THREE.CircleGeometry(V.craterR, 20), new THREE.MeshBasicMaterial({ color: 0xff6a1a, fog: false }));
  crater.rotation.x = -Math.PI / 2; crater.position.y = V.height + 0.2;
  const vg = new THREE.Group(); vg.add(mountG, crater); group.add(vg); VOL.vg = vg;
  VOL.craterY = V.height;

  // パーティクル
  VOL.smoke = makeParticles(V.smokeMax, false, tex);
  VOL.fire = makeParticles(V.fireMax, true, tex);
  VOL.ash = makeParticles(V.ashMax, false, tex);
  VOL.ember = makeParticles(V.emberMax, true, tex);
  VOL.canopy = makeParticles(V.canopyMax, false, tex);   // 空に広がる噴煙の天井（カメラは後ろを向かないので、前方の空の高い所にかぶせる）
  [VOL.smoke, VOL.fire, VOL.ash, VOL.ember, VOL.canopy].forEach(s => group.add(s.pts));
  { const S = VOL.canopy; for (let i = 0; i < S.max; i++) {
    const d = rnd(70, 300), el = rnd(0.12, 0.46);   // 手前からの距離 / 仰角（ラジアン）
    S.pos[i * 3] = rnd(-1, 1) * d * 1.1; S.pos[i * 3 + 1] = 6 + d * Math.tan(el); S.pos[i * 3 + 2] = 11 - d;
    S.s0[i] = rnd(45, 100); S.a0[i] = rnd(0.4, 0.7); S.seed[i] = rnd(0, 6.28); S.vel[i * 3] = rnd(-3, 3); S.life[i] = (el - 0.12) / 0.34;
  } }
  // 灰・火の粉は最初から粒を撒いておく（位置は箱の中でランダム）
  const B = V.ashBox;
  [VOL.ash, VOL.ember].forEach(S => { for (let i = 0; i < S.max; i++) { S.pos[i * 3] = rnd(-B.x, B.x); S.pos[i * 3 + 1] = rnd(0, B.y); S.pos[i * 3 + 2] = rnd(-B.z, 10); S.seed[i] = rnd(0, 6.28); S.vel[i * 3 + 1] = -rnd(2.5, 6); S.s0[i] = rnd(0.7, 1.3); } });

  // 空の再描画用
  VOL.skyTex = scene.background; VOL.skyCanvas = scene.background.image; VOL.skyK = -1;
  VOL.fogA = new THREE.Color(CFG.world.fogColor); VOL.fogB = new THREE.Color(V.fogColor);
  VOL.skyA = ['#1c0e10', '#3d1c18', '#7a3d2a', '#9a5236'].map(c => new THREE.Color(c));
  VOL.skyB = [V.sky.top, V.sky.mid, V.sky.low, V.sky.bottom].map(c => new THREE.Color(c));
  VOL.hemiA = new THREE.Color(0xc9a392); VOL.hemiB = new THREE.Color(0xd2705a);
  VOL.hemi = scene.children.find(o => o.isHemisphereLight);
  VOL.tmp = new THREE.Color(); VOL.t = 0;
}

function spawnSmoke(S, i, k, level) {
  const V = CFG.volcano;
  S.age[i] = 0; S.life[i] = V.smokeLife * rnd(0.8, 1.2);
  const a = rnd(0, 6.28), r = Math.sqrt(Math.random()) * V.craterR * 0.9;
  S.pos[i * 3] = Math.cos(a) * r; S.pos[i * 3 + 1] = VOL.craterY; S.pos[i * 3 + 2] = V.dist + Math.sin(a) * r;
  // vel: x 横ばらつき / y = 立ちのぼる高さ / z = 手前への流れ
  S.vel[i * 3] = rnd(-7, 7) * (0.3 + k); S.vel[i * 3 + 1] = rnd(45, 75) + k * rnd(0, 70); S.vel[i * 3 + 2] = -V.windSpeed * rnd(0.55, 1.1) * (0.4 + 0.6 * k);
  S.s0[i] = rnd(22, 46) * (0.5 + 0.8 * level); S.a0[i] = rnd(0.5, 0.9); S.seed[i] = k;
}
function spawnFire(S, i) {
  const V = CFG.volcano; S.age[i] = 0;
  const col = Math.random() < 0.3;   // 火柱（大きくゆっくり）か、火花
  S.life[i] = col ? rnd(1.2, 2) : rnd(2, 3.6);
  const a = rnd(0, 6.28), r = Math.sqrt(Math.random()) * V.craterR * 0.8;
  S.pos[i * 3] = Math.cos(a) * r; S.pos[i * 3 + 1] = VOL.craterY; S.pos[i * 3 + 2] = V.dist + Math.sin(a) * r;
  S.vel[i * 3] = rnd(-1, 1) * (col ? 6 : 28); S.vel[i * 3 + 1] = col ? rnd(25, 45) : rnd(45, 90); S.vel[i * 3 + 2] = rnd(-1, 1) * (col ? 6 : 28) - 8;
  S.s0[i] = col ? rnd(12, 22) : rnd(2.5, 5.5); S.a0[i] = col ? 0.8 : 1; S.seed[i] = col ? 1 : 0;
}

function stepSmoke(S, dt, fx) {
  S.budget += S.max / CFG.volcano.smokeLife * fx.smoke * dt;
  for (let i = 0; i < S.max; i++) {
    if (S.age[i] >= S.life[i]) { if (S.budget >= 1) { S.budget -= 1; spawnSmoke(S, i, fx.k, fx.smoke); } else { S.alpha[i] = 0; continue; } }
    S.age[i] += dt; const f = S.age[i] / S.life[i], ymax = S.vel[i * 3 + 1];
    S.pos[i * 3] += S.vel[i * 3] * dt;
    S.pos[i * 3 + 1] = CFG.volcano.height + ymax * (1 - Math.exp(-S.age[i] / 2.6)) * 0.9;   // 立ちのぼって頭打ち→横へ広がる
    S.pos[i * 3 + 2] += S.vel[i * 3 + 2] * dt * (0.25 + Math.min(1, f * 2.2));              // 上空に出たら風で手前へ流れる
    S.size[i] = S.s0[i] * (0.6 + f * 2.4);
    S.alpha[i] = S.a0[i] * Math.min(1, f * 6) * (1 - f) * (0.55 + 0.45 * S.seed[i]);
    // 色：噴火前は灰色、噴火後は黒煙。火口に近いほど下から赤く照らされる
    const dark = 0.5 - 0.42 * S.seed[i], glow = Math.max(0, 1 - f * 2.2) * S.seed[i] * 0.9, hi = 0.18 * S.seed[i] * Math.min(1, f * 1.5);
    S.col[i * 3] = dark + glow * 0.75 + hi; S.col[i * 3 + 1] = dark + glow * 0.28 + hi * 0.25; S.col[i * 3 + 2] = dark + glow * 0.08;
  }
}
function stepFire(S, dt, fx) {
  S.budget += S.max / 2.6 * fx.k * dt;
  for (let i = 0; i < S.max; i++) {
    if (S.age[i] >= S.life[i]) { if (S.budget >= 1) { S.budget -= 1; spawnFire(S, i); } else { S.alpha[i] = 0; continue; } }
    S.age[i] += dt; const f = S.age[i] / S.life[i], col = S.seed[i] > 0.5;
    if (!col) S.vel[i * 3 + 1] -= 32 * dt;
    S.pos[i * 3] += S.vel[i * 3] * dt; S.pos[i * 3 + 1] += S.vel[i * 3 + 1] * dt; S.pos[i * 3 + 2] += S.vel[i * 3 + 2] * dt;
    S.size[i] = S.s0[i] * (col ? 0.6 + f : 1 - f * 0.5);
    S.alpha[i] = S.a0[i] * (1 - f) * (1 - f);
    S.col[i * 3] = 1; S.col[i * 3 + 1] = 0.75 - 0.55 * f; S.col[i * 3 + 2] = 0.25 - 0.22 * f;
  }
}
// プレイヤー周辺に降る粒（箱の中で上から下へ、下に着いたら上に戻す）。灰は gray、火の粉は ember
function stepRain(S, dt, fx, ember, P) {
  const B = CFG.volcano.ashBox, T = VOL.t;
  const lvl = ember ? fx.k : Math.max(fx.k, fx.smoke * 0.12);
  const n = Math.floor(S.max * lvl);
  for (let i = 0; i < S.max; i++) {
    if (i >= n) { S.alpha[i] = 0; continue; }
    S.pos[i * 3 + 1] += S.vel[i * 3 + 1] * dt * (ember ? 0.5 : 1);
    S.pos[i * 3] += (Math.sin(T * 0.8 + S.seed[i]) * 1.2 - 2.5) * dt;   // 風でゆれて横へ流れる
    S.pos[i * 3 + 2] += (3 + Math.cos(T * 0.6 + S.seed[i])) * dt;
    if (S.pos[i * 3 + 1] < 0) { S.pos[i * 3 + 1] = B.y; S.pos[i * 3] = rnd(-B.x, B.x); S.pos[i * 3 + 2] = rnd(-B.z, 6); }
    if (S.pos[i * 3 + 2] > 14) S.pos[i * 3 + 2] -= B.z;
    S.size[i] = (ember ? 0.5 : 0.38) * S.s0[i];
    const fadeIn = Math.min(1, S.pos[i * 3 + 1] / 3);
    if (ember) { S.alpha[i] = 0.9 * fadeIn * (0.6 + 0.4 * Math.sin(T * 7 + S.seed[i] * 9)); S.col[i * 3] = 1; S.col[i * 3 + 1] = 0.25 + 0.25 * S.s0[i]; S.col[i * 3 + 2] = 0.1; }
    else { S.alpha[i] = 0.75 * fadeIn * Math.min(1, lvl * 1.5 + 0.2); const g = 0.12 + 0.2 * S.s0[i]; S.col[i * 3] = g + 0.04; S.col[i * 3 + 1] = g; S.col[i * 3 + 2] = g - 0.03; }
  }
}

// 空にかぶさる噴煙の天井：噴火の強さに応じて濃くなる。低い縁ほど火口の光で赤く染まる
function stepCanopy(S, dt, fx) {
  const lvl = fx.k + (1 - fx.k) * CFG.volcano.idleSmoke * 0.3, T = VOL.t;
  for (let i = 0; i < S.max; i++) {
    S.pos[i * 3] += S.vel[i * 3] * dt; if (Math.abs(S.pos[i * 3]) > 340) S.pos[i * 3] *= -0.95;
    const low = 1 - S.life[i];   // 0=高い 1=低い
    S.size[i] = S.s0[i]; S.alpha[i] = S.a0[i] * lvl * (0.8 + 0.2 * Math.sin(T * 0.7 + S.seed[i]));
    S.col[i * 3] = 0.1 + 0.4 * low * fx.k; S.col[i * 3 + 1] = 0.07 + 0.1 * low * fx.k; S.col[i * 3 + 2] = 0.07;
  }
}

function redrawSky(k) {
  const c = VOL.skyCanvas, g = c.getContext('2d'), grd = g.createLinearGradient(0, 0, 0, c.height), st = [0, 0.45, 0.8, 1];
  for (let j = 0; j < 4; j++) grd.addColorStop(st[j], '#' + VOL.tmp.copy(VOL.skyA[j]).lerp(VOL.skyB[j], k).getHexString());
  g.fillStyle = grd; g.fillRect(0, 0, c.width, c.height); VOL.skyTex.needsUpdate = true;
}

function updateVolcano(P, dt, fx) {
  const V = CFG.volcano;
  VOL.t += dt;
  VOL.scaleU.value = WORLD.renderer.domElement.height / 2;
  VOL.group.position.z = P.z;
  const back = P.dist * V.recede;   // 少しずつ遠ざかる（山・煙・火の発生元が一緒に動く）
  VOL.vg.position.z = VOL.smoke.pts.position.z = VOL.fire.pts.position.z = back;
  stepSmoke(VOL.smoke, dt, fx); stepFire(VOL.fire, dt, fx);
  stepRain(VOL.ash, dt, fx, false, P); stepRain(VOL.ember, dt, fx, true, P);
  VOL.ash.pts.position.x = VOL.ember.pts.position.x = P.x * 0.5;
  stepCanopy(VOL.canopy, dt, fx); VOL.canopy.pts.position.x = P.x * 0.8;
  [VOL.smoke, VOL.fire, VOL.ash, VOL.ember, VOL.canopy].forEach(pflush);
  // 空・霧・光の遷移
  if (Math.abs(fx.k - VOL.skyK) > 0.01) {
    VOL.skyK = fx.k; redrawSky(fx.k);
    WORLD.scene.fog.color.copy(VOL.fogA).lerp(VOL.fogB, fx.k);
    if (VOL.hemi) VOL.hemi.color.copy(VOL.hemiA).lerp(VOL.hemiB, fx.k);
  }
}

// 再スタート用：噴火前の状態へ（煙・火の粒を消し、空と霧を元の色に戻す）
function resetVolcano() {
  VOL.t = 0; VOL.skyK = -1;
  [VOL.smoke, VOL.fire].forEach(S => { S.age.fill(1e9); S.alpha.fill(0); S.budget = 0; });
}
// ===== マグマの見た目：溶岩の壁・波頭・火の粉・蒸気・照り返し・熱ゆらぎ・HUD（three.js / DOM） =====
// 状態（先端の位置）は 27-magma-logic.js の M が持つ。先端は z = -M.front で、そこから後方（+z）へ溶岩面が広がる
const MAG = { t: 0, hudGap: -1, hudN: -1, overlayOn: false };

// 溶岩のテクスチャ：橙の地に黒い冷えた殻のまだらと明るいひび。端でつながるように折り返して描く
function makeLavaTexture() {
  const S = 256, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = '#e8620f'; g.fillRect(0, 0, S, S);
  const wrap = (x, y, r, fill) => { g.fillStyle = fill; for (const ox of [-S, 0, S]) for (const oy of [-S, 0, S]) { g.beginPath(); g.arc(x + ox, y + oy, r, 0, 7); g.fill(); } };
  for (let i = 0; i < 70; i++) wrap(Math.random() * S, Math.random() * S, 6 + Math.random() * 20, `rgba(255,${170 + Math.floor(Math.random() * 60)},50,${0.25 + Math.random() * 0.3})`);   // 明るい高温部
  for (let i = 0; i < 46; i++) wrap(Math.random() * S, Math.random() * S, 8 + Math.random() * 22, `rgba(${40 + Math.floor(Math.random() * 30)},12,6,${0.55 + Math.random() * 0.3})`);   // 冷えた黒い殻
  for (let i = 0; i < 90; i++) wrap(Math.random() * S, Math.random() * S, 1 + Math.random() * 3, 'rgba(255,225,110,0.9)');   // ひびの白熱
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}

// 先端からの距離 lz と高さ（波頭の高さ 1 に対する比）。手前が切り立った壁、波頭、すぐ低い溶岩面へ
const MAG_PROFILE = [[0, 0.03], [0.4, 0.3], [1.0, 0.68], [1.8, 1.0], [2.6, 0.92], [3.6, 0.7], [5, 0.5], [7, 0.34], [10, 0.25], [14, 0.2], [22, 0.19], [40, 0.19], [80, 0.19], [140, 0.19], [1e9, 0.19]];

function buildMagma() {
  const C = CFG.magma, scene = WORLD.scene, N = 140;
  const rows = MAG_PROFILE.map(p => [Math.min(p[0], C.length), p[1] * C.crestH]).filter((p, i, a) => i === 0 || p[0] > a[i - 1][0]);
  const R = rows.length, pos = new Float32Array((N + 1) * R * 3), idx = [];
  for (let j = 0; j < R; j++) for (let i = 0; i <= N; i++) { const k = (j * (N + 1) + i) * 3; pos[k] = (i / N - 0.5) * C.width; pos[k + 1] = rows[j][1]; pos[k + 2] = rows[j][0]; }
  for (let j = 0; j < R - 1; j++) for (let i = 0; i < N; i++) { const a = j * (N + 1) + i, b = a + 1, c = a + N + 1, d = c + 1; idx.push(a, c, b, b, c, d); }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setIndex(idx);
  MAG.uni = { time: { value: 0 }, map: { value: makeLavaTexture() } };
  const mat = new THREE.ShaderMaterial({
    uniforms: MAG.uni, side: THREE.DoubleSide,
    vertexShader: 'uniform float time;varying vec2 vP;' +
      'void main(){vec3 p=position;float lz=p.z;float w=smoothstep(0.,7.,lz);float crest=exp(-pow(lz-1.8,2.)/3.5);' +
      'p.y+=(sin(p.x*0.33+time*1.7+lz*0.45)*0.22+sin(p.x*0.85-time*2.3)*0.1)*w+crest*sin(p.x*0.5+time*2.6)*0.55;' +
      'p.z+=(0.5+0.5*sin(p.x*0.7+time*1.3))*0.9*(1.-smoothstep(0.,3.,lz));p.y=max(p.y,0.1);' +
      'vP=vec2(position.x,position.z);gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}',
    fragmentShader: 'uniform sampler2D map;uniform float time;varying vec2 vP;' +
      'void main(){vec2 a=vec2(vP.x*0.05+time*0.015,vP.y*0.05-time*0.05),b=vec2(vP.x*0.11-time*0.02,vP.y*0.11-time*0.09);' +
      'vec3 c1=texture2D(map,a).rgb,c2=texture2D(map,b).rgb;vec3 col=c1*c2*1.9+c1*0.4;float lz=vP.y;' +
      'col+=vec3(1.,0.55,0.12)*0.6*exp(-pow(lz-1.6,2.)/5.);col+=vec3(1.,0.8,0.35)*0.5*exp(-lz*0.9);' +
      'col*=0.92+0.08*sin(time*3.+vP.x*0.2);gl_FragColor=vec4(col,1.);}'
  });
  MAG.mesh = new THREE.Mesh(geo, mat); MAG.mesh.frustumCulled = false; scene.add(MAG.mesh);

  const tex = makeSoftTexture();
  MAG.sparks = makeParticles(C.sparkMax, true, tex); MAG.steam = makeParticles(C.steamMax, false, tex);
  MAG.sparks.cursor = 0; MAG.steam.cursor = 0; MAG.sparks.acc = 0; MAG.steam.acc = 0;
  scene.add(MAG.steam.pts, MAG.sparks.pts);
  MAG.light = new THREE.PointLight(0xff6a20, 0, 55); scene.add(MAG.light);   // 恐竜の背中を橙に照らす照り返し

  MAG.$glow = document.getElementById('lavaGlow'); MAG.$heat = document.getElementById('heat'); MAG.$view = document.getElementById('view');
  MAG.$gauge = document.getElementById('magma'); MAG.$dots = [...document.querySelectorAll('#magma .dot')]; MAG.$gap = document.getElementById('magmaGap');
  MAG.$over = document.getElementById('gameover'); MAG.$overDist = document.getElementById('overDist');
  resetMagmaView();
}

// 再スタート用：見た目の状態を初期化（オブジェクトは作り直さない）
function resetMagmaView() {
  MAG.t = 0; MAG.hudGap = -1; MAG.hudN = -1; MAG.overlayOn = false;
  [MAG.sparks, MAG.steam].forEach(S => { S.age.fill(1e9); S.alpha.fill(0); S.cursor = 0; S.acc = 0; pflush(S); });
  MAG.$over.classList.remove('on'); MAG.$glow.style.opacity = 0; MAG.$heat.style.opacity = 0; MAG.$view.style.transform = '';
  MAG.mesh.position.z = 1e5; MAG.light.intensity = 0;
}

function magEmit(S, x, y, z, vx, vy, vz, life, size, alpha) {
  const i = S.cursor = (S.cursor + 1) % S.max;
  S.age[i] = 0; S.life[i] = life; S.s0[i] = size; S.a0[i] = alpha;
  S.pos[i * 3] = x; S.pos[i * 3 + 1] = y; S.pos[i * 3 + 2] = z; S.vel[i * 3] = vx; S.vel[i * 3 + 1] = vy; S.vel[i * 3 + 2] = vz;
}

function stepMagmaFx(S, dt, spark) {
  for (let i = 0; i < S.max; i++) {
    if (S.age[i] >= S.life[i]) { S.alpha[i] = 0; continue; }
    S.age[i] += dt; const f = Math.min(1, S.age[i] / S.life[i]), j = i * 3;
    if (spark) S.vel[j + 1] -= 16 * dt;
    S.pos[j] += S.vel[j] * dt; S.pos[j + 1] += S.vel[j + 1] * dt; S.pos[j + 2] += S.vel[j + 2] * dt;
    if (spark) {
      S.size[i] = S.s0[i] * (1 - 0.6 * f); S.alpha[i] = S.a0[i] * (1 - f) * (1 - f);
      S.col[j] = 1; S.col[j + 1] = 0.75 - 0.5 * f; S.col[j + 2] = 0.25 - 0.2 * f;
    } else {   // 蒸気：もくもく広がる、橙に照らされた灰白色
      S.size[i] = S.s0[i] * (0.6 + f * 1.8); S.alpha[i] = S.a0[i] * Math.min(1, f * 6) * (1 - f);
      S.col[j] = 0.6 - 0.15 * f; S.col[j + 1] = 0.42 - 0.07 * f; S.col[j + 2] = 0.33 - 0.05 * f;
    }
  }
}

function updateMagma(P, M, dt) {
  const C = CFG.magma, gap = magmaGap(M, P), dead = M.phase === 'dead';
  MAG.t += dt; MAG.uni.time.value = MAG.t;
  const zf = -M.front;
  MAG.mesh.position.set(0, 0, zf);
  const prox = dead ? 1 : magmaProx(gap, C.heatRange);

  // 火の粉と蒸気：先端の波頭から、画面に見える範囲（プレイヤーの左右）に出す。遠い間は出さない
  if (gap < 160 || dead) {
    const F = CFG.fx.magma, k = fxInt();   // 近いほど・演出が強いほど増える（intensity 0 なら従来の量）
    MAG.sparks.acc += (45 + (F.spark - 45) * k) * (1 + (0.6 * prox) * k) * dt; MAG.steam.acc += (18 + (F.steam - 18) * k) * (1 + (0.5 * prox) * k) * dt;
    while (MAG.sparks.acc >= 1) { MAG.sparks.acc -= 1; magEmit(MAG.sparks, P.x * 0.9 + rnd(-26, 26), rnd(2, C.crestH), zf + rnd(0.5, 3), rnd(-3, 3), rnd(4, 14), rnd(-7, 3), rnd(0.7, 1.6), rnd(1.2, 2.8), 1); }
    while (MAG.steam.acc >= 1) { MAG.steam.acc -= 1; magEmit(MAG.steam, P.x * 0.9 + rnd(-26, 26), rnd(1, 3), zf + rnd(0, 3), rnd(-1, 1), rnd(2, 5), rnd(-3, 1), rnd(1.6, 2.8), rnd(4, 8), 0.35); }
  }
  stepMagmaFx(MAG.sparks, dt, true); stepMagmaFx(MAG.steam, dt, false); pflush(MAG.sparks); pflush(MAG.steam);
  MAG.light.position.set(P.x, 3, zf + 4); MAG.light.intensity = C.lightMax * prox * prox * (0.9 + 0.1 * Math.sin(MAG.t * 9));

  // 画面の赤み：下端の照り返し（噴火後は常に少し）・全体の赤い縁・熱ゆらぎ
  const glow = Math.min(1, (M.active ? C.glowBase : 0) + 0.95 * prox), pulse = 0.85 + 0.15 * Math.sin(MAG.t * 6);
  MAG.$glow.style.opacity = (glow * pulse).toFixed(3);
  MAG.$heat.style.opacity = (prox * prox * 0.9).toFixed(3);
  const wb = C.wobble * prox * prox;
  MAG.$view.style.transform = wb > 0.05 ? `translate(${(Math.sin(MAG.t * 23) * wb).toFixed(2)}px,${(Math.cos(MAG.t * 31) * wb * 0.7).toFixed(2)}px) scale(${(1 + wb * 0.003).toFixed(4)})` : '';

  // HUD：距離と点灯ゲージ
  const gm = Math.max(0, Math.round(gap)), n = dead ? 5 : magmaDanger(gap);
  if (gm !== MAG.hudGap) { MAG.hudGap = gm; MAG.$gap.textContent = gm + 'm'; }
  if (n !== MAG.hudN) { MAG.hudN = n; MAG.$dots.forEach((d, i) => d.classList.toggle('lit', i < n)); MAG.$gauge.classList.toggle('hot', n >= 4); }
  if (dead && !MAG.overlayOn && M.deadT >= C.overlayDelay) {
    MAG.overlayOn = true; MAG.$overDist.textContent = '逃走距離：' + Math.floor(M.deathDist) + 'm'; MAG.$over.classList.add('on');
  }
}
// ===== 噴石の見た目：落下する燃える岩・危険マーカー・影・爆発・クレーター・画面揺れ（three.js） =====
// 状態（いつ・どこに落ちるか）は 26-rock-logic.js の S.rocks が持つ。ここは毎フレームそれを映すだけ。
const ROCKS = { shake: 0, frame: 0 };

function buildRocks() {
  const R = CFG.rock, scene = WORLD.scene, tex = makeSoftTexture();
  ROCKS.sparks = makeParticles(R.sparkMax, true, tex);
  ROCKS.dust = makeParticles(R.dustMax, false, tex);
  ROCKS.sparks.cursor = 0; ROCKS.dust.cursor = 0;
  scene.add(ROCKS.dust.pts, ROCKS.sparks.pts);

  // 共有ジオメトリ（半径1）。地面に貼るものは XY 平面で作り、親の回転で寝かせる
  const rockGeo = new THREE.DodecahedronGeometry(1, 1), rp = rockGeo.attributes.position;
  for (let i = 0; i < rp.count; i++) { const k = 1 + Math.sin(rp.getX(i) * 7.1 + rp.getY(i) * 3.3 + rp.getZ(i) * 5.7) * 0.13; rp.setXYZ(i, rp.getX(i) * k, rp.getY(i) * k, rp.getZ(i) * k); }
  rockGeo.computeVertexNormals();
  const ringGeo = new THREE.RingGeometry(0.9, 1, 48), discGeo = new THREE.CircleGeometry(1, 40);
  const rockMat = new THREE.MeshLambertMaterial({ color: 0x2a1b17, emissive: 0xff4a10, emissiveIntensity: 0.65, flatShading: true });
  const glowMat = new THREE.SpriteMaterial({ map: tex, color: 0xff7a24, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, fog: false, opacity: 0.85 });
  const flat = (geo, color, additive) => {
    const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }));
    m.rotation.x = -Math.PI / 2; m.visible = false; scene.add(m); return m;
  };
  ROCKS.flat = flat;

  ROCKS.slots = [];
  for (let i = 0; i < R.maxActive; i++) {
    const body = new THREE.Group(), mesh = new THREE.Mesh(rockGeo, rockMat), glow = new THREE.Sprite(glowMat);
    body.add(mesh, glow); body.visible = false; scene.add(body);
    ROCKS.slots.push({ id: 0, seen: 0, body, mesh, glow, acc: 0, acc2: 0,
      shadow: flat(discGeo, 0x000000), disc: flat(discGeo, 0xff1a0a), ring: flat(ringGeo, 0xff3a1a) });
  }
  ROCKS.byId = new Map();

  ROCKS.rings = []; for (let i = 0; i < R.ringMax; i++) ROCKS.rings.push({ t: 99, life: 0.5, R: 1, mesh: flat(ringGeo, 0xffc080, true) });
  ROCKS.craters = []; for (let i = 0; i < R.craterMax; i++) ROCKS.craters.push({ t: 99, R: 1, dark: flat(discGeo, 0x120a08), glow: flat(discGeo, 0xff5a14, true) });
  ROCKS.ringI = 0; ROCKS.craterI = 0;
}

// 粒を1つ出す（古いものから上書きするリングバッファ）。kind：火の粉＝無視 / 土煙＝0 茶 1 黒
function fxEmit(S, x, y, z, vx, vy, vz, life, size, alpha, kind) {
  const i = S.cursor = (S.cursor + 1) % S.max;
  S.age[i] = 0; S.life[i] = life; S.s0[i] = size; S.a0[i] = alpha; S.seed[i] = kind || 0;
  S.pos[i * 3] = x; S.pos[i * 3 + 1] = y; S.pos[i * 3 + 2] = z; S.vel[i * 3] = vx; S.vel[i * 3 + 1] = vy; S.vel[i * 3 + 2] = vz;
}

function fxStep(S, dt, spark) {
  const drag = Math.exp(-1.8 * dt);
  for (let i = 0; i < S.max; i++) {
    if (S.age[i] >= S.life[i]) { S.alpha[i] = 0; continue; }
    S.age[i] += dt; const f = Math.min(1, S.age[i] / S.life[i]), j = i * 3;
    if (spark) {
      S.vel[j + 1] -= 22 * dt;
      S.pos[j] += S.vel[j] * dt; S.pos[j + 1] += S.vel[j + 1] * dt; S.pos[j + 2] += S.vel[j + 2] * dt;
      if (S.pos[j + 1] < 0.05) { S.pos[j + 1] = 0.05; S.vel[j + 1] *= -0.3; S.vel[j] *= 0.6; S.vel[j + 2] *= 0.6; }
      S.size[i] = S.s0[i] * (1 - 0.6 * f); S.alpha[i] = S.a0[i] * (1 - f) * (1 - f);
      S.col[j] = 1; S.col[j + 1] = 0.8 - 0.55 * f; S.col[j + 2] = 0.3 - 0.25 * f;
    } else if (S.seed[i] > 1.5) {   // 破片（kind 2）：重力で落ちて跳ね、赤熱から黒く冷める
      S.vel[j + 1] -= 24 * dt;
      S.pos[j] += S.vel[j] * dt; S.pos[j + 1] += S.vel[j + 1] * dt; S.pos[j + 2] += S.vel[j + 2] * dt;
      if (S.pos[j + 1] < 0.1) { S.pos[j + 1] = 0.1; S.vel[j + 1] *= -0.35; S.vel[j] *= 0.6; S.vel[j + 2] *= 0.6; }
      S.size[i] = S.s0[i]; S.alpha[i] = S.a0[i] * (1 - f * f * f);
      S.col[j] = 0.6 - 0.42 * f; S.col[j + 1] = 0.26 - 0.15 * f; S.col[j + 2] = 0.1 - 0.02 * f;
    } else {
      S.vel[j] *= drag; S.vel[j + 1] = S.vel[j + 1] * drag + 1.5 * dt; S.vel[j + 2] *= drag;
      S.pos[j] += S.vel[j] * dt; S.pos[j + 1] += S.vel[j + 1] * dt; S.pos[j + 2] += S.vel[j + 2] * dt;
      S.size[i] = S.s0[i] * (0.5 + f * 1.6); S.alpha[i] = S.a0[i] * Math.min(1, f * 10) * (1 - f);
      const dark = S.seed[i] > 0.5; S.col[j] = dark ? 0.13 : 0.36; S.col[j + 1] = dark ? 0.11 : 0.28; S.col[j + 2] = dark ? 0.1 : 0.22;
    }
  }
}

function rockSlotFor(r) {
  let sl = ROCKS.byId.get(r.id);
  if (sl) return sl;
  sl = ROCKS.slots.find(s => !s.id); if (!sl) return null;
  sl.id = r.id; ROCKS.byId.set(r.id, sl);
  const v = r.vis; sl.body.scale.setScalar(v); sl.glow.scale.setScalar(4.2);
  sl.mesh.rotation.set(Math.random() * 6, Math.random() * 6, Math.random() * 6); sl.spin = [rnd(-4, 4), rnd(-4, 4), rnd(-3, 3)];
  sl.body.visible = true; sl.shadow.visible = sl.disc.visible = sl.ring.visible = true;
  sndRockFall(r.warn - r.t, r.size);
  fxMarkerAppear(r);
  return sl;
}

function rockRelease(sl) {
  ROCKS.byId.delete(sl.id); sl.id = 0;
  sl.body.visible = sl.shadow.visible = sl.disc.visible = sl.ring.visible = false;
}

// 飛行中の噴石・危険マーカー・影を映す。毎フレーム呼ぶ
function syncRocks(S, dt) {
  ROCKS.frame++; const T = VOL.t;
  for (const r of S.rocks) {
    const sl = rockSlotFor(r); if (!sl) continue;
    sl.seen = ROCKS.frame;
    const p = rockPos(r), u = p.u, big = r.size === 'large', rad = r.radius;
    sl.body.position.set(p.x, p.y + r.vis * 0.9, p.z);
    sl.mesh.rotation.x += sl.spin[0] * dt; sl.mesh.rotation.y += sl.spin[1] * dt; sl.mesh.rotation.z += sl.spin[2] * dt;
    // 危険マーカー：内側の赤い円が時間とともに濃くなり、脈動も速くなる
    const pulse = 0.5 + 0.5 * Math.sin(T * (9 + 16 * u));
    sl.ring.position.set(r.x, 0.07, r.z); sl.ring.scale.set(rad * (1 + 0.025 * pulse), rad * (1 + 0.025 * pulse), 1); sl.ring.material.opacity = 0.65 + 0.35 * pulse;
    sl.disc.position.set(r.x, 0.06, r.z); sl.disc.scale.set(rad, rad, 1); sl.disc.material.opacity = 0.1 + 0.3 * u + 0.1 * pulse * u;
    // 影：高い所では小さく薄く、落ちてくるほど広がって濃くなる（大型は着弾範囲いっぱいに覆いかぶさる）
    const sMax = big ? rad * 1.15 : r.vis * 2.2, sg = 0.2 + 0.8 * u;
    sl.shadow.position.set(r.x, 0.05, r.z); sl.shadow.scale.set(sMax * sg, sMax * sg, 1); sl.shadow.material.opacity = (big ? 0.2 + 0.4 * u : 0.1 + 0.25 * u);
    // 尾を引く火の粉と煙
    const TL = CFG.fx.tail, fi = fxInt(), tl = 1 + (TL.spark - 1) * fi, ts = 1 + (TL.smoke - 1) * fi;
    sl.acc += dt * (70 + 30 * r.vis) * tl; sl.acc2 += dt * 28 * ts;
    const px = p.x, py = p.y + r.vis * 0.9, pz = p.z, spread = 2 + r.vis * 2;
    while (sl.acc >= 1) { sl.acc -= 1; fxEmit(ROCKS.sparks, px + rnd(-1, 1) * r.vis * 0.6, py + rnd(-1, 1) * r.vis * 0.6, pz + rnd(-1, 1) * r.vis * 0.6, rnd(-spread, spread) + r.ox * 0.25, rnd(2, 8), rnd(-spread, spread) + r.oz * 0.25, rnd(0.35, 0.7) * (1 + 0.35 * fi * u), rnd(0.9, 1.7) * (0.6 + r.vis * 0.5), 1, 0); }
    while (sl.acc2 >= 1) { sl.acc2 -= 1; fxEmit(ROCKS.dust, px, py, pz, rnd(-1.5, 1.5), rnd(0, 3), rnd(-1.5, 1.5), rnd(0.8, 1.3), (2 + r.vis * 2.2), 0.55, 1); }
  }
  for (const sl of ROCKS.slots) if (sl.id && sl.seen !== ROCKS.frame) rockRelease(sl);
}

// 着弾：爆発（火花・土煙・衝撃波）・クレーター跡・画面揺れ・音
function rockImpact(r, hit) {
  const R = CFG.rock, C = R.sizes[r.size], v = r.vis;
  const nS = Math.round(24 + v * 16), nD = Math.round(14 + v * 10);
  for (let i = 0; i < nS; i++) {
    const a = rnd(0, 6.283), up = rnd(0.35, 1), sp = rnd(6, 18) * (0.6 + v * 0.3);
    fxEmit(ROCKS.sparks, r.x, 0.3, r.z, Math.cos(a) * sp * (1 - up * 0.4), up * sp * 1.1, Math.sin(a) * sp * (1 - up * 0.4), rnd(0.6, 1.2), rnd(1.4, 3) * (0.6 + v * 0.4), 1, 0);
  }
  for (let i = 0; i < nD; i++) {
    const a = rnd(0, 6.283), sp = rnd(4, 10) * (0.7 + v * 0.2);
    fxEmit(ROCKS.dust, r.x + Math.cos(a) * v, 0.4, r.z + Math.sin(a) * v, Math.cos(a) * sp, rnd(0.5, 3.5), Math.sin(a) * sp, rnd(1.1, 2), (2.5 + v * 2.2) * rnd(0.8, 1.3), 0.7, i % 3 === 0 ? 1 : 0);

  const cr = ROCKS.craters[ROCKS.craterI]; ROCKS.craterI = (ROCKS.craterI + 1) % ROCKS.craters.length;

// 大型・中型の着弾を派手に：火球（大きく明るい光の粒）＋黒煙の柱（高く昇る）＋飛び散る赤熱の破片。粒数は CFG.fx.blast、全体は intensity で増減

  const B = CFG.fx.blast, k = fxInt(), large = r.size === 'large', mid = r.size === 'mid', v = r.vis;
  const nFire = Math.round((large ? B.fireLarge : mid ? B.fireMid : 0) * k), nSmoke = Math.round((large ? B.smokeLarge : mid ? B.smokeMid : 0) * k), nDeb = Math.round((large ? B.debrisLarge : mid ? B.debrisMid : B.debrisSmall) * k);
  for (let i = 0; i < nFire; i++) {   // 火球：地面付近で大きく膨らんですぐ消える
    const a = rnd(0, 6.283), sp = rnd(1, 5) * (large ? 1.4 : 1);
    fxEmit(ROCKS.sparks, r.x + Math.cos(a) * v * 0.5, rnd(0.6, 2.2), r.z + Math.sin(a) * v * 0.5, Math.cos(a) * sp, rnd(2, 7), Math.sin(a) * sp, rnd(0.3, 0.55), large ? rnd(6, 10) : rnd(3.5, 5.5), 1, 0);
  }
