<h1>DINO ESCAPE — 検証</h1>

<script>
"use strict";
// ===== 調整値（ここに集約） =====
const CFG = {
  run: { baseSpeed: 16, accel: 0.04, maxSpeed: 34 },                  // 前進：基準速度 / 経過秒あたりの加速（u/s²）/ 上限（単位 u = 1m）
  lane: { count: 3, width: 4.5, shiftSec: 0.13, bufferSec: 0.15, bufferMax: 2 },   // 3 レーン制：レーン数 / レーン幅(u) / 隣のレーンへ移る秒 / 移動中に来た入力を覚えておく秒と個数（左右キーは押すたび 1 レーン。押しっぱなしでは動かない）
  move: { maxX: 6.75 },                                               // 吹き飛び中に出られる左右限界（= lane.width × 1.5。端のレーン中心 ±4.5 の外側に少し余白）
  slide: { sec: 0.7, cooldown: 0.2, buffer: 0.15, dive: 24, standH: 2.9, slideH: 1.0 },   // くぐる（S / ↓）：滑走の秒 / 終わってから次を出せるまで / 押すのが早すぎたとき覚えておく秒 / 空中で押したときの急降下の速さ / 当たり判定の高さ（立ち / 滑走中）
  jump: { velocity: 11.5, gravity: 32 },                              // ジャンプ初速 / 重力
  cam: { back: 11, height: 6.2, lookAhead: 14, lookY: 1.2, follow: 5, followXSpeed: 3.2, followX: 0.6, lookFollowX: 0.7, fov: 60, fovSpeed: 0.35, fovMax: 78, jumpLift: 0.35 },   // 後方距離 / 高さ / 先を見る距離 / 注視点の高さ / 追従の速さ / 横追従率 / 画角と速度による広がり
  world: { groundSize: 600, texRepeat: 40, fogColor: 0x5a2f26, fogNear: 50, fogFar: 260, clearHalf: 11,
           rocks: 46, hills: 14, spawnAhead: 220, spawnBehind: 30, spread: 110 },   // 地面の大きさ / テクスチャ繰り返し / フォグ / 装飾を置かない中央の半幅（遊べる範囲の外側）/ 装飾の数 / 先に出す距離・消す距離 / 左右の散らばり幅
  dino: { runFreq: 0.55, legSwing: 0.95, tailSwing: 0.35, bob: 0.09, tuck: 1.0, lean: 0.008, leanMax: 0.35 },   // 脚ふりの速さ（距離あたり）/ 脚の振れ幅 / 尻尾の揺れ / 上下の弾み / ジャンプ時の足たたみ / 横移動の傾き（横速度あたり）と上限
  volcano: { eruptDelay: 4, rampTime: 6, idleSmoke: 0.25, dist: 300, recede: 0.04, radius: 120, height: 130, craterR: 18,   // 大噴火までの秒 / 噴火が最大強度になるまでの秒 / 噴火前の煙の量 / 後方の距離 / 遠ざかる率 / 山の大きさ
             boomDur: 2.2, shakeAmp: 0.32, shakeDur: 1.6, flashDur: 0.9, flashMax: 0.6,                                    // 「ドゴォォォン」表示秒 / 画面揺れの大きさ・秒 / 閃光の秒・最大濃さ
             smokeMax: 450, fireMax: 380, ashMax: 650, emberMax: 200, canopyMax: 170,                                                    // パーティクル上限（煙 / 火花 / 火山灰 / 降る火の粉）
             windSpeed: 70, smokeLife: 9, ashBox: { x: 45, y: 32, z: 80 },                                                // 煙が手前へ流れる速さ / 煙の寿命 / 灰が降る範囲
             sky: { top: '#0a0203', mid: '#3a0a08', low: '#7a1c0e', bottom: '#a8300f' }, fogColor: 0x3a0e0a },             // 噴火後の空と霧の色
  rock: { interval: 2.0, jitter: 0.35, firstDelay: 1.5, maxActive: 12,                                                      // 噴石：（interval と weights は難易度を使わない時の固定値。実際は difficulty.rock が決める）出現間隔 / ばらつき / 噴火してから最初の1個までの秒 / 同時に存在できる数の上限（描画の枠数）
          weights: { small: 0.58, mid: 0.37, large: 0.05 },                                                                 // 出現の重み（固定値の時のみ）
          aimChance: 0.5, aimJitterZ: 3, aheadExtra: 30, backDist: 22, sideOff: 6,   // 恐竜のいるレーンを狙う確率 / 前後の誤差 / 狙わない時の前方の余裕 / 落下の出発点（後方・横）。落下地点の x はレーン中心（小）・レーン中心かレーンの間（中）・端のレーン中心かレーンの間（大）に吸着
          sizes: {   // radius=着弾の当たり半径（危険マーカー。小=1 レーン / 中=1〜2 レーン / 大=2 レーン、中央のレーン中心では 3 レーンになるので置かない）/ vis=見た目の岩の半径 / warn=警告から着弾までの秒 / fallH=出発の高さ / power=吹き飛びの強さ / shake=画面揺れ / slowSec・slowF=直撃後の減速の秒と倍率
            small: { radius: 2.2, vis: 0.75, warn: 0.9, fallH: 12, power: 0.55, shake: 0,    slowSec: 0.8, slowF: 0.85 },
            mid:   { radius: 3.4, vis: 1.3,  warn: 1.2, fallH: 15, power: 1.0,  shake: 0.2,  slowSec: 1.2, slowF: 0.75 },
            large: { radius: 4.8, vis: 2.8,  warn: 1.6, fallH: 19, power: 1.8,  shake: 0.55, slowSec: 1.7, slowF: 0.65 } },
          fair: { react: 0.3, margin: 0.1, moveExtra: 0.05, tries: 6, retry: 0.2 },   // 公平性（避けようがない噴石を出さない）：人間の反応時間 / 円の外に出る余裕 / レーン移動 1 回ごとに足す余裕の秒 / 場所の選び直し回数 / だめなら待つ秒
          sparkMax: 850, dustMax: 640, craterMax: 10, craterLife: 4.5, ringMax: 8, shakeDecay: 6 },                          // 火の粉・土煙の粒数 / クレーター跡の数と残る秒 / 衝撃波リング数 / 揺れの収まる速さ
  hit: { dinoR: 0.9, maxY: 1.5,                                                                                             // 恐竜の当たり半径 / これより高く跳んでいれば爆風の上を越える
         knockBase: 0.4, knockPer: 0.3, kickSide: 7, kickUp: 10.5, kickFwd: 12, spin: 9,                                       // 吹き飛び：秒（基本＋強さ×）/ 横・上・前方への初速（×強さ）/ 回転（rad/s）
         bounce: 0.42, bounceMin: 2.5, friction: 2.2, knockMul: 0.15,                                                        // バウンドの反発 / 止まる最小の落下速度 / 地面での減速 / 吹き飛び中の前進倍率
         recoverSec: 0.4, recoverMul: 0.5, slowRamp: 0.7,                                                              // 起き上がりの秒と前進倍率 / 減速から戻るまでにかける秒（減速の秒と倍率は rock.sizes の slowSec / slowF）
         invulnSec: 1.8, screamSec: 1.2 },                                                                                   // 復帰後の無敵（点滅）秒 / 「ギャーー」表示秒
  magma: { startGap: 60, speed0: 15.5, speedMax: 23.5, rubberMin: 0.7, rubberRange: 50,                                                                          // 噴火時の先端との距離(u) / 噴火直後の速さ / 最終局面の速さ（途中の速さは難易度の強度 s で補間。プレイヤーは 16→約 21 付近でクリア）
           deathOvershoot: 6, deathSec: 1.5, deathSink: 3.2, overlayDelay: 1.6,                                              // 死亡時に先端がプレイヤーを越えて止まる距離 / 沈む秒 / 沈む深さ / GAME OVER 表示までの秒
           width: 560, length: 260, crestH: 4.3,                                                                              // 溶岩の幅（左右の外まで）/ 奥行き / 波頭の高さ（3.8→4.3：先端のチラ見えを 6〜7m 付近から。Phase 6）
           heatRange: 55, glowBase: 0.1, wobble: 3, shakeRange: 26, shakeAmp: 0.16, audibleRange: 140,                        // 熱ゆらぎ・赤みが出始める距離 / 噴火後の下端の照り返し最小値 / 熱ゆらぎ(px) / 揺れが出る距離・大きさ / 音が聞こえ始める距離
           view: { far: 15, near: 4, min: 0.22, ease: 7 },                                                                    // 先端が近いとき恐竜が溶岩に隠れないよう、溶岩の高さを低くする：低くし始める距離 / 最も低くなる距離 / そのときの高さの倍率 / 死亡で元の高さへ戻る速さ
           dangerGaps: [110, 75, 50, 28, 14],                                                                                 // HUD ゲージの点灯しきい値（この距離より近いと点が1つずつ点く）
           sparkMax: 360, steamMax: 200, lightMax: 2.4 },                                                                    // 火の粉・蒸気の粒数 / 照り返し光の強さ
  obstacle: { seed: 1234, startDist: 50, slotStep: 20, minGapZ: 14, logClearZ: 30, aheadDist: 150, behindDist: 12, chunk: 40,   // 乱数の種 / 最初の障害物までの距離(u) / 配置の枠の間隔 / 前後の障害物の最低間隔（枠内のばらつきは slotStep-minGapZ）/ 倒木の前後に他を置かない距離 / 先に出す距離・消す距離 / まとめて作る長さ
              density: { start: 0.45, end: 0.9 },                                                                           // 枠が埋まる確率：難易度の強度 s（0〜1）で 序盤→終盤の値へ（その距離を「ふつうに走ったときの噴火後の秒」に直して使う）
              unlock: { rock: 0, crater: 70, log: 110, pool: 200, arch: 40 },                                               // 各障害物が出始める走行距離（startDist からの増分。arch=40 は距離 90 から）
              weights: { rock: 0.30, log: 0.22, crater: 0.18, pool: 0.12, arch: 0.18 },                                     // 出現の重み
              rock: { rMin: 1.0, rMax: 1.5, hMin: 1.0, hMax: 1.4, shrink: 0.85 },                                           // 岩（1 レーン・レーン中心）：半径 / 高さ（ジャンプ頂点は約2.07）/ 当たりの縮小率
              log: { r: 0.6, h: 1.2, trim: 0.5, oneLane: 0.35 },                                                            // 倒木（1〜2 レーン分の長さ）：幹の半径 / 高さ / レーン幅の合計から削る長さ / 1 レーン分の短い倒木になる割合（残りは 2 レーン分）
              crater: { rMin: 1.5, rMax: 2.5, clearY: 0.5 },                                                                // クレーター（1 レーン）：半径 / これより高く跳んでいれば越える
              pool: { rMin: 2.0, rMax: 3.3, clearY: 1.4 },                                                                  // マグマ溜まり（1 レーン。半径 +恐竜半径が隣のレーン中心に届かない）：半径 / これより高く跳んでいれば上を越える（実質は隣のレーンへ避ける）
              arch: { clear: 1.7, beamH: 1.0, hd: 0.9, inset: 0.2, oneLane: 0.5, gapZ: 20 },                                // 頭上の障害物（くぐる）：下をくぐれる高さ / 梁の厚み / 前後の半分の長さ / レーン端からの引っ込み / 1 レーン幅になる割合（残りは 2 レーン）/ 他の障害物との最低間隔（基準速度。速いほど広がる）。梁の下端 clear > slideH なので立ったままだと頭が当たり、梁の上端 clear+beamH > ジャンプ頂点なのでジャンプでは越えられない
              dinoR: 0.6, depthPad: 0.7, footMargin: 0.2,                                                                                 // 障害物に対する恐竜の当たり半径 / 前後方向の余裕 / 岩・倒木は足がこの分だけ上に出ていれば越えたことにする（甘め）
              trip: { knock: 0.6, up: 6.5, fwd: 7, spin: 7, slowSec: 2.2, slowFactor: 0.6, shake: 0.14 },                   // 岩・倒木で転倒：転がる秒 / 跳ね上がり / 前へ転がる初速 / 回転 / 減速の秒と倍率 / 画面揺れ
              poolTrip: { knock: 0.8, up: 8, fwd: 5, spin: 8, slowSec: 3.0, slowFactor: 0.42, shake: 0.2 },                 // マグマ溜まりに触れた：転倒＋強めの減速
              stumble: { slowSec: 1.0, slowFactor: 0.7, tiltSec: 0.5 },                                                     // クレーター：つまずき（転倒しない・軽い減速）
              oopsSec: 0.9 },                                                                                               // 「うわっ！」表示秒
  // 難易度（Phase 6）。時間の基準は「噴火が始まってからの秒 e」（ゲーム開始から eruptDelay=4 秒後が e=0）。強度 s は 0〜1
  difficulty: {
    knots: [[0, 0], [20, 0.2], [40, 0.5], [60, 0.85], [78, 1]],     // [e 秒, 強度 s]：折れ線でつなぐ（境目で急に変わらない）。60 秒以降は最大へ向かい 78 秒で 1
    stageFrom: [0, 20, 40, 60], labels: ['LOW', 'MID', 'HIGH', 'MAX'],   // チュートリアル / 通常 / 危険ゾーン / 最終逃走 の開始秒と、HUD の危険度の表記
    rock: { interval0: 3.0, interval1: 0.5, curve: 1.0,               // 噴石の落下間隔（秒）：s=0 で 3.0 → s=1 で 0.5（ばらつき ±jitter は別）
            aim0: 0.3, aim1: 0.5,                                    // 恐竜を狙う噴石の割合（rock.aimChance の代わり）：序盤 0.3 → 終盤 0.5（レーン制では「恐竜のいるレーンを覆う」噴石）
            active0: 3, active1: 12,                                  // 同時に落ちている数の上限：3 → 12（描画の枠 rock.maxActive が頭打ち）
            largeFrom: 0.5,                                           // 大型噴石は強度がこの値（= 40 秒時点）を超えるまで出ない。そこから最終までに weights1.large へ増える
            weights0: { small: 0.7, mid: 0.3, large: 0 }, weights1: { small: 0.5, mid: 0.5, large: 0.3 } },   // 序盤 / 終盤の重み（大型を除いた小:中の比と、終盤の大型の割合）
    magmaCurve: 1.5,                                                  // マグマの速さ = speed0 → speedMax を s^magmaCurve で補間
    eruptMul: 0.8,                                                    // 噴火の迫力（煙・火の量）の倍率：s=0 で 0.8 → s=1 で 1.0
    shake: { from: 52, over: 10, amp: 0.07 }                          // 画面全体の常時の小刻みな揺れ：e=52 秒から 10 秒かけて amp（位置のみ・控えめ）まで
  },
  // クリア（安全地帯）。プレイヤーの速さは 16 + 0.04t（t は開始からの秒）なので、距離 = 16t + 0.02t²。
  // distance=2200 → 約 119.5 秒（被弾なし）。被弾の減速（1 回で約 1.5〜2 秒ぶんの遅れ）を数回受けても 2 分台前半、1〜3 分に収まる
  goal: { distance: 2200 },
  // スコア（Phase 8）：基本＝走った距離(m)。ボーナスは 噴石のギリギリ回避 / 大型噴石の回避 / 障害物の連続回避 / マグマが近いまま走り続ける
  score: {
    bestKey: 'dino-escape-best',                                      // localStorage のキー
    near: { lo: 1.0, hi: 1.8 },                                      // 着弾点からの距離が（着弾半径＋恐竜半径）のこの倍率の範囲なら「ギリギリ回避」（ジャンプで爆風の上を越えたときは lo 未満でも可）
    rock: 100, rockLarge: 300,                                       // ギリギリ回避のボーナス（大型は 300）。1 つの噴石につき 1 回だけ（大型の警告円から逃げ切ったときも同じ額）
    comboFrom: 3, comboMul: 50, comboCap: 10, comboLateral: 3.0,     // 障害物の連続回避：3 連続以上で 50×連続数（連続数は cap まで）/ 「回避した」と数える左右の近さ（障害物の幅＋恐竜半径にこの余裕）
    magmaGap: 20, magmaPerSec: 40,                                   // マグマとの距離がこれ以内の状態で走り続けると、1 秒ごとにボーナス
    popSec: 1.1, greatSec: 0.9                                       // 「+100」が浮かぶ秒 / GREAT ESCAPE! の表示秒
  },
  // クリア演出（Phase 8）：段階 runin → breathe → lookback → eruption → relief → result。秒数はここ
  clear: {
    stopDist: 26, runIn: 2.8,                                        // 安全地帯へ走り込む距離(u) と その秒（自動で減速して止まる）
    breathe: 2.0, lookBack: 2.2, lookTurn: 1.5,                      // 息を切らす秒 / 振り返りの段階の秒（そのうち回る秒。残りは火山を見つめる間）
    eruption: 3.4, relief: 3.8, reliefText: 1.1,                     // 大爆発の秒 / ホッとする段階の秒 / 「……危なかった」が出るまでの秒
    skipFrom: 3.0,                                                   // Space で結果画面へ飛ばせるようになる秒（クリアから。連打のジャンプで誤って飛ばさない）
    safeZone: 12,                                                    // ゴールの手前この距離から先には障害物を置かない
    cave: { mouth: 12, length: 48, halfW: 17, height: 30, mass: 34 }, // 洞窟：入口の位置(ゴールから) / 奥行き / 中の半幅 / 高さ / 左右の岩山の厚み
    vol: { safe: 0.25, boom: 1.5, after: 0.4 },                       // 火山の音量の倍率：安全地帯の中 / 大爆発 / そのあと
    flash: { sec: 1.4, max: 1 }, shake: { amp: 0.7, sec: 1.8, rumble: 0.14 }, mega: { burst: 220, smokeMul: 0.8, fireMul: 2.5 },   // 巨大な閃光 / 画面揺れ / 噴煙の増やし方
    lavaSink: 9, lavaSinkSec: 3                                      // クリア後、マグマが引いて沈む（深さと秒）
  },
  // カメラの回り込み（タイトル画面の斜め前からの眺め / クリアの振り返り）。a=0 が通常の後ろ追従、π が真正面（火山側を向く）
  orbit: { R: 14, h: 4.6, lookY: 3.0, lookAhead: 24, tilt: 5 },
  title: { az: 2.85, drift: 0.12, blend: 1.0 },                      // タイトルの視点の角度 / ゆっくり揺れる幅 / 開始時に通常カメラへ戻る秒
  // 演出（Phase 7）。intensity=0〜1 で演出全体の強さを一括で弱められる（0 でシェイク・ヒットストップ・フラッシュ・追加の粒子が無くなる）。ゲームの難易度・物理は一切変えない
  fx: {
    intensity: 1,
    shake: { cap: 0.7, hitAmp: 0.5, bigAmp: 0.7 },                     // 揺れ（位置のみ）の合計上限 / 噴石の直撃時の揺れ / 大型着弾時の揺れ（複数の揺れは二乗和の平方根で合成してから上限）
    hitstop: { rock: 0.065, big: 0.08, trip: 0.04, max: 0.1 },         // ヒットストップの秒（直撃 / 大型の直撃 / 障害物で転倒 / 上限）。ゲーム時間だけが止まり、描画・演出は続く
    vignette: { sec: 0.55, alpha: 0.85 },                              // 被弾時の赤い縁（フラッシュ）の秒 / 濃さ
    duck: { big: 0.5, hit: 0.3, boom: 0.55, hold: 0.12, release: 0.55 },   // 大きな音のときに他の音を一瞬下げる深さ（0〜1）/ 下げたままの秒 / 戻る秒
    blast: { fireLarge: 7, fireMid: 3, smokeLarge: 16, smokeMid: 5, debrisLarge: 18, debrisMid: 7, debrisSmall: 3 },   // 噴石着弾：火球 / 黒煙の柱 / 飛び散る破片 の粒数
    tail: { spark: 1.6, smoke: 1.35 },                                 // 落下中の噴石の尾（火の粉・煙）の量の倍率
    runDust: { perUnit: 0.32, size: 1.3 },                             // 走りの土煙：距離 1u あたりの粒数（速度連動）/ 大きさ
    landDust: 12,                                                      // ジャンプ着地の砂煙の粒数（強く着地するほど増える）
    magma: { spark: 70, steam: 26 },                                   // マグマ先端の火の粉・蒸気の毎秒の量（近いほど増える）
    fear: { range: 11 },                                               // 噴石の危険マーカーがこの距離(u)以内に近づくと恐竜が焦る
    panic: { range: 34 },                                              // マグマとの距離(u)がこれ以内だと必死な走り（脚が速い・口を開ける）
    squash: { land: 0.3, crouch: 0.16 },                               // 着地のつぶれの最大 / 離陸前の溜めの深さ
    beep: { range: 10, gap: 0.14 },                                    // 危険マーカーが近くに出たとき「ピッ」と鳴る距離 / 連続で鳴らさない間隔(秒)
    edge: { base: 0.08, perS: 0.27 },                                   // 噴火中の画面端の赤い縁：基本の濃さ / 難易度の強度 s ごとの上乗せ
    hintSec: 7                                                         // 操作ヒントを出しておく秒（その後フェードアウト）
  },
  sound: { vol: { fall: 0.8, impact: 1.0, scream: 0.8, step: 0.55, jump: 0.6, slide: 0.7, land: 0.7, stinger: 0.7, beep: 0.4, hit: 1.0 }, master: 0.5, rumbleIdle: 0.35, rumbleErupt: 0.85, magmaRumble: 1.0, magmaSizzle: 0.3 },                           // 全体音量 / 待機中・噴火中のゴゴゴ音量 / マグマの低音・ジュワジュワの最大音量
  dt: { max: 0.05 }                                                   // 1 フレームの最大秒（タブ復帰時の飛び防止）
};
// ===== 純ロジック（three.js 非依存。verify.html でテスト） =====
function speedAt(t) { return Math.min(CFG.run.maxSpeed, CFG.run.baseSpeed + CFG.run.accel * t); }

// ---- レーン（3 本）：index 0 = 左 / 1 = 中 / 2 = 右 ----
function laneX(i) { const L = CFG.lane; return (i - (L.count - 1) / 2) * L.width; }
function laneNearest(x) { const L = CFG.lane; return Math.max(0, Math.min(L.count - 1, Math.round(x / L.width + (L.count - 1) / 2))); }

// state: run（操作可）/ knocked（吹き飛び中・操作不能）/ recover（起き上がり中・操作不能）
// lane = 目標のレーン（移動中は行き先）/ laneMove = 移動中か / laneFrom・laneT = 移動の出発 x と経過秒 / laneBuf = 移動中に来た入力 [{ dir, t }]
// sliding = 滑走中 / slideT = 滑走の残り秒 / slideCd = 次を出せるまでの秒 / slideBuf = 早押しの覚え秒 / dive = 空中で急降下中
function newPlayer() {
  return { x: 0, y: 0, z: 0, vx: 0, vy: 0, grounded: true, speed: CFG.run.baseSpeed, time: 0, dist: 0,
           lane: (CFG.lane.count - 1) >> 1, laneMove: false, laneFrom: 0, laneT: 0, laneBuf: [], sliding: false, slideT: 0, slideCd: 0, slideBuf: 0, dive: false,
           state: 'run', stateT: 0, knockT: 0, kvx: 0, kvf: 0, tumble: 0, spinRate: 0, power: 0, slow: 0, slowF: 1, invuln: 0, hits: 0, trips: 0, stumbleT: 0 };
}

function approach(v, target, amount) { return v < target ? Math.min(target, v + amount) : Math.max(target, v - amount); }

// 噴石が地面に着弾したとき、恐竜に当たるか（地上付近にいて、無敵でなく、操作可能な状態のときだけ）
function rockHitsPlayer(P, rx, rz, radius) {
  const H = CFG.hit;
  return P.state === 'run' && P.invuln <= 0 && P.y < H.maxY && Math.hypot(P.x - rx, P.z - rz) < radius + H.dinoR;
}

// 直撃：着弾中心から外向き＋上向き＋前方へ吹き飛ばす。size は 'small' | 'mid' | 'large'
function knockPlayer(P, rx, rz, size) {
  const H = CFG.hit, C = CFG.rock.sizes[size], pw = C.power, dx = P.x - rx;
  const dir = Math.abs(dx) > 0.25 ? Math.sign(dx) : (P.x > 0 ? -1 : 1);   // ほぼ真下なら、広く空いている側へ
  P.state = 'knocked'; P.stateT = 0; P.knockT = H.knockBase + H.knockPer * pw; P.power = pw;
  P.kvx = dir * H.kickSide * pw; P.kvf = H.kickFwd * pw;
  P.vx = 0; P.vy = H.kickUp * (0.6 + 0.4 * pw); P.y = Math.max(P.y, 0) + 0.01; P.grounded = false;
  P.tumble = 0; P.spinRate = -H.spin * (0.7 + 0.3 * pw);
  P.slow = C.slowSec; P.slowF = C.slowF; P.hits++;
  lanePlayerCancel(P);
  return true;
}

// 操作不能になるとき：レーン移動・入力の覚え・滑走をやめる（起き上がりで一番近いレーンへ戻る）
function lanePlayerCancel(P) {
  P.laneMove = false; P.laneBuf.length = 0; P.sliding = false; P.slideT = 0; P.slideBuf = 0; P.dive = false;
}

function stepKnocked(P, dt) {
  const H = CFG.hit, M = CFG.move;
  P.stateT += dt;
  P.x += P.kvx * dt;
  if (P.x > M.maxX) { P.x = M.maxX; P.kvx = -Math.abs(P.kvx) * 0.4; }
  if (P.x < -M.maxX) { P.x = -M.maxX; P.kvx = Math.abs(P.kvx) * 0.4; }
  P.vy -= CFG.jump.gravity * dt; P.y += P.vy * dt;
  if (P.y <= 0) {
    P.y = 0;
    if (P.vy < -H.bounceMin) { P.vy = -P.vy * H.bounce; P.grounded = false; } else { P.vy = 0; P.grounded = true; }
  }
  const drag = Math.exp(-(P.grounded ? H.friction : 0.5) * dt);
  P.kvx *= drag; P.kvf *= drag;
  P.tumble += P.spinRate * dt * (P.grounded ? 0.3 : 1);
  if (P.stateT >= P.knockT && (P.grounded || P.stateT >= P.knockT + 0.5)) {   // 吹き飛び終わり → 起き上がり
    P.y = 0; P.vy = 0; P.grounded = true; P.kvx = 0; P.kvf = 0; P.vx = 0;
    const TAU = Math.PI * 2; P.tumble -= TAU * Math.round(P.tumble / TAU);   // 一番近い「立ち姿」へ（見た目の巻き戻りを最小に）
    P.state = 'recover'; P.stateT = 0; P.lane = laneNearest(P.x);
  }
  return H.knockMul;
}

// レーン移動を始める（dir = -1 左 / +1 右。目標のレーンから数える）。端で動けないなら false
function laneStart(P, dir) {
  const L = CFG.lane, to = P.lane + dir;
  if (to < 0 || to > L.count - 1) return false;
  P.laneFrom = P.x; P.lane = to; P.laneT = 0; P.laneMove = true;
  return true;
}
// レーン移動を 1 フレーム進める：入力（左右の「押した瞬間」）の受付・移動中の入力のバッファ・なめらかな補間
function stepLane(P, inp, dt) {
  const L = CFG.lane, dir = (inp.right ? 1 : 0) - (inp.left ? 1 : 0), x0 = P.x;
  for (let i = P.laneBuf.length - 1; i >= 0; i--) { P.laneBuf[i].t += dt; if (P.laneBuf[i].t > L.bufferSec) P.laneBuf.splice(i, 1); }
  if (dir !== 0) {
    if (P.laneMove) { P.laneBuf.push({ dir, t: 0 }); while (P.laneBuf.length > L.bufferMax) P.laneBuf.shift(); }
    else laneStart(P, dir);
  }
  if (P.laneMove) {
    P.laneT += dt;
    const to = laneX(P.lane), u = P.laneT / L.shiftSec;
    if (u >= 1) {
      P.x = to; P.laneMove = false;
      while (P.laneBuf.length && !P.laneMove) { const b = P.laneBuf.shift(); laneStart(P, b.dir); }   // 覚えていた入力を順に実行（端で動けないものは捨てる）
    } else P.x = P.laneFrom + (to - P.laneFrom) * smooth01(u);
  } else P.x = laneX(P.lane);
  P.vx = dt > 0 ? (P.x - x0) / dt : 0;
}

// くぐる（滑走）：地上で S / ↓。空中なら急降下して、着地したらすぐ滑走
function slideStart(P) { P.sliding = true; P.slideT = CFG.slide.sec; P.slideBuf = 0; }
function stepSlide(P, inp, dt) {
  const S = CFG.slide;
  if (P.slideCd > 0) P.slideCd = Math.max(0, P.slideCd - dt);
  if (P.slideBuf > 0) P.slideBuf = Math.max(0, P.slideBuf - dt);
  if (inp.slide) {
    if (!P.grounded) { if (P.y > 0.15) { P.dive = true; P.vy = Math.min(P.vy, -S.dive); } }
    else if (!P.sliding && P.slideCd <= 0) slideStart(P);
    else if (!P.sliding) P.slideBuf = S.buffer;   // クールダウン中に押した：終わったらすぐ出す
  }
  if (P.sliding) {
    P.slideT -= dt;
    if (P.slideT <= 0) { P.sliding = false; P.slideT = 0; P.slideCd = S.cooldown; }
  } else if (P.slideBuf > 0 && P.grounded && P.slideCd <= 0) slideStart(P);
}
// 当たり判定の高さ（滑走中は低い）
function playerHeight(P) { return P.sliding ? CFG.slide.slideH : CFG.slide.standH; }

// inp = { left, right, jump, slide }（すべて「押した瞬間」の 1 回分。押しっぱなしは無視）。P を直接更新する
function stepPlayer(P, inp, dt) {
  const J = CFG.jump, H = CFG.hit;
  if (P.invuln > 0) P.invuln = Math.max(0, P.invuln - dt);
  if (P.stumbleT > 0) P.stumbleT = Math.max(0, P.stumbleT - dt);
  let mul = 1;
  if (P.state === 'run') {
    stepLane(P, inp, dt);
    if (inp.jump && P.grounded) { P.vy = J.velocity; P.grounded = false; if (P.sliding) { P.sliding = false; P.slideT = 0; P.slideCd = CFG.slide.cooldown; } }   // ジャンプは滑走を打ち切る
    stepSlide(P, inp, dt);
    if (!P.grounded) {
      P.vy -= J.gravity * dt; P.y += P.vy * dt;
      if (P.y <= 0) { P.y = 0; P.vy = 0; P.grounded = true; if (P.dive) { P.dive = false; slideStart(P); } }   // 急降下で着地したら、すぐ滑走
    }
    if (P.slow > 0) {   // 直撃のあとしばらく遅い。最後の slowRamp 秒でなめらかに元の速さへ
      P.slow = Math.max(0, P.slow - dt);
      mul = P.slowF + (1 - P.slowF) * (1 - Math.min(1, P.slow / H.slowRamp));
    }
  } else if (P.state === 'knocked') {
    mul = stepKnocked(P, dt);
  } else {   // recover：立ち上がるまで操作不能。一番近いレーンの中心へ寄る
    P.stateT += dt; P.tumble *= Math.exp(-10 * dt); P.y = 0; P.vy = 0; P.grounded = true;
    const x0 = P.x; P.x += (laneX(P.lane) - P.x) * (1 - Math.exp(-14 * dt)); P.vx = dt > 0 ? (P.x - x0) / dt : 0;
    mul = H.recoverMul;
    if (P.stateT >= H.recoverSec) { P.state = 'run'; P.stateT = 0; P.tumble = 0; P.invuln = H.invulnSec; P.x = laneX(P.lane); P.vx = 0; P.laneMove = false; }
  }
  P.time += dt;
  P.speed = speedAt(P.time) * mul;
  P.dist += (P.speed + P.kvf) * dt;
  P.z = -P.dist;   // 前方は -z
}

// ジャンプの滞空時間と最高到達点（調整の目安）
function jumpStats() { const J = CFG.jump; return { air: 2 * J.velocity / J.gravity, peak: J.velocity * J.velocity / (2 * J.gravity) }; }
// ===== 火山の噴火状態（純ロジック。経過秒 → 状態。three.js 非依存） =====
function smooth01(x) { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }

// t = ゲーム開始からの秒。k = 噴火強度 0〜1、smoke = 煙の量（噴火前も少しある）
function volcanoState(t) {
  const V = CFG.volcano;
  if (!(t >= V.eruptDelay)) return { state: 'idle', k: 0, smoke: V.idleSmoke, shake: 0, flash: 0, boom: false };
  const e = t - V.eruptDelay, k = smooth01(e / V.rampTime);
  const sh = Math.max(0, 1 - e / V.shakeDur), fl = Math.max(0, 1 - e / V.flashDur);
  return { state: 'erupting', k, smoke: V.idleSmoke + (1 - V.idleSmoke) * k, shake: V.shakeAmp * sh * sh, flash: V.flashMax * fl * fl, boom: e < V.boomDur };
}
// ===== 噴石のスケジューラ（純ロジック。three.js 非依存） =====
function rr(rng, a, b) { return a + (rng ? rng() : Math.random()) * (b - a); }

function newRockSched() { return { timer: CFG.rock.firstDelay, rocks: [], nextId: 1, s: null }; }   // s = 難易度の強度（null なら固定値）

function pickRockSize(r, weights) {
  const w = weights || CFG.rock.weights, x = r * (w.small + w.mid + w.large);
  return x < w.small ? 'small' : x < w.small + w.mid ? 'mid' : 'large';
}

// 落下地点の候補（x）：レーンの中心とレーンの間。着弾の当たり円がちょうど何レーンぶんの中心を覆うかを数え、
// 小型=1 レーン / 中型=1〜2 レーン / 大型=2 レーン（全レーンを覆う配置は置かない＝必ず安全なレーンが残る）だけ残す
function rockCovered(x, size) {   // 当たり円が覆うレーン番号
  const R = CFG.rock.sizes[size].radius + CFG.hit.dinoR, out = [];
  for (let i = 0; i < CFG.lane.count; i++) if (Math.abs(laneX(i) - x) < R) out.push(i);
  return out;
}
function rockSpots(size) {
  const n = CFG.lane.count, out = [];
  for (let k = 0; k < 2 * n - 1; k++) {
    const x = (laneX(0) + laneX(n - 1)) / 2 + (k - (n - 1)) * CFG.lane.width / 2, c = rockCovered(x, size).length;
    if (size === 'small' ? c === 1 : c >= 1 && c <= n - 1) out.push({ x, lanes: rockCovered(x, size) });
  }
  return out;
}

// 落下地点：着弾までに恐竜が進む距離を見込んで前方にずらす。aimed なら恐竜のいるレーンを覆う位置、そうでなければ前方のどこか（x はレーンに吸着）
function pickRockTarget(P, size, rng, aimChance) {
  const R = CFG.rock, C = R.sizes[size];
  const lead = Math.max(0, P.speed) * C.warn, aimed = rr(rng, 0, 1) < (aimChance == null ? R.aimChance : aimChance);
  let spots = rockSpots(size), z;
  if (aimed) { const hit = spots.filter(s => s.lanes.indexOf(P.lane) >= 0); if (hit.length) spots = hit; z = P.z - lead + rr(rng, -R.aimJitterZ, R.aimJitterZ); }
  else z = P.z - lead - rr(rng, 3, R.aheadExtra);
  const s = spots[Math.min(spots.length - 1, Math.floor(rr(rng, 0, 1) * spots.length))];
  return { x: s.x, z, aimed };
}

// 噴石を1個追加（同時数が上限なら null）。warn は開発用の秒数上書き
function spawnRock(S, size, x, z, rng, warn) {
  if (S.rocks.length >= CFG.rock.maxActive) return null;
  const C = CFG.rock.sizes[size];
  const r = { id: S.nextId++, size, x, z, t: 0, warn: warn || C.warn, radius: C.radius, vis: C.vis, H: C.fallH,
              ox: rr(rng, -CFG.rock.sideOff, CFG.rock.sideOff), oz: CFG.rock.backDist * rr(rng, 0.8, 1.2) };
  S.rocks.push(r); return r;
}

// 飛行中の位置：後方の高い所から放物線で着弾点へ（y は着弾で 0）
function rockPos(r) {
  const u = Math.min(1, r.t / r.warn);
  return { x: r.x + r.ox * (1 - u), y: r.H * (1 - u * u), z: r.z + r.oz * (1 - u), u };
}


// ---- 公平性：「避けようがない」噴石を出さない ----
// 着地地点の危険帯：その噴石が着弾する時刻に、プレイヤー（いまの速さで直進すると仮定）が円に入ってしまう x の範囲。届かなければ null
function rockZone(P, size, x, z, rem) {
  const C = CFG.rock.sizes[size], F = CFG.rock.fair, v = Math.max(P.speed, 1), R = C.radius + CFG.hit.dinoR + F.margin;
  const dz = Math.abs(P.z - v * rem - z);
  if (dz >= R) return null;
  const dx = Math.sqrt(R * R - dz * dz);
  return { lo: x - dx, hi: x + dx, rem };
}
// この噴石 cand = { size, x, z, rem } を足しても、プレイヤーが着弾までに安全なレーンへ移って逃げ切れるか。
// 反応時間 react のあと、隣のレーンへは shiftSec（＋余裕）ずつかかる。着弾までに間に合うレーンで、障害物（岩・倒木・アーチ・溜まりなど）に塞がれていないものが 1 つでもあればよい。
// 噴石どうしが重なって安全なレーンが無くなる配置、移る時間が足りない配置を弾く（資料 §16「必ず回避可能なルートを作る」）
function rockEscapable(S, P, cand, OB) {
  const F = CFG.rock.fair, L = CFG.lane, zones = [];
  for (const r of S.rocks) { const z = rockZone(P, r.size, r.x, r.z, r.warn - r.t); if (z) zones.push(z); }
  const zc = rockZone(P, cand.size, cand.x, cand.z, cand.rem); if (zc) zones.push(zc);
  const inZ = (x, z) => x > z.lo && x < z.hi, here = zones.filter(z => inZ(P.x, z) || inZ(laneX(P.lane), z));
  if (!here.length) return true;
  const rem = Math.min(...here.map(z => z.rem)), rt = P.laneMove ? Math.max(0, L.shiftSec - P.laneT) : 0;
  const blocked = i => {
    if (!OB || !OB.list) return false;
    const O = CFG.obstacle, v = Math.max(P.speed, 1);
    for (const ob of OB.list) {
      const tz = (P.z - (ob.z + (ob.type === 'crater' || ob.type === 'pool' ? ob.r : ob.hd) + O.depthPad)) / v;
      if (tz > -0.1 && tz < rem + 0.3 && Math.abs(laneX(i) - ob.x) < ob.hw + O.dinoR + 0.3) return true;
    }
    return false;
  };
  for (let i = 0; i < L.count; i++) {
    if (zones.some(z => inZ(laneX(i), z)) || blocked(i)) continue;
    const n = Math.abs(i - P.lane);
    if (rt + n * (L.shiftSec + F.moveExtra) + F.react <= rem) return true;
  }
  return false;
}


// 1 フレーム進める。erupting のときだけ新しい噴石を出す。着弾した噴石は取り除き、直撃なら恐竜を吹き飛ばす
function stepRocks(S, P, dt, erupting, rng, OB) {
  const R = CFG.rock, ev = { spawned: [], landed: [] }, K = rockParams(S.s);
  if (erupting) {
    S.timer -= dt;
    if (S.timer <= 0) {
      if (S.rocks.length < K.maxActive) {
        const size = pickRockSize(rr(rng, 0, 1), K.weights), warn = R.sizes[size].warn;
        let tg = null;   // 逃げ切れない配置になる場所は選び直す（fair.tries 回まで）。全部だめなら少し待ってやり直す
        for (let i = 0; i < R.fair.tries && !tg; i++) { const c = pickRockTarget(P, size, rng, K.aim); if (rockEscapable(S, P, { size, x: c.x, z: c.z, rem: warn }, OB)) tg = c; }
        const r = tg ? spawnRock(S, size, tg.x, tg.z, rng) : null;
        if (r) { ev.spawned.push(r); S.timer = K.interval * (1 + R.jitter * (rr(rng, 0, 1) * 2 - 1)); } else S.timer = R.fair.retry;
      } else S.timer = 0.25;
    }
  }
  const alive = [];
  for (const r of S.rocks) {
    if (ev.spawned.indexOf(r) < 0) r.t += dt;
    if (r.t >= r.warn) {
      const hit = rockHitsPlayer(P, r.x, r.z, r.radius);
      if (hit) knockPlayer(P, r.x, r.z, r.size);
      ev.landed.push({ rock: r, hit });
    } else alive.push(r);
  }
  S.rocks = alive;
  return ev;
}
// ===== マグマと一回のゲーム進行（純ロジック。three.js 非依存） =====
// 位置は「走行距離（dist）の座標」で持つ。M.front＝マグマ先端の位置、P.dist＝プレイヤーの位置。前方ほど大きい
// 差（gap）= P.dist - M.front が 0 以下になったらゲームオーバー（ジャンプ中でも関係なし）
function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }

function newMagma() { return { phase: 'playing', active: false, clearT: 0, front: -CFG.magma.startGap, speed: 0, t: 0, deadT: 0, deathDist: 0 }; }
function newGame() { return { P: newPlayer(), M: newMagma(), RS: newRockSched(), OB: newObstacles() }; }

// 噴火してから e 秒後のマグマの速さ magmaSpeedAt(e) は 29-difficulty-logic.js（難易度の強度に連動）
function magmaGap(M, P) { return P.dist - M.front; }
// 溶岩の高さの倍率（0〜1）：先端が近い（gap が小さい）ほど低くして、画面の下を覆って恐竜が見えなくなるのを防ぐ。死亡のときだけ 1（溶岩が恐竜を覆ってよい）
function magmaViewScale(gap, dead) { const V = CFG.magma.view; return dead ? 1 : 1 - (1 - V.min) * smooth01((V.far - gap) / (V.far - V.near)); }
// 近さ 0〜1（range 以上離れていれば 0、接触で 1）
function magmaProx(gap, range) { return clamp01(1 - gap / range); }
// HUD のゲージ：点灯する点の数（0〜dangerGaps.length）。近いほど多い
function magmaDanger(gap) { let n = 0; for (const g of CFG.magma.dangerGaps) if (gap < g) n++; return n; }

// マグマを 1 フレーム進める。このフレームで追いつかれたら true
function stepMagma(M, P, dt, erupting) {
  const C = CFG.magma;
  if (M.phase === 'dead') {   // 死亡後：先端はプレイヤーを少し越えるまで進んで止まる（溶岩面が恐竜に被さる）
    M.deadT += dt;
    const cap = M.deathDist + C.deathOvershoot;
    M.speed = 0;
    M.front += (cap - M.front) * (1 - Math.exp(-6 * dt));   // なめらかに越えて止まる（cap は超えない）
    return false;
  }
  if (!M.active) {
    M.front = P.dist - C.startGap;   // 噴火前は動かない（常に startGap だけ後ろで待機）
    if (!erupting) return false;
    M.active = true;
  }
  M.t += dt; M.speed = magmaSpeedAt(M.t) * magmaRubber(P.dist - M.front); M.front += M.speed * dt;
  if (P.dist - M.front <= 0) {
    M.phase = 'dead'; M.deadT = 0; M.deathDist = P.dist; M.front = P.dist;
    P.state = 'dead'; P.stateT = 0; P.vx = 0; P.vy = 0; P.kvx = 0; P.kvf = 0; P.invuln = 0; P.slow = 0; P.tumble = 0; lanePlayerCancel(P);
    if (P.y < 0.05) { P.y = 0; P.grounded = true; }
    return true;
  }
  return false;
}

// ゲーム全体を 1 フレーム進める。G = { P, M, RS, OB }。playing の間だけ前進・操作・噴石の新規生成が動く。
// dead の間はプレイヤーは動かず（P.stateT は死亡演出の経過秒）、噴石は新しく出ないが、すでに落下中のものは着弾する。
// clear（goal.distance に到達）：前進・噴石・マグマ・障害物をすべて止める（落下中の噴石も消す）。M.phase === 'clear'
function stepGame(G, inp, dt, rng) {
  const { P, M, RS, OB } = G, ev = { spawned: [], landed: [], died: false, cleared: false, obstacle: { hits: [], spawned: [], removed: 0 } };
  if (M.phase === 'playing') {
    stepPlayer(P, inp, dt);
    if (OB) ev.obstacle = stepObstacles(OB, P, dt);
    const erupting = volcanoState(P.time).state === 'erupting';
    RS.s = erupting ? difficultyAt(P.time - CFG.volcano.eruptDelay).s : 0;   // 噴石の間隔・大きさ・同時数は難易度の強度で決まる
    const r = stepRocks(RS, P, dt, erupting, rng, OB); ev.spawned = r.spawned; ev.landed = r.landed;
    ev.died = stepMagma(M, P, dt, erupting);
    if (!ev.died && reachedGoal(G)) {
      M.phase = 'clear'; M.clearT = 0; ev.cleared = true; RS.rocks = [];
      P.speed = 0; P.vx = 0; P.kvx = 0; P.kvf = 0; P.slow = 0; P.invuln = 0; P.tumble = 0; P.stumbleT = 0; lanePlayerCancel(P);
      if (P.state !== 'run') { P.state = 'run'; P.stateT = 0; }
      if (P.y < 0.05) { P.y = 0; P.grounded = true; }
    }
  } else if (M.phase === 'clear') {
    P.stateT += dt; M.clearT += dt;
    if (!P.grounded) { P.vy -= CFG.jump.gravity * dt; P.y += P.vy * dt; if (P.y <= 0) { P.y = 0; P.vy = 0; P.grounded = true; } }   // 空中でクリアしたら着地だけする
  } else {
    P.stateT += dt;
    const r = stepRocks(RS, P, dt, false, rng); ev.landed = r.landed;
    stepMagma(M, P, dt, false);
  }
  return ev;
}

// 全状態を初期化（オブジェクトの参照は変えず、中身だけ入れ替える）
function resetGame(G, seed) {
  Object.assign(G.P, newPlayer()); Object.assign(G.M, newMagma()); Object.assign(G.RS, newRockSched()); Object.assign(G.OB, newObstacles(seed));
  return G;
}
// ===== 障害物（純ロジック。three.js 非依存）=====
// 岩・倒木・クレーター・マグマ溜まりを、走行距離に沿って「枠（slot）」ごとに決める。
// 枠 k の位置は startDist + k*slotStep + ばらつき(0〜slotStep-minGapZ) なので、隣り合う枠は必ず minGapZ 以上離れる。
// 1 つの枠には障害物が 1 個までなので、同じ z 帯（横一列）に 2 個並ぶことはない。結果は seed と k だけで決まる（再現できる）。
function obRng(seed, k) {   // (seed, k) から作る小さな乱数列（mulberry32）
  let h = (seed | 0) ^ Math.imul((k + 1) | 0, 0x9e3779b1);
  h = Math.imul(h ^ (h >>> 16), 0x85ebca6b); h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35); h ^= h >>> 16;
  let s = h >>> 0;
  return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function obLerp(a, b, t) { return a + (b - a) * t; }

// 枠が埋まる確率。走行距離で start → end へ線形に増える（level は先取り分 0〜1）
function obDensity(dist, level) {
  const D = CFG.obstacle.density, t = clamp01(difficultyAtDist(dist).s + (level || 0));   // 難易度の強度（その距離を走る頃の噴火後の秒から）
  return obLerp(D.start, D.end, t);
}

// 枠 k の「素の」障害物（他との兼ね合いを見る前）。無ければ null。乱数は常に同じ順に使う
// 障害物はレーン単位で置く：岩・クレーター・マグマ溜まりは 1 レーン、倒木・アーチは 1〜2 レーン。ob.lanes = 占有するレーン番号、ob.x = 中心
function obSlot(seed, k, level) {
  const O = CFG.obstacle, L = CFG.lane, W = L.width, rng = obRng(seed, k);
  const u = O.startDist + k * O.slotStep + rng() * (O.slotStep - O.minGapZ);   // 基準速度での位置
  const dist = O.startDist + (u - O.startDist) * speedScaleAtDist(u);   // 速く走るほど間隔を広げる（時間で見た間隔・ジャンプの余裕が一定になる。単調増加なので順序と最低間隔 minGapZ は保たれる）
  const fill = rng(), pick = rng(), a = rng(), b = rng(), c = rng();
  if (fill >= obDensity(dist, level)) return null;
  const types = ['rock', 'log', 'crater', 'pool', 'arch'].filter(t => dist - O.startDist >= O.unlock[t] && O.weights[t] > 0);
  if (!types.length) return null;
  let tot = 0; for (const t of types) tot += O.weights[t];
  let x = pick * tot, type = types[types.length - 1];
  for (const t of types) { if (x < O.weights[t]) { type = t; break; } x -= O.weights[t]; }
  const ob = { type, dist, z: -dist, hit: false };
  const ln = Math.min(L.count - 1, Math.floor(c * L.count)), pr = Math.min(L.count - 2, Math.floor(c * (L.count - 1)));   // 1 レーンの番号 / 2 レーンの左側の番号
  const one = { lanes: [ln], x: laneX(ln) }, two = { lanes: [pr, pr + 1], x: (laneX(pr) + laneX(pr + 1)) / 2 };
  if (type === 'rock') {
    const R = O.rock, r = obLerp(R.rMin, R.rMax, a);
    Object.assign(ob, one, { r, h: obLerp(R.hMin, R.hMax, b), hw: r * R.shrink, hd: r * R.shrink });
  } else if (type === 'log') {
    const Lg = O.log, n = a < Lg.oneLane ? 1 : 2, len = n * W - Lg.trim;
    Object.assign(ob, n === 1 ? one : two, { len, h: Lg.h, hw: len / 2, hd: Lg.r, r: Lg.r });
  } else if (type === 'crater') {
    const C = O.crater, r = obLerp(C.rMin, C.rMax, a);
    Object.assign(ob, one, { r, h: C.clearY, hw: r, hd: r });
  } else if (type === 'pool') {
    const Pl = O.pool, r = obLerp(Pl.rMin, Pl.rMax, a);
    Object.assign(ob, one, { r, h: Pl.clearY, hw: r, hd: r });
  } else {   // arch：梁が clear の高さにかかる。立ったままだと頭が当たり、滑走（くぐる）なら通れ、ジャンプでは越えられない
    const A = O.arch, n = b < A.oneLane ? 1 : 2, hw = n * W / 2 - A.inset;
    Object.assign(ob, n === 1 ? one : two, { hw, hd: A.hd, r: A.hd, h: A.clear, clear: A.clear, top: A.clear + A.beamH });
  }
  return ob;
}

// 枠 k の最終的な障害物。近くに倒木（素の判定）があれば、倒木自身が後ろの枠なら消し、他の種類は消す（倒木の前後を空ける）。
// アーチ（くぐる）の前後 arch.gapZ 以内にも他の障害物を置かない（滑走が終わる前に着地できない並びを避ける。アーチどうしは後ろを消す）。アーチ自身が倒木に消されるときは、他を消す力もなくなる
function archAlive(seed, k, level, arch) {
  const O = CFG.obstacle;
  for (let j = -3; j <= 3; j++) {
    if (j === 0 || k + j < 0) continue;
    const n = obSlot(seed, k + j, level);
    if (n && n.type === 'log' && Math.abs(n.dist - arch.dist) < O.logClearZ * speedScaleAtDist(arch.dist)) return false;
  }
  return true;
}
function obFinal(seed, k, level) {
  const O = CFG.obstacle, ob = obSlot(seed, k, level);
  if (!ob) return null;
  for (let j = -3; j <= 3; j++) {
    if (j === 0 || k + j < 0) continue;
    const n = obSlot(seed, k + j, level);
    if (!n) continue;
    if (n.type === 'log' && Math.abs(n.dist - ob.dist) < O.logClearZ * speedScaleAtDist(ob.dist)) {
      if (ob.type !== 'log' || j < 0) return null;
    } else if (n.type === 'arch' && ob.type !== 'log' && Math.abs(n.dist - ob.dist) < O.arch.gapZ * speedScaleAtDist(ob.dist) && archAlive(seed, k + j, level, n)) {
      if (ob.type !== 'arch' || j < 0) return null;
    }
  }
  return ob;
}

// 走行距離 [-zFrom, -zTo) にある障害物を、手前（スタート側）から順に返す（zFrom > zTo。z は前方が負）。同じ引数なら同じ結果
function planObstacles(seed, zFrom, zTo, level) {
  const O = CFG.obstacle, d0 = -zFrom, d1 = -zTo, out = [];
  const gMax = CFG.run.maxSpeed / CFG.run.baseSpeed, k0 = Math.max(0, Math.floor((d0 - O.startDist) / (O.slotStep * gMax)) - 1), k1 = Math.ceil((d1 - O.startDist) / O.slotStep) + 1;
  for (let k = k0; k <= k1; k++) {
    const ob = obFinal(seed, k, level);
    if (ob && ob.dist >= d0 && ob.dist < d1) out.push(ob);
  }
  return out;
}

function newObstacles(seed) {
  return { seed: seed == null ? CFG.obstacle.seed : seed, list: [], nextId: 1, genDist: 0, prevZ: 0, off: false, level: 0 };
}

// 岩・倒木・マグマ溜まりで転倒：Phase 3 の knocked → recover をそのまま使う（吹き飛びより弱い、つんのめる転がり）
function tripPlayer(P, T) {
  P.state = 'knocked'; P.stateT = 0; P.knockT = T.knock; P.power = 0.5;
  P.kvx = 0; P.kvf = T.fwd; P.vx = 0; P.vy = T.up; P.y = Math.max(P.y, 0) + 0.01; P.grounded = false;
  P.tumble = 0; P.spinRate = -T.spin;
  P.slow = T.slowSec; P.slowF = T.slowFactor; P.trips++; lanePlayerCancel(P);
}
// クレーター：転倒せず、少しつまずいて軽く減速
function stumblePlayer(P) {
  const S = CFG.obstacle.stumble;
  P.stumbleT = S.tiltSec;
  if (P.slow <= 0) { P.slow = S.slowSec; P.slowF = S.slowFactor; }   // すでに減速中ならそのまま
}

// 障害物 ob にプレイヤー（この 1 フレームで z が prevZ → P.z と動いた）が当たるか。ジャンプで高さが足りていれば当たらない
function obHits(ob, P, prevZ) {
  const O = CFG.obstacle;
  const top = ob.h - (ob.type === 'rock' || ob.type === 'log' ? O.footMargin : 0);   // 岩・倒木は少し甘め
  if (ob.type === 'arch') {   // 頭上の障害物：梁の高さ [clear, top] と、立ち（または滑走中）の体の高さ [y, y+高さ] が重なると当たる
    if (ob.hit || P.y + playerHeight(P) <= ob.clear || P.y >= ob.top) return false;
    return Math.abs(P.x - ob.x) < ob.hw + O.dinoR && P.z <= ob.z + ob.hd + O.depthPad && prevZ >= ob.z - ob.hd - O.depthPad;
  }
  if (ob.hit || P.y >= top) return false;
  const dx = Math.abs(P.x - ob.x);
  if (ob.type === 'rock' || ob.type === 'log') {
    return dx < ob.hw + O.dinoR && P.z <= ob.z + ob.hd + O.depthPad && prevZ >= ob.z - ob.hd - O.depthPad;
  }
  const dz = ob.z < P.z ? P.z - ob.z : ob.z > prevZ ? ob.z - prevZ : 0;   // この 1 フレームの移動線分と中心との最短の前後差
  return Math.hypot(dx, dz) < ob.r + (ob.type === 'pool' ? O.dinoR : O.dinoR * 0.3);
}

// 1 フレーム進める：前方を生成・後方を破棄・衝突判定。OB.off なら何もしない。ev.hits = [{ ob, kind: 'trip' | 'stumble' }]
function stepObstacles(OB, P, dt) {
  const O = CFG.obstacle, ev = { hits: [], spawned: [], removed: 0 };
  if (OB.off) { OB.prevZ = P.z; return ev; }
  const need = P.dist + O.aheadDist;
  while (OB.genDist < need) {
    for (const ob of planObstacles(OB.seed, -OB.genDist, -(OB.genDist + O.chunk), OB.level)) {
      if (ob.dist >= CFG.goal.distance - CFG.clear.safeZone) continue;   // ゴールの手前から先は洞窟（安全地帯）。障害物は置かない
      ob.id = OB.nextId++; OB.list.push(ob); ev.spawned.push(ob);
    }
    OB.genDist += O.chunk;
  }
  const n0 = OB.list.length;
  OB.list = OB.list.filter(o => o.z <= P.z + O.behindDist); ev.removed = n0 - OB.list.length;
  if (P.state === 'run' && P.invuln <= 0) {
    for (const ob of OB.list) {
      if (!obHits(ob, P, OB.prevZ)) continue;
      ob.hit = true;   // 1 つの障害物では 1 回だけ（連続衝突ループ防止。復帰後の無敵も別にある）
      if (ob.type === 'crater') { stumblePlayer(P); ev.hits.push({ ob, kind: 'stumble' }); }
      else { tripPlayer(P, ob.type === 'pool' ? O.poolTrip : O.trip); ev.hits.push({ ob, kind: 'trip' }); }
      break;
    }
  }
  OB.prevZ = P.z;
  return ev;
}
// ===== 難易度（純ロジック。three.js 非依存）=====
// 基準の時間 e＝「噴火が始まってからの秒」（= P.time - volcano.eruptDelay）。マグマも噴石も噴火で動き出すので、資料 §17 の
// 0〜20 / 20〜40 / 40〜60 / 60秒以降 は、この e で数える（ゲーム開始から数えると噴火前の 4 秒ぶんチュートリアルが短くなるため）。
// 強度 s（0〜1）は区間の境目でなめらかに（折れ線で連続）つながり、階段状には変わらない。噴石の間隔・大型率・マグマの速さ・障害物の密度・画面揺れは全部この s から決まる。
const STAGE_NAMES = ['tutorial', 'normal', 'danger', 'final'];

function difficultyAt(e) {
  const D = CFG.difficulty, K = D.knots;
  if (!(e > 0)) e = 0;
  let s = K[K.length - 1][1];
  for (let i = 1; i < K.length; i++) {
    if (e < K[i][0]) { s = obLerp(K[i - 1][1], K[i][1], (e - K[i - 1][0]) / (K[i][0] - K[i - 1][0])); break; }
  }
  let stage = 0;
  for (let i = 0; i < D.stageFrom.length; i++) if (e >= D.stageFrom[i]) stage = i;
  const last = stage >= D.stageFrom.length - 1, a = D.stageFrom[stage], b = last ? a : D.stageFrom[stage + 1];
  return { e, s, stage, next: last ? stage : stage + 1, blend: last ? 1 : (e - a) / (b - a), name: STAGE_NAMES[stage], label: D.labels[stage] };
}

// 距離 → 「ふつうに走ったときの噴火後の秒」。障害物は距離で決まる（seed と距離だけで再現できる）ので、距離から難易度を引くのに使う。被弾の減速は考えない
function nominalTime(dist) {
  const a = CFG.run.accel / 2, b = CFG.run.baseSpeed, d = Math.max(0, dist);
  const t = a > 0 ? (-b + Math.sqrt(b * b + 4 * a * d)) / (2 * a) : d / b;
  const tMax = (CFG.run.maxSpeed - CFG.run.baseSpeed) / CFG.run.accel;   // 最高速に達してからは等速
  return t <= tMax ? t : tMax + (d - (b * tMax + a * tMax * tMax)) / CFG.run.maxSpeed;
}
function difficultyAtDist(dist) { return difficultyAt(nominalTime(dist) - CFG.volcano.eruptDelay); }
// その距離でのふつうの走る速さ ÷ 基準速度（障害物の間隔を速さに比例して広げるのに使う。1 以上）
function speedScaleAtDist(dist) { return speedAt(nominalTime(dist)) / CFG.run.baseSpeed; }

// 噴石：強度 s での 落下間隔 / 同時数の上限 / 大きさの重み。s が null/undefined なら従来の固定値（Phase 3 の挙動）
function rockParams(s) {
  const R = CFG.rock, D = CFG.difficulty.rock;
  if (s == null) return { interval: R.interval, maxActive: R.maxActive, weights: R.weights, aim: R.aimChance };
  const w0 = D.weights0, w1 = D.weights1, u = smooth01((s - D.largeFrom) / (1 - D.largeFrom));   // 大型は強度 largeFrom（= 40 秒時点）まで 0、そこから増える
  const large = w1.large * u, rest = 1 - large;
  const sm = obLerp(w0.small, w1.small, s), md = obLerp(w0.mid, w1.mid, s), sum = sm + md;
  return { interval: obLerp(D.interval0, D.interval1, Math.pow(s, D.curve)), maxActive: Math.min(R.maxActive, Math.round(obLerp(D.active0, D.active1, s))), aim: obLerp(D.aim0, D.aim1, s),
           weights: { small: rest * sm / sum, mid: rest * md / sum, large } };
}

// マグマの速さ：噴火後 e 秒。強度 s にそって speed0 → speedMax（序盤遅く・中盤少しずつ・終盤かなり速く）
function magmaSpeedAt(e) {
  const C = CFG.magma;
  return obLerp(C.speed0, C.speedMax, Math.pow(difficultyAt(e).s, CFG.difficulty.magmaCurve));
}

// 60 秒以降の常時の小刻みな画面揺れの大きさ（位置のみ）。final の少し前から 0 → amp
function finalShake(e) { const S = CFG.difficulty.shake; return S.amp * smooth01((e - S.from) / S.over); }
// 噴火の迫力の倍率（0〜1）。強度が上がるほど最大へ
function eruptionMul(s) { const E = CFG.difficulty.eruptMul; return obLerp(E, 1, s); }

// クリア：走行距離が goal.distance に届いた
function reachedGoal(G) { return G.P.dist >= CFG.goal.distance; }

// マグマの「ひるみ」：先端が近いほど少しだけ遅くなる（rubber band）。被弾でじわじわ追いつかれても、近づいたぶん少し猶予が生まれて「ギリギリ逃げ切る」展開になる。
// gap >= range なら 1.0（影響なし）、gap = 0 で min。被弾なしで走っている間は gap が range より大きいので効かない
function magmaRubber(gap) { const C = CFG.magma; return obLerp(C.rubberMin, 1, clamp01(gap / C.rubberRange)); }
// ===== 演出の純ロジック（three.js 非依存。verify.html でテスト）=====
// 画面揺れの合成と上限・ヒットストップ・音のダッキング・足音のタイミング・危険マーカーの近さ・つぶれ。
// ゲーム時間（物理）には触らない：ヒットストップは「ゲーム時間を進めない」だけで、演出側の時計は続く。
const FX_PI = Math.PI;
function fxClamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
function fxInt() { return fxClamp01(CFG.fx.intensity); }

function fxNew() { return { hitstop: 0, duckDepth: 0, duckHold: 0, cool: {} }; }
function fxReset(F) { F.hitstop = 0; F.duckDepth = 0; F.duckHold = 0; F.cool = {}; }

// 画面揺れ：複数の揺れの大きさを二乗和の平方根で合成し、上限 cap で頭打ちにする（足し算だと重なったとき操作不能になる）
function fxShakeCombine(amps, cap) {
  let s = 0; for (const a of amps) if (a > 0) s += a * a;
  return Math.min(cap, Math.sqrt(s));
}
// 実際にカメラへ足す揺れの大きさ（演出の強さを掛ける）
function fxShakeTotal(amps) { return fxShakeCombine(amps, CFG.fx.shake.cap) * fxInt(); }

// ヒットストップ：sec 秒ゲーム時間を止める。重なったら長いほうを採用。上限あり
function fxHitstop(F, sec) { const H = CFG.fx.hitstop; F.hitstop = Math.max(F.hitstop, Math.min(H.max, sec * fxInt())); }

// ダッキング：大きな音のとき他の音を下げる。depth=下げる深さ（0〜0.9）, hold=そのままの秒。戻りは release 秒かけて線形

// 毎フレーム：音量の倍率（1=そのまま、下がると 1-depth）を返す
function fxDuckStep(F, dt) {

// 足音：脚の位相 phase（ラジアン）が π を跨ぐたびに 1 歩。1 フレームに出す回数は 2 まで

// 危険マーカーの近さ：まだ着弾していない噴石のうち、円の縁から恐竜までの水平距離が最小のもの。nearness は range で 1→0

  let best = Infinity;

    const d = Math.max(0, Math.hypot(r.x - P.x, r.z - P.z) - r.radius);

// 縦のつぶれ（スクワッシュ）の倍率。sinceTakeoff=離陸からの秒、sinceLand=着地からの秒（古い値は大きな数を渡す）。strength=着地の強さ 0〜1

// ===== スコアとベストスコア（純ロジック。three.js 非依存。verify.html でテスト）=====

function scoreAdd(S, kind, pts, text) {

}
function scoreTake(S) { const e = S.events; S.events = []; return e; }   // 画面に出す分を取り出す（取り出したら空になる）

// stepGame のあと毎フレーム呼ぶ。ev は stepGame の戻り値
function scoreStep(S, G, ev, dt) {

  for (const l of ev.landed) {

    if (l.hit) { S.combo = 0; continue; }

    const R = r.radius + H.dinoR, ratio = Math.hypot(P.x - r.x, P.z - r.z) / R, large = r.size === 'large', air = P.y >= H.maxY;

    if (near || (large && was)) {                                // 大型は、警告円の中にいたのに着弾までに出て逃げ切ったときも

  if (ev.obstacle && ev.obstacle.hits.length) S.combo = 0;

    }

}

// ---- ベストスコア：localStorage（使えない・例外でも落ちない。st は getItem/setItem を持つもの。null でも可）----
function bestStorage() { try { return window.localStorage || null; } catch (e) { return null; } }   // file:// やプライベートモードでは例外になることがある
function bestRead(st) {

}
// ===== ゲーム全体の流れ（純ロジック。three.js 非依存。verify.html でテスト）=====

function flowCanRestart(F) { return F.mode === 'over' || (F.mode === 'clear' && !!F.clear && F.clear.stage === 'result'); }

}

function flowFinish(F, P) {

  F.newRecord = F.score > F.best;

}

// 1 フレーム進める。title の間は G に一切触れない。戻り値は stepGame と同じ形の ev（＋ ev.clear = クリア演出の出来事 ['stage:breathe', 'boom', …]）
function stepFlow(F, G, inp, dt, rng) {
  const P = G.P;
  if (F.mode === 'title') { F.t += dt; return flowEmptyEv(); }
  if (F.mode === 'playing') {
    const v0 = P.speed, ev = stepGame(G, inp, dt, rng); ev.clear = [];
    F.playT += dt;
    scoreStep(F.S, G, ev, dt);

    else if (ev.cleared) { F.mode = 'clear'; F.clear = newClearSeq(v0, P); flowFinish(F, P); }

  }

// カメラの回り込み角（0＝通常の後ろ追従、π＝正面）。タイトルはゆっくり揺れ、開始で通常へ戻る。クリア演出は振り返りで π へ

// ---- クリア演出の状態機械：runin（安全地帯へ走り込んで減速・停止）→ breathe（息を切らす）→ lookback（振り返る）→ eruption（火山が大爆発）→ relief（……危なかった）→ result ----
const CLEAR_STAGES = ['runin', 'breathe', 'lookback', 'eruption', 'relief', 'result'];

// 走り込み：時刻 t（0〜runIn）の位置 s と速さ。初速 v0 から始まり、runIn 秒でちょうど stopDist 進んで速さ 0 で止まる（3 次のなめらかな減速）

  const r = clearRunAt(C, t), K = CFG.clear;

// 1 フレーム進める。起きた出来事の名前の配列を返す：'stage:◯◯' / 'boom'（大爆発の瞬間）/ 'relief-text'（「……危なかった」）

  const ev = [];
  if (C.stage === 'result') return ev;

// Space で結果画面へ飛ばす（クリアから skipFrom 秒たってから）。飛ばしたら 'skip' ほかの出来事を返す
function clearSkip(C, P) {

  C.i = CLEAR_STAGES.length - 1; C.stage = 'result'; C.t = 0; C.skipped = true; C.textShown = true;

// 見た目に使う値（0〜1）
function clearTurn(C) { return C.i < 2 ? 0 : C.i === 2 ? smooth01(C.t / CFG.clear.lookTurn) : 1; }                 // 恐竜が回る
function clearCam(C) { return C.i < 2 ? 0 : C.i === 2 ? smooth01(C.t / CFG.clear.lookBack) : 1; }                  // カメラの回り込み
function clearShock(C) { return C.i === 3 ? Math.max(0, 1 - C.t / 1.6) : C.i === 4 ? Math.max(0, 0.15 * (1 - C.t / 0.8)) : 0; }   // 驚き（大爆発の直後が最大）

function clearFlash(C) { const K = CFG.clear.flash; return C.i === 3 ? K.max * Math.pow(Math.max(0, 1 - C.t / K.sec), 2) : 0; }   // 巨大な閃光

//   err      = 各危険（噴石 1 個・障害物 1 個）を「見逃す」確率。0 = 完璧、1 = 何も避けない（動かない・ジャンプもしない）

function botRun(o) {

  const DT = 1 / 60, L = CFG.lane, H = CFG.hit, O = CFG.obstacle, nL = L.count;
  const G = newGame(); G.OB.seed = o.seed; if (o.quiet) G.RS.timer = 1e9;

  const ignored = key => { if (!memo.has(key)) { memo.set(key, brng() < o.err); if (key[0] === 'r') stats.threatR++; else stats.threatO++; } return memo.get(key); };

      const cost = new Array(nL).fill(0), first = new Array(nL).fill(null), wins = [...Array(nL)].map(() => []);

        if (tz < -0.3 || tz > 1.6) continue;
        for (let i = 0; i < nL; i++) {
          if (Math.abs(laneX(i) - ob.x) >= ob.hw + O.dinoR + 0.3) continue;
          cost[i] += ob.type === 'pool' ? 10 : 1;
          if (!first[i] || tz < first[i].tz) first[i] = { ob, tz };
          wins[i].push([tz, tz + 2 * ((ob.type === 'crater' || ob.type === 'pool' ? ob.r : ob.hd) + O.depthPad) / v]);
        }
      }
      // 自分のレーンの障害物を見逃す？（pool も含む。最初に自分のレーンに来たときに決める）
      let curCost = cost[cur], curFirst = first[cur];
      if (curFirst && ignored('o' + curFirst.ob.id)) { curCost = 0; curFirst = null; }
      // 隣へ移る途中で通り抜ける間のレーンに、ちょうど障害物が来ていないか（来ているなら、その道は通れない）
      const pathOk = i => { for (let j = cur + Math.sign(i - cur); j !== i; j += Math.sign(i - cur)) { const k = Math.abs(j - cur), a = (k - 0.6) * L.shiftSec, b = (k + 0.6) * L.shiftSec; if (wins[j].some(w => w[0] < b && w[1] > a)) return false; } return true; };
      let target = cur;
      if (rockRem[cur] < Infinity) {   // 噴石が来る：間に合う安全なレーンのうち、障害物コストが小さく近いもの
        const rem = rockRem[cur];
        let best = -1;
        for (let i = 0; i < nL; i++) {
          if (rockRem[i] < Infinity || cost[i] >= 10 || !pathOk(i)) continue;
          const n = Math.abs(i - cur) + (P.laneMove ? 0.5 : 0);
          if (n * L.shiftSec > rem - 0.04) continue;
          if (best < 0 || cost[i] + 0.3 * Math.abs(i - cur) < cost[best] + 0.3 * Math.abs(best - cur)) best = i;
        }
        if (best >= 0) target = best;
        else if (rem < 0.45 && rem > 0.25) blastJump = true;   // 逃げ切れない：着弾の瞬間に空中にいる
      } else if (curFirst && curCost > 0) {
        const f = curFirst, pool = f.ob.type === 'pool';
        let best = -1;
        for (let i = 0; i < nL; i++) {   // 隣の空いたレーン（噴石の来ないレーン）
          if (i === cur || cost[i] > 0 || rockRem[i] < Infinity || !pathOk(i)) continue;
          const n = Math.abs(i - cur) + (P.laneMove ? 0.5 : 0);
          if (n * L.shiftSec + 0.03 > f.tz) continue;
          if (best < 0 || Math.abs(i - cur) < Math.abs(best - cur)) best = i;
        }
        if (best >= 0 && (pool || wantsDodge(f.ob.id))) { target = best; if (!pool) stats.dodges++; }
        else if (!pool) {
          if (f.ob.type === 'arch') { if (f.tz <= 0.3 && f.tz > -0.05) act = 'slide'; }
          else if (f.tz <= 0.3 && f.tz > -0.1) act = 'jump';
        }
      }
      if (target !== cur && !P.laneMove) { if (target > cur) inp.right = true; else inp.left = true; }
      if ((act === 'jump' || blastJump) && P.grounded) { inp.jump = true; stats.jumps++; }
      else if (act === 'slide' && !P.sliding && P.grounded) { inp.slide = true; stats.slides++; }
    }
    if (o.onFrame) o.onFrame(G, inp, t);
    const ev = stepGame(G, inp, DT, rockRng); t += DT;
    if (P.lane !== prevLane) { stats.laneMoves++; prevLane = P.lane; }
    for (const r of ev.spawned) { stats.rocks++; stats.spawnedBySize[r.size]++; if (r.size === 'large') stats.big++; }
    for (const l of ev.landed) if (l.hit) stats.log.push({ t: +P.time.toFixed(1), what: l.rock.size + ' rock', x: +P.x.toFixed(1), rx: +l.rock.x.toFixed(1), y: +P.y.toFixed(2) });
    for (const h of ev.obstacle.hits) stats.log.push({ t: +P.time.toFixed(1), what: h.ob.type, x: +P.x.toFixed(1), ox: +h.ob.x.toFixed(1), y: +P.y.toFixed(2) });
    stats.maxActive = Math.max(stats.maxActive, G.RS.rocks.length);
    if (M.active) minGap = Math.min(minGap, magmaGap(M, P));
    if (ev.cleared) cleared = P.time;
  }
  return { result: M.phase, t: P.time, dist: P.dist, hits: P.hits, trips: P.trips, minGap, gap: magmaGap(M, P), clearT: cleared, stats, G };
}

// n 回（seed を変えて）走らせた集計。base は seed の起点
function botSummary(o, n, base) {
  const rs = []; for (let i = 1; i <= n; i++) rs.push(botRun(Object.assign({ seed: (base || 0) + i * 7 + 3, rngSeed: (base || 0) + i }, o)));
  const cl = rs.filter(r => r.result === 'clear'), dead = rs.filter(r => r.result !== 'clear');
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : NaN;
  return { n, clear: cl.length, clearRate: cl.length / n, clearT: avg(cl.map(r => r.t)), deadT: avg(dead.map(r => r.t)), deadTs: dead.map(r => r.t), hits: avg(rs.map(r => r.hits)), trips: avg(rs.map(r => r.trips)),
           minGapClear: avg(cl.map(r => r.minGap)), dist: avg(rs.map(r => r.dist)), runs: rs };
}
function botLine(s) { const f = (v, d) => isNaN(v) ? '-' : v.toFixed(d || 0); return `clear ${s.clear}/${s.n} clearT ${f(s.clearT)}s | deadT ${f(s.deadT)}s | hits ${f(s.hits, 1)} trips ${f(s.trips, 1)} | minGap(clear) ${f(s.minGapClear)}`; }

    const { G, S } = sg(); const r = mkRock(9, 'mid', 1.3 * R_('mid'), 0); for (let i = 0; i < 3; i++) { const e = ev0(); e.landed.push({ rock: r, hit: false }); scoreStep(S, G, e, DT); } return S.bonus === SC.rock && S.n.great === 1;
  })());
  check('スコア：吹き飛び中・復帰後の無敵中は加点しない', (() => {
    const A = sg(), B = sg(); A.G.P.state = 'knocked'; B.G.P.invuln = 1; const e1 = ev0(), e2 = ev0(); e1.landed.push({ rock: mkRock(1, 'mid', 1.3 * R_('mid'), 0), hit: false }); e2.landed.push({ rock: mkRock(2, 'mid', 1.3 * R_('mid'), 0), hit: false });
    scoreStep(A.S, A.G, e1, DT); scoreStep(B.S, B.G, e2, DT); return A.S.bonus === 0 && B.S.bonus === 0;
  })());
  check('スコア：円の中でジャンプして爆風の上を越えたら（1.0 倍未満でも）ギリギリ回避', (() => { const { G, S } = sg(); G.P.y = CFG.hit.maxY + 0.3; const e = ev0(); e.landed.push({ rock: mkRock(1, 'mid', 0.5, 0), hit: false }); scoreStep(S, G, e, DT); return S.bonus === SC.rock; })());
  check('スコア：大型の警告円の中にいて、着弾までに円の外へ逃げ切った → +300（遠く離れていても）。中型では同じでも加点なし', (() => {
    const A = sg(), B = sg(); A.G.RS.rocks.push(mkRock(1, 'large', 0, 0)); B.G.RS.rocks.push(mkRock(2, 'mid', 0, 0));
    scoreStep(A.S, A.G, ev0(), DT); scoreStep(B.S, B.G, ev0(), DT); const inside = A.S.inside[1] === true && B.S.inside[2] === true;
    A.G.RS.rocks = []; B.G.RS.rocks = []; A.G.P.x = 14; B.G.P.x = 14;   // 逃げた（1.8 倍より遠く）
    const ea = ev0(), eb = ev0(); ea.landed.push({ rock: mkRock(1, 'large', 0, 0), hit: false }); eb.landed.push({ rock: mkRock(2, 'mid', 0, 0), hit: false });
    scoreStep(A.S, A.G, ea, DT); scoreStep(B.S, B.G, eb, DT);
    return inside && A.S.bonus === SC.rockLarge && B.S.bonus === 0 && A.S.inside[1] === undefined;
  })());
  check('スコア：実際に stepGame で噴石を落とす：外れて着弾(1.4 倍)で +100、真下で被弾なら加点なし', (() => {
    const run = dx => {
      const G = quietG(), S = newScore(); G.OB.off = true; for (let i = 0; i < 20; i++) stepGame(G, NOI, DT);
      const w = CFG.rock.sizes.mid.warn; spawnRock(G.RS, 'mid', G.P.x + dx, G.P.z - G.P.speed * w - 0.05, null);
      let hit = false; for (let i = 0; i < 120; i++) { const ev = stepGame(G, NOI, DT); scoreStep(S, G, ev, DT); hit = hit || ev.landed.some(l => l.hit); }
      return { S, hit };
    };
    const a = run(1.4 * R_('mid')), b = run(0);
    return a.S.bonus === SC.rock && !a.hit && b.hit && b.S.bonus === 0;
  })());

  // ---- スコア：障害物の連続回避コンボ ----
  const mkOb = (id, z, x) => ({ id, type: 'rock', x: x == null ? 0 : x, z, hw: 1, hd: 1, r: 1, h: 1, hit: false });
  const passAll = (G, S, obs) => { G.OB.list = obs; G.P.z = Math.min(...obs.map(o => o.z)) - 5; scoreStep(S, G, ev0(), DT); };
  check('スコア：障害物を 1・2 個連続は加点なし、3 連続で +150(50×3)、4 連続でさらに +200', (() => {
    const { G, S } = sg(); const obs = [1, 2, 3, 4].map(i => mkOb(i, -10 * i));
    const seen = []; for (const o of obs) { G.OB.list = obs; G.P.z = o.z - 4; scoreStep(S, G, ev0(), DT); seen.push(S.bonus); }
    return seen[0] === 0 && seen[1] === 0 && seen[2] === 150 && seen[3] === 350 && S.combo === 4 && S.n.combo === 2;
  })());
  check('スコア：障害物にぶつかる（ev.obstacle.hits）とコンボがリセットされ、再び 3 連続が必要', (() => {
    const { G, S } = sg(); const obs = [1, 2, 3, 4, 5, 6].map(i => mkOb(i, -10 * i)); G.OB.list = obs;
    G.P.z = -34; scoreStep(S, G, ev0(), DT); const b1 = S.bonus, c1 = S.combo;
    const e = ev0(); e.obstacle.hits.push({ ob: obs[3], kind: 'trip' }); obs[3].hit = true; G.P.z = -44; scoreStep(S, G, e, DT);   // 4 個目にぶつかる
    const c2 = S.combo; G.P.z = -54; scoreStep(S, G, ev0(), DT); G.P.z = -64; scoreStep(S, G, ev0(), DT);
    return c1 === 3 && b1 === 150 && c2 === 0 && S.combo === 2 && S.bonus === 150;
  })());
  check('スコア：遠く(左右に離れて)通っただけの障害物は回避と数えず、コンボも切らない', (() => {
    const { G, S } = sg(); const obs = [mkOb(1, -10), mkOb(2, -20, 12), mkOb(3, -30)]; G.OB.list = obs; G.P.z = -34; scoreStep(S, G, ev0(), DT); return S.combo === 2 && S.bonus === 0;
  })());
  check('スコア：すでに ob.hit の障害物・無敵中に通った障害物は数えない。同じ障害物を何度見ても 1 回だけ', (() => {
    const { G, S } = sg(); const a = mkOb(1, -10); a.hit = true; G.OB.list = [a, mkOb(2, -20)]; G.P.z = -24; G.P.invuln = 1; scoreStep(S, G, ev0(), DT); const c0 = S.combo;
    G.P.invuln = 0; G.OB.list = [mkOb(3, -30)]; G.P.z = -36; scoreStep(S, G, ev0(), DT); scoreStep(S, G, ev0(), DT); scoreStep(S, G, ev0(), DT);
    return c0 === 0 && S.combo === 1;
  })());
  check('スコア：コンボの倍率は上限(comboCap)で頭打ち（暴走しない）', (() => {
    const { G, S } = sg(); const obs = []; for (let i = 1; i <= 14; i++) obs.push(mkOb(i, -10 * i)); G.OB.list = obs; G.P.z = -10 * 14 - 6; scoreStep(S, G, ev0(), DT);
    const last = S.events[S.events.length - 1]; return S.combo === 14 && last.pts === SC.comboMul * SC.comboCap;
  })());
  check('スコア：クレーター・マグマ溜まりも、横に避けて通れば回避（種類ごとの奥行きで判定）', (() => {
    const { G, S } = sg(); G.OB.list = [{ id: 1, type: 'pool', x: 3, z: -10, r: 2.5, hw: 2.5, hd: 2.5, hit: false }]; G.P.z = -10; scoreStep(S, G, ev0(), DT); const before = S.combo; G.P.z = -14; scoreStep(S, G, ev0(), DT); return before === 0 && S.combo === 1;
  })());

  // ---- スコア：マグマが近い状態 ----
  check('スコア：マグマとの距離が 20u 以内で走り続けると 1 秒ごとに +40。離れると連続が途切れる', (() => {
    const { G, S } = sg(); G.M.active = true; G.P.dist = 100; G.M.front = 90;   // 差 10
    for (let i = 0; i < 59; i++) scoreStep(S, G, ev0(), DT); const a = S.bonus; scoreStep(S, G, ev0(), DT); scoreStep(S, G, ev0(), DT); const b = S.bonus;
    for (let i = 0; i < 60; i++) scoreStep(S, G, ev0(), DT); const c = S.bonus;
    G.M.front = 70; scoreStep(S, G, ev0(), DT); const reset = S.nearT === 0; G.M.front = 90; for (let i = 0; i < 59; i++) scoreStep(S, G, ev0(), DT);
    return a === 0 && b === SC.magmaPerSec && c === 2 * SC.magmaPerSec && reset && S.bonus === 2 * SC.magmaPerSec;
  })());
  check('スコア：マグマが遠い・噴火前・吹き飛び中は加点なし', (() => {
    const A = sg(), B = sg(), C = sg(); A.G.M.active = true; A.G.P.dist = 100; A.G.M.front = 50; B.G.M.active = false; B.G.P.dist = 100; B.G.M.front = 90; C.G.M.active = true; C.G.P.dist = 100; C.G.M.front = 90; C.G.P.state = 'knocked';
    for (let i = 0; i < 300; i++) { scoreStep(A.S, A.G, ev0(), DT); scoreStep(B.S, B.G, ev0(), DT); scoreStep(C.S, C.G, ev0(), DT); } return A.S.bonus === 0 && B.S.bonus === 0 && C.S.bonus === 0;
  })());
  check('スコア：合計 = 距離(整数) + ボーナス。ボーナスが無ければ距離そのもの', (() => { const { G, S } = sg(); G.P.dist = 123.9; const a = scoreTotal(S, G.P); S.bonus = 250; return a === 123 && scoreTotal(S, G.P) === 373 && scoreTotal(S, G.P, 500.7) === 750; })());
  check('スコア：同じ入力を 2 回やれば同じ結果（乱数に依らない）', (() => {
    const f = () => { const G = quietG(), S = newScore(); spawnRock(G.RS, 'mid', 3, -40, null); for (let i = 0; i < 180; i++) { const ev = stepGame(G, NOI, DT); scoreStep(S, G, ev, DT); } return JSON.stringify([S.bonus, S.combo, S.n]); };
    return f() === f();
  })());

  // ---- ベストスコア（localStorage）----
  check('ベスト：保存と読み出し。値が無い・壊れた値・負の値は 0', (() => {
    const st = fakeStore(); const a = bestRead(st); bestWrite(st, 4321); const b = bestRead(st);
    st.m[SC.bestKey] = 'abc'; const c = bestRead(st); st.m[SC.bestKey] = '-5'; const d = bestRead(st);
    return a === 0 && b === 4321 && c === 0 && d === 0;
  })());
  check('ベスト：localStorage が例外を投げる/使えない/null でも落ちず、0 や false を返す', (() => {
    let ok = true; try { ok = bestRead(throwing) === 0 && bestWrite(throwing, 5) === false && bestRead(null) === 0 && bestWrite(null, 5) === false && bestRead(undefined) === 0; } catch (e) { return false; }
    let st; try { st = bestStorage(); } catch (e) { return false; }
    return ok && (st === null || typeof st === 'object');
  })());
  check('ベスト：スコアが上回ったときだけ更新・保存（NEW RECORD）。同点・下回りは更新しない', (() => {
    const st = fakeStore(1000), G = newGame(), F = newFlow(st); G.P.dist = 600; flowFinish(F, G.P); const low = !F.newRecord && F.best === 1000 && st.m[SC.bestKey] === '1000';
    G.P.dist = 1000; flowFinish(F, G.P); const same = !F.newRecord && F.best === 1000;
    F.S.bonus = 300; G.P.dist = 1500; flowFinish(F, G.P); return F.best === 0 ? false : low && same && F.newRecord && F.score === 1800 && F.best === 1800 && st.m[SC.bestKey] === '1800';
  })());
  check('ベスト：保存できない環境でも、そのセッション中はベストが更新され、NEW RECORD も出る（例外を出さない）', (() => {
    const G = newGame(), F = newFlow(throwing); const b0 = F.best; G.P.dist = 700; flowFinish(F, G.P); const a = F.newRecord && F.best === 700; G.P.dist = 300; flowFinish(F, G.P); return b0 === 0 && a && !F.newRecord && F.best === 700;
  })());
  check('ベスト：flow を作ると保存済みのベストを読む（タイトルに表示できる）', newFlow(fakeStore(2468)).best === 2468 && newFlow(null).best === 0);

  // ---- クリア演出の状態機械 ----
  const stages = ['runin', 'breathe', 'lookback', 'eruption', 'relief', 'result'];
  const nearGoal = () => { const G = quietG(), F = newFlow(fakeStore(0)); flowStart(F); G.P.dist = CFG.goal.distance - 0.5; G.P.time = 100; G.P.speed = 20.8; return { G, F }; };
  const toClear = (G, F) => { for (let i = 0; i < 10 && F.mode !== 'clear'; i++) stepFlow(F, G, NOI, DT); };
  check('クリア演出：段階は runin→breathe→lookback→eruption→relief→result の順で、秒数は CFG.clear どおり（誤差 1 フレーム）', (() => {
    const { G, F } = nearGoal(); toClear(G, F); if (F.mode !== 'clear') return false;
    const t0 = F.clear.T, at = {}; let t = 0, seq = [F.clear.stage];
    for (let i = 0; i < 60 * 30 && F.clear.stage !== 'result'; i++) { const e = stepFlow(F, G, NOI, DT); t += DT; e.clear.forEach(x => { if (x.indexOf('stage:') === 0) { at[x.slice(6)] = t; seq.push(x.slice(6)); } }); }
    const ex = { breathe: K.runIn, lookback: K.runIn + K.breathe, eruption: K.runIn + K.breathe + K.lookBack, relief: K.runIn + K.breathe + K.lookBack + K.eruption, result: K.runIn + K.breathe + K.lookBack + K.eruption + K.relief };
    return JSON.stringify(seq) === JSON.stringify(stages) && Object.keys(ex).every(k => Math.abs(at[k] - ex[k]) < 2 * DT);
  })());
  check('クリア演出：各段階の出来事（stage:…, boom, relief-text）は 1 回ずつ。boom は eruption の始まり、relief-text は relief の reliefText 秒後', (() => {
    const { G, F } = nearGoal(); toClear(G, F); const cnt = {}, when = {}; let t = 0;
    for (let i = 0; i < 60 * 30 && F.clear.stage !== 'result'; i++) { const e = stepFlow(F, G, NOI, DT); t += DT; e.clear.forEach(x => { cnt[x] = (cnt[x] || 0) + 1; when[x] = t; }); }
    for (let i = 0; i < 120; i++) stepFlow(F, G, NOI, DT).clear.forEach(x => { cnt[x] = (cnt[x] || 0) + 1; });
    const tb = K.runIn + K.breathe + K.lookBack;
    return cnt.boom === 1 && cnt['relief-text'] === 1 && stages.slice(1).every(s => cnt['stage:' + s] === 1) && Math.abs(when.boom - tb) < 2 * DT && Math.abs(when['relief-text'] - (tb + K.eruption + K.reliefText)) < 2 * DT;
  })());
  check('クリア演出：走り込みで指定の距離(stopDist)だけ進んでぴたりと止まり、速さは負にならず、行き過ぎない', (() => {
    for (const v0 of [6, 10, 16, 20.8, 26, 34]) {
      const C = { v0, d0: 0 }; let ps = 0;
      for (let t = 0; t <= K.runIn + 1; t += 0.01) { const r = clearRunAt(C, t); if (r.v < 0 || r.s < ps - 1e-9 || r.s > K.stopDist + 1e-9) return false; ps = r.s; }
      const e = clearRunAt(C, K.runIn); if (Math.abs(e.s - K.stopDist) > 1e-9 || e.v !== 0 || Math.abs(clearRunAt(C, 0).v - v0) > 1e-9) return false;
    }
    return true;
  })());
  check('クリア演出：実際に流して、クリア時の距離から stopDist 先で停止し(P.speed=0)、洞窟の中央(x=0)に寄る。クリア時の結果距離は到達時の値', (() => {
    const { G, F } = nearGoal(); G.P.lane = 2; G.P.x = laneX(2); toClear(G, F); const d0 = G.P.dist, fd = F.dist;
    for (let i = 0; i < 60 * (K.runIn + 0.5); i++) stepFlow(F, G, NOI, DT);
    return Math.abs(G.P.dist - (F.clear.d0 + K.stopDist)) < 1e-6 && G.P.speed === 0 && Math.abs(G.P.x) < 1e-9 && fd === Math.floor(F.clear.d0) && d0 >= CFG.goal.distance && Math.abs(G.P.z + G.P.dist) < 1e-9;
  })());
  check('クリア演出：R は演出中は効かず、結果画面（result）になってから効く。クリア→R で playing に戻り初期化', (() => {
    const { G, F } = nearGoal(); toClear(G, F); let early = false;
    for (let i = 0; i < 60 * 30 && F.clear.stage !== 'result'; i++) { early = early || flowCanRestart(F); stepFlow(F, G, NOI, DT); }
    const ok = !early && flowCanRestart(F); flowRestart(F, G, 4);
    return ok && F.mode === 'playing' && F.clear === null && G.M.phase === 'playing' && G.P.dist === 0 && G.P.state === 'run';
  })());
  check('クリア演出：Space で結果画面へ飛ばせる（skipFrom 秒より前は無視。連打のジャンプで誤って飛ばさない）', (() => {
    const { G, F } = nearGoal(); toClear(G, F); const a = clearSkip(F.clear, G.P);
    for (let i = 0; i < 60 * (K.skipFrom + 0.1); i++) stepFlow(F, G, NOI, DT);
    const st = F.clear.stage, b = clearSkip(F.clear, G.P), c = clearSkip(F.clear, G.P);
    return a.length === 0 && st !== 'result' && b.indexOf('stage:result') >= 0 && b.indexOf('skip') >= 0 && F.clear.stage === 'result' && c.length === 0 && flowCanRestart(F) && Math.abs(G.P.dist - (F.clear.d0 + K.stopDist)) < 1e-6 && F.clear.skipped;
  })());
  check('クリア演出：見た目の値は 0〜1 の範囲で、回る→爆発（閃光・驚き最大）→ほっとの順に動く', (() => {
    const C = { i: 0, t: 0 }, at = (i, t) => { C.i = i; C.t = t; return C; };
    const inRange = [0, 1, 2, 3, 4, 5].every(i => [0, 0.3, 1, 2.5, 4].every(t => { at(i, t); return [clearTurn(C), clearCam(C), clearShock(C), clearRelief(C), clearMega(C), clearFlash(C)].every(v => v >= 0 && v <= 1.0001); }));
    let mono = true, p = -1; for (let t = 0; t <= K.lookBack; t += 0.02) { const v = clearTurn(at(2, t)); if (v < p - 1e-9) mono = false; p = v; }
    return inRange && mono && clearTurn(at(1, 1)) === 0 && clearTurn(at(2, K.lookTurn)) === 1 && clearTurn(at(3, 0)) === 1 && clearCam(at(2, K.lookBack)) === 1 &&
      clearFlash(at(3, 0)) === K.flash.max && clearFlash(at(3, K.flash.sec)) === 0 && clearFlash(at(2, 0)) === 0 && clearShock(at(3, 0)) === 1 && clearShock(at(2, 1)) === 0 &&
      clearRelief(at(3, 1)) === 0 && clearRelief(at(5, 0)) === 1 && clearMega(at(3, 1)) === 1 && clearMega(at(2, 1)) === 0;
  })());
  check('クリア演出：火山の音は走り込みで小さくなり、大爆発で大きく、そのあと小さい。画面揺れは爆発で最大でも cap 以内', (() => {
    const C = { i: 0, t: 0 }, at = (i, t) => { C.i = i; C.t = t; return C; }, V = K.vol;
    const sh = clearShakeAmp(at(3, 0)); at(0, 0); const v0 = clearVolMul(C), v1 = clearVolMul(at(0, K.runIn)), v2 = clearVolMul(at(1, 1)), v3 = clearVolMul(at(3, 1)), v4 = clearVolMul(at(5, 1));
    return v0 === 1 && Math.abs(v1 - V.safe) < 1e-9 && v2 === V.safe && v3 === V.boom && v4 === V.after && V.safe < 1 && V.boom > 1 && fxShakeTotal([sh, 0.3, 0.2]) <= CFG.fx.shake.cap + 1e-9 && sh > 0.4;
  })());
  check('クリア演出：マグマは沈んで静まる（0 → lavaSink）、クリア前は沈まない', (() => { const C = { T: 0 }; const a = clearLavaSink(C); C.T = K.lavaSinkSec; const b = clearLavaSink(C); return a === 0 && Math.abs(b - K.lavaSink) < 1e-9; })());
  check('クリア：到達した距離のスコアが記録され、ベストが更新される（演出より前に確定）', (() => {
    const { G, F } = nearGoal(); toClear(G, F); return F.score >= CFG.goal.distance && F.score === F.dist + F.S.bonus && F.newRecord && F.best === F.score;
  })());
  check('障害物：ゴールの手前 safeZone から先（洞窟）には置かない。それより手前の配置は従来どおり', (() => {
    let nearZone = 0, any = 0, planned = 0; const zone = CFG.goal.distance - CFG.clear.safeZone;
    for (const seed of [1, 7, 99, 1234]) {
      const OB = newObstacles(seed), P = newPlayer(); P.dist = CFG.goal.distance - 100; P.z = -P.dist;
      stepObstacles(OB, P, DT); nearZone += OB.list.filter(o => o.dist >= zone).length; any += OB.list.length;
      planned += planObstacles(seed, -zone, -(zone + 80)).length;   // 何もしなければ置かれていたはずの数（フィルタに効果があること）
    }
    return nearZone === 0 && any > 0 && planned > 0;
  })());
  check('調整値：クリア演出の秒数は合計 10〜20 秒、洞窟は恐竜が入って回り込める大きさ（停止位置が入口より奥、回り込みの半径が半幅以内）', (() => {
    const tot = K.runIn + K.breathe + K.lookBack + K.eruption + K.relief, cv = K.cave;
    return tot >= 10 && tot <= 20 && K.stopDist > cv.mouth - 0 && K.lookTurn < K.lookBack && K.reliefText < K.relief && CFG.orbit.R < cv.halfW && K.stopDist + CFG.orbit.R < cv.mouth + cv.length;
  })());
  check('dt の上限（タブ復帰で巨大にならない）は 0.1 秒以下', CFG.dt.max > 0 && CFG.dt.max <= 0.1);
})();
document.getElementById('sum').textContent = nNg === 0 ? `ALL PASS (${nOk})` : `FAIL ${nNg} / PASS ${nOk}`;
document.getElementById('sum').style.color = nNg === 0 ? '#6bd07a' : '#ff6b6b';
</script>
