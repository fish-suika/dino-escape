<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DINO ESCAPE - 火山から逃げろ！</title>
<style>
  :root{--ink:#f6ece0;--jp:"Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Meiryo","Noto Sans JP",sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#1a0d0b;color:var(--ink);font-family:var(--jp);user-select:none;-webkit-user-select:none}
  #view{position:fixed;inset:0}
  #view canvas{display:block;width:100%;height:100%}
  /* HUD：左上に距離（大きく太く）と控えめなマグマゲージ、右上に危険度。折り返しても崩れない */
  #hud{position:fixed;left:0;right:0;top:0;padding:clamp(8px,2vh,24px) clamp(12px,2.6vw,40px);display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px 16px;pointer-events:none}
  #hudL{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
  #dist{font-size:clamp(28px,4.8vw,68px);font-weight:900;line-height:1.05;letter-spacing:.03em;font-variant-numeric:tabular-nums;color:#fff4e0;-webkit-text-stroke:1.5px rgba(70,14,0,.9);
    text-shadow:0 3px 0 rgba(70,14,0,.95),0 0 22px rgba(255,120,40,.55),0 4px 14px #000}
  #hint{position:fixed;left:0;right:0;bottom:26px;text-align:center;font-size:clamp(12px,1.3vw,18px);letter-spacing:.1em;opacity:.75;pointer-events:none;text-shadow:0 1px 6px #000}
  #hint.on{animation:hintOut 1.4s ease forwards}   /* 開始後 CFG.fx.hintSec 秒で消える（animation-delay を JS で設定） */
  @keyframes hintOut{to{opacity:0}}
  #hitVig{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(255,0,0,0) 30%,rgba(210,0,0,.85) 100%)}
  #hitVig.on{animation:hitVig var(--vigSec,.55s) ease-out}
  @keyframes hitVig{0%{opacity:var(--vigA,.85)}100%{opacity:0}}
  #edge{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(255,40,0,0) 62%,rgba(255,60,0,.55) 100%)}
  #boom{position:fixed;left:0;right:0;top:34%;text-align:center;font-size:clamp(26px,7vw,120px);white-space:nowrap;font-weight:900;letter-spacing:.06em;color:#ffd9a0;-webkit-text-stroke:3px #7a1500;text-shadow:0 0 24px #ff5a14,0 6px 0 #5a0d00;pointer-events:none;opacity:0;transform:scale(.6)}
  #boom.on{animation:boom 2.2s ease-out forwards}
  @keyframes boom{0%{opacity:0;transform:scale(.5)}8%{opacity:1;transform:scale(1.25) rotate(-2deg)}18%{transform:scale(1) rotate(1deg)}75%{opacity:1;transform:scale(1.05)}100%{opacity:0;transform:scale(1.12)}}
  #flash{position:fixed;inset:0;background:#ffb060;opacity:0;pointer-events:none}
  #scream{position:fixed;left:0;right:0;top:44%;text-align:center;font-size:clamp(24px,6vw,96px);white-space:nowrap;font-weight:900;letter-spacing:.05em;color:#fff3c2;-webkit-text-stroke:3px #6a1000;text-shadow:0 0 20px #ff7a1a,0 5px 0 #4a0b00;pointer-events:none;opacity:0}
  #scream.on{animation:scream 1.2s ease-out forwards}
  @keyframes scream{0%{opacity:0;transform:scale(.4) rotate(-6deg)}10%{opacity:1;transform:scale(1.3) rotate(4deg)}20%{transform:scale(1) rotate(-3deg)}35%{transform:scale(1.08) rotate(2deg)}80%{opacity:1}100%{opacity:0;transform:scale(1.15) translateY(-20px)}}
  #oops{position:fixed;left:0;right:0;top:46%;text-align:center;font-size:clamp(22px,5vw,80px);white-space:nowrap;font-weight:900;letter-spacing:.05em;color:#fff3c2;-webkit-text-stroke:3px #4a2a00;text-shadow:0 0 16px #ffb04a,0 5px 0 #3a1c00;pointer-events:none;opacity:0}
  #oops.on{animation:scream .9s ease-out forwards}
  #mute{position:fixed;right:10px;bottom:6px;font-size:11px;opacity:.5;pointer-events:none;text-shadow:0 1px 6px #000}
  #lavaGlow{position:fixed;left:0;right:0;bottom:0;height:42%;pointer-events:none;opacity:0;background:linear-gradient(to top,rgba(255,80,10,.85),rgba(255,60,10,.35) 45%,rgba(255,50,0,0))}
  #heat{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 55%,rgba(255,60,0,0) 45%,rgba(255,50,0,.5) 100%)}
  #danger{padding:clamp(4px,.8vh,10px) clamp(12px,1.6vw,26px);border-radius:999px;background:rgba(20,8,6,.6);border:2px solid currentColor;font-size:clamp(16px,2.3vw,34px);font-weight:900;letter-spacing:.1em;text-shadow:0 2px 8px #000;transition:color .4s;white-space:nowrap}
  #danger.pop{animation:dpop .6s cubic-bezier(.2,1.6,.4,1)}
  @keyframes dpop{0%{transform:scale(1.7)}100%{transform:scale(1)}}
  #danger.d0{color:#9be08f}#danger.d1{color:#ffd86a}#danger.d2{color:#ff9140}#danger.d3{color:#ff4030;animation:hot .5s ease-in-out infinite alternate}
  #clear{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:none;opacity:0;transition:opacity .8s;background:radial-gradient(ellipse at center,rgba(20,30,10,.35),rgba(10,0,0,.7))}
  #clear.on{opacity:1}
  #clear .go{font-size:clamp(40px,10vw,150px);font-weight:900;letter-spacing:.08em;color:#e8ffc0;-webkit-text-stroke:3px #2a5a10;text-shadow:0 0 28px #8aff5a,0 8px 0 #1d3d0a}
  #clear .dist{font-size:clamp(20px,3.4vw,46px);font-weight:700;letter-spacing:.08em;text-shadow:0 2px 10px #000}
  #clear .again{margin-top:10px;font-size:clamp(16px,2.4vw,30px);letter-spacing:.14em;color:#ffcf8a;animation:blink 1.1s ease-in-out infinite alternate}
  #magma{display:flex;align-items:center;gap:7px;padding:2px 11px;border-radius:999px;background:rgba(20,8,6,.4);border:1px solid rgba(255,140,60,.3);opacity:.8;font-size:clamp(11px,1.1vw,15px);letter-spacing:.08em;text-shadow:0 1px 6px #000}
  #magma .dot{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,160,80,.4)}
  #magma .dot.lit{background:#ff9a2a;border-color:#ffd080;box-shadow:0 0 8px #ff7a1a}
  #magma.hot{border-color:#ff5030;color:#ffd0b0;animation:hot .5s ease-in-out infinite alternate}
  #magma.hot .dot.lit{background:#ff3a1a;box-shadow:0 0 10px #ff2a0a}
  @keyframes hot{from{box-shadow:0 0 0 rgba(255,60,20,0)}to{box-shadow:0 0 16px rgba(255,60,20,.8)}}
  #gameover{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:none;opacity:0;transition:opacity .8s;background:radial-gradient(ellipse at center,rgba(40,6,0,.55),rgba(10,0,0,.8))}
  #gameover.on{opacity:1}
  #gameover .go{font-size:clamp(40px,10vw,150px);font-weight:900;letter-spacing:.08em;color:#ffd9a0;-webkit-text-stroke:3px #7a1500;text-shadow:0 0 28px #ff5a14,0 8px 0 #5a0d00}
  #gameover .sub{font-size:clamp(18px,3vw,40px);letter-spacing:.1em;text-shadow:0 2px 10px #000}
  #gameover .dist{font-size:clamp(20px,3.4vw,46px);font-weight:700;letter-spacing:.08em;font-variant-numeric:tabular-nums;text-shadow:0 2px 10px #000}
  #gameover .again{margin-top:10px;font-size:clamp(16px,2.4vw,30px);letter-spacing:.14em;color:#ffcf8a;animation:blink 1.1s ease-in-out infinite alternate}
  @keyframes blink{from{opacity:.45}to{opacity:1}}
  /* GAME OVER / CLEAR の文字演出（下地。Phase 8 で作り込む）：見出しがドンと拡大して着地 → 下の行が順にせり上がる */
  @keyframes goIn{0%{opacity:0;transform:scale(2.6) rotate(-5deg);letter-spacing:.35em}55%{opacity:1;transform:scale(.93) rotate(1deg)}100%{opacity:1;transform:scale(1)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  #gameover.on .go,#clear.on .go{animation:goIn .95s cubic-bezier(.2,1.4,.4,1) both}
  #gameover.on .sub{animation:fadeUp .8s .55s both}
  #gameover.on .dist,#clear.on .dist{animation:fadeUp .8s .85s both}
  #gameover.on .again,#clear.on .again{animation:fadeUp .6s 1.6s both,blink 1.1s 2.2s ease-in-out infinite alternate}
  /* ===== Phase 8：スコア・タイトル・クリア演出 ===== */
  #score{position:relative;font-size:clamp(13px,1.45vw,21px);font-weight:800;letter-spacing:.12em;color:#ffe9b8;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 rgba(70,14,0,.9),0 0 12px rgba(255,150,40,.5),0 2px 8px #000;line-height:1.2}
  #score.bump #scoreTxt{display:inline-block;animation:sbump .35s ease-out}
  @keyframes sbump{0%{transform:scale(1.35);color:#fff}100%{transform:scale(1)}}
  #score .pop{position:absolute;left:100%;top:-2px;margin-left:12px;white-space:nowrap;opacity:0;font-size:1.25em;font-weight:900;color:#ffd24a;-webkit-text-stroke:1px rgba(90,30,0,.9);text-shadow:0 0 10px #ff9a1a,0 2px 6px #000;pointer-events:none}
  #score .pop.on{animation:popUp var(--popSec,1.1s) ease-out forwards}
  @keyframes popUp{0%{opacity:0;transform:translateY(8px) scale(.6)}15%{opacity:1;transform:translateY(0) scale(1.15)}70%{opacity:1}100%{opacity:0;transform:translateY(-16px) scale(1)}}
  #great{position:fixed;left:0;right:0;top:27%;text-align:center;font-size:clamp(24px,5.6vw,92px);white-space:nowrap;font-weight:900;letter-spacing:.07em;font-style:italic;color:#fff3a8;-webkit-text-stroke:3px #7a3a00;text-shadow:0 0 26px #ffd24a,0 0 8px #fff,0 5px 0 #5a2a00;pointer-events:none;opacity:0}
  #great.on{animation:great var(--greatSec,.9s) cubic-bezier(.2,1.2,.4,1) forwards}
  #great.big{color:#ffe0a0;-webkit-text-stroke-color:#8a1a00;text-shadow:0 0 30px #ff7a1a,0 0 10px #fff,0 6px 0 #5a0d00}
  @keyframes great{0%{opacity:0;transform:scale(.4) rotate(-6deg)}14%{opacity:1;transform:scale(1.3) rotate(2deg)}30%{transform:scale(1) rotate(-1deg)}75%{opacity:1}100%{opacity:0;transform:scale(1.1) translateY(-14px)}}
  #title{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:clamp(16px,5vh,64px) 16px clamp(14px,4vh,48px);pointer-events:none;background:linear-gradient(to bottom,rgba(12,2,0,.6),rgba(12,2,0,0) 34%,rgba(12,2,0,0) 55%,rgba(12,2,0,.78))}
  .mode-title #title{display:flex}
  #title .logo{font-size:clamp(24px,7.4vw,150px);font-weight:900;letter-spacing:.06em;line-height:1.05;color:#ffd9a0;-webkit-text-stroke:4px #7a1500;paint-order:stroke fill;text-shadow:0 0 34px #ff5a14,0 8px 0 #5a0d00,0 12px 24px #000;animation:logoIn 1.2s cubic-bezier(.2,1.3,.4,1) both}
  #title .tag{margin-top:6px;font-size:clamp(16px,3vw,40px);font-weight:800;letter-spacing:.2em;color:#ffcf8a;text-shadow:0 2px 10px #000,0 0 16px rgba(255,90,20,.7);animation:fadeUp .8s .5s both}
  @keyframes logoIn{0%{opacity:0;transform:scale(2.2) rotate(-4deg);letter-spacing:.3em}60%{opacity:1;transform:scale(.96)}100%{opacity:1;transform:scale(1)}}
  #title .keys{display:grid;grid-template-columns:repeat(2,auto);gap:6px 22px;justify-content:center;margin:0 auto 14px;padding:10px 20px;border-radius:14px;background:rgba(20,8,6,.55);border:1px solid rgba(255,160,80,.28);font-size:clamp(12px,1.5vw,20px);letter-spacing:.08em;text-align:left;animation:fadeUp .8s .9s both}
  #title .keys div{display:flex;align-items:center;gap:8px;white-space:nowrap}
  #title kbd{display:inline-block;min-width:1.7em;padding:1px 7px;border-radius:6px;border:1px solid rgba(255,220,170,.6);border-bottom-width:3px;background:rgba(60,28,20,.8);color:#ffe9c8;font:inherit;font-weight:800;text-align:center}
  #title .best{font-size:clamp(15px,2.2vw,30px);font-weight:900;letter-spacing:.14em;color:#ffe9b8;text-shadow:0 2px 8px #000;margin-bottom:8px;animation:fadeUp .8s 1.1s both}
  #title .start{font-size:clamp(18px,3vw,40px);font-weight:900;letter-spacing:.16em;color:#fff3c2;-webkit-text-stroke:1.5px #6a1000;text-shadow:0 0 18px #ff7a1a,0 3px 0 #4a0b00;animation:fadeUp .6s 1.3s both,blink 1s 1.9s ease-in-out infinite alternate}
  #boom2{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:clamp(26px,8.2vw,150px);white-space:nowrap;font-weight:900;letter-spacing:.05em;color:#fff0c0;-webkit-text-stroke:4px #8a1000;paint-order:stroke fill;text-shadow:0 0 40px #ff5a14,0 0 12px #fff,0 8px 0 #5a0d00;pointer-events:none;opacity:0}
  #boom2.on{animation:boom2 3.2s ease-out forwards}
  @keyframes boom2{0%{opacity:0;transform:scale(.3)}6%{opacity:1;transform:scale(1.5) rotate(-3deg)}14%{transform:scale(1.15) rotate(2deg)}22%{transform:scale(1.3) rotate(-1.5deg)}30%{transform:scale(1.2) rotate(1deg)}75%{opacity:1;transform:scale(1.25)}100%{opacity:0;transform:scale(1.4)}}
  #relief{position:fixed;left:0;right:0;top:38%;text-align:center;font-size:clamp(24px,6vw,92px);white-space:nowrap;font-weight:800;letter-spacing:.12em;color:#fff8e8;-webkit-text-stroke:2px #3a2a10;paint-order:stroke fill;text-shadow:0 3px 0 #2a1a08,0 0 20px rgba(255,220,160,.6);pointer-events:none;opacity:0}
  #relief.on{animation:relief 2.6s ease-in-out forwards}
  @keyframes relief{0%{opacity:0;transform:translateY(14px) scale(.96)}25%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
  #flash.mega{background:#fff1d6}
  #gameover .score,#clear .score{font-size:clamp(22px,3.6vw,50px);font-weight:900;letter-spacing:.1em;color:#ffe9b8;font-variant-numeric:tabular-nums;text-shadow:0 2px 10px #000,0 0 18px rgba(255,140,40,.6)}
  #gameover .best,#clear .best{font-size:clamp(15px,2.2vw,30px);font-weight:800;letter-spacing:.12em;font-variant-numeric:tabular-nums;text-shadow:0 2px 10px #000}
  #gameover .newrec,#clear .newrec{display:none;margin-left:.6em;color:#ffd24a;-webkit-text-stroke:1px #6a3a00;animation:blink .55s ease-in-out infinite alternate}
  #gameover .best.rec .newrec,#clear .best.rec .newrec{display:inline}
  #gameover.on .score,#clear.on .score{animation:fadeUp .8s 1.05s both}
  #gameover.on .best,#clear.on .best{animation:fadeUp .8s 1.25s both}
  #clear .sub{font-size:clamp(16px,2.6vw,34px);letter-spacing:.12em;text-shadow:0 2px 10px #000}
  #clear.on .sub{animation:fadeUp .8s .55s both}
  /* ===== 一時停止メニュー・再開カウントダウン ===== */
  body.paused>*:not(#pauseUI),body.paused>*:not(#pauseUI) *{animation-play-state:paused!important}   /* 止めている間は CSS の演出も止める */
  #pauseUI{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(20,6,0,.55),rgba(6,0,0,.82));z-index:20}
  #pauseUI.on{display:flex}
  #pauseUI .pbox{text-align:center;padding:0 16px}
  #pauseUI .ptitle{font-size:clamp(34px,7vw,96px);font-weight:900;letter-spacing:.2em;color:#ffd9a0;-webkit-text-stroke:3px #7a1500;paint-order:stroke fill;text-shadow:0 0 26px #ff5a14,0 6px 0 #5a0d00;margin-bottom:clamp(10px,3vh,34px)}
  #pauseUI .pitems button{display:block;width:min(80vw,400px);margin:clamp(6px,1.4vh,12px) auto;padding:clamp(8px,1.5vh,15px) 18px;border-radius:14px;border:2px solid rgba(255,190,120,.4);background:rgba(40,16,10,.82);color:#ffe9c8;font:inherit;font-weight:800;font-size:clamp(16px,2.4vw,28px);letter-spacing:.14em;cursor:pointer;pointer-events:auto;transition:transform .12s,background .12s,box-shadow .12s}
  #pauseUI .pitems button.sel{background:linear-gradient(#d4561a,#a8340c);border-color:#ffd9a0;color:#fff;transform:scale(1.05);box-shadow:0 0 22px rgba(255,120,40,.7)}
  #pauseUI .pnote{margin-top:clamp(8px,2vh,22px);font-size:clamp(11px,1.3vw,17px);letter-spacing:.1em;opacity:.7}
  #pcount{display:none;font-size:clamp(90px,24vw,300px);font-weight:900;line-height:1;color:#fff3c2;-webkit-text-stroke:5px #7a1500;paint-order:stroke fill;text-shadow:0 0 40px #ff7a1a,0 10px 0 #5a0d00}
  #pcount.on{animation:cnt 1s ease-out both}
  @keyframes cnt{0%{opacity:0;transform:scale(1.9)}25%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:.2;transform:scale(.85)}}
  #pauseUI.count .pbox{display:none}
  #pauseUI.count #pcount{display:block}
  #pauseUI.count{background:rgba(6,0,0,.35)}
  @media (max-width:560px){#title .keys{font-size:10.5px;gap:5px 10px;padding:8px 10px;letter-spacing:.04em}}
  .mode-title #hud,.mode-title #hint,.mode-title #edge{display:none}
  .mode-clear #danger,.mode-clear #magma,.mode-clear #hint{display:none}
</style>
</head>
<body class="mode-title">
<div id="view"></div>
<div id="lavaGlow"></div><div id="heat"></div><div id="edge"></div><div id="hitVig"></div>
<div id="hud"><div id="hudL"><div id="dist"></div><div id="score"><span id="scoreTxt"></span><span class="pop"></span><span class="pop"></span><span class="pop"></span><span class="pop"></span></div><div id="magma"><span data-t="magma"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span id="magmaGap">--m</span></div></div><div id="danger" class="d0"></div></div>
<div id="gameover"><div class="go" data-t="gameOver"></div><div class="sub" data-t="gameOverSub"></div><div class="dist" id="overDist"></div><div class="score"><span data-t="score"></span> <span id="overScore">0</span></div><div class="best" id="overBest"><span data-t="best"></span> <span id="overBestN">0</span><span class="newrec" data-t="newRecord"></span></div><div class="again" data-t="again"></div></div>
<div id="clear"><div class="go" data-t="clear"></div><div class="sub" data-t="clearSub"></div><div class="dist" id="clearDist"></div><div class="score"><span data-t="score"></span> <span id="clearScore">0</span></div><div class="best" id="clearBest"><span data-t="best"></span> <span id="clearBestN">0</span><span class="newrec" data-t="newRecord"></span></div><div class="again" data-t="again"></div></div>
<div id="boom" data-t="boom"></div><div id="boom2" data-t="boom2"></div><div id="relief" data-t="relief"></div><div id="great"></div><div id="scream" data-t="scream"></div><div id="oops" data-t="oops"></div><div id="flash"></div><div id="mute"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
